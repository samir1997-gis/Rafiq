    setBar(i*2+1,total);
    const {line}=lines[i];
    const body=el(`<div><p class="kicker">Al-Fātiḥah ${esc(line.ref)} · recited by al-Husary</p><div class="card">
      <div class="fl">${line.words.map(w=>`<button type="button" tabindex="-1"><b>${esc(w.ar)}</b></button>`).join('')}</div>
      <div class="en">${esc(line.en)}</div><p class="taphint" id="nt">Loading the recitation…</p></div></div>`);
    const ws=[...body.querySelectorAll('.fl button')], note=body.querySelector('#nt');
    const lit=k=>ws.forEach((w,j)=>w.classList.toggle('on',j===k));
    const play=()=>{ const go=()=>{ if(!note.isConnected) return;
        if(S.recitation(line)){ note.textContent=S.credit()||''; recite(line, lit, ()=>lit(-1)); } else note.textContent=silentWhy(); };
      S.ready().then(go, go); };
    screen(body,[button(i<lines.length-1?'Next verse':'Continue',()=>{i++;read();}), button('Hear it again',play,true)]);
    play();
  };
  const end=()=>{
    const share=navigator.share ? [button('Share it',()=>navigator.share({title:'Rafiq',
      text:'I just read the first line of al-Fātiḥah in Arabic, letter by letter, with Rafiq.', url:'https://rafiq-arabic.com'}).catch(()=>{}),true)] : [];
    finish(p, step, `<div class="wnote up">📖 <b>You read the first line of al-Fātiḥah</b>, letter by letter<br><span lang="ar" dir="rtl" style="font-family:var(--ar);font-size:1.3rem">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span></div>`, share);
  };
  if(!lines.length) return end();          // no salah data on this page: nothing to read
  read();
}

/* Conversation partner: the other speaker's lines are the unit's own
   conversation, read aloud; the learner answers in their own words and the
   judge says whether the reply fits and how the grammar looks. Nothing is
   generated — if it doesn't fit, a suggested reply from the conversation is
   one tap away. */
/* opts (scenes): {lines, title, done} — a real-life scene instead of the unit's conversation */
function runChat(p, step, opts){
  const lines=opts ? opts.lines : RafiqPath.unitData(p.n).dialogue;
  const situation=opts ? opts.situation : (()=>{ const u=RafiqPath.unitData(p.n); return u.en+': '+((u.convos&&u.convos[0].sub)||''); })();
  const done=opts ? opts.done : ()=>finish(p, step);
  const turns=[]; for(let i=0;i+1<lines.length;i+=2) turns.push([lines[i],lines[i+1]]);
  const judge=window.RafiqJudge&&RafiqJudge.on;
  // The conversation partner is part of Complete (everyone has Complete during the beta).
  if(judge && window.RafiqPlan && !RafiqPlan.isComplete()){
    const c=RafiqPlan.PRICES.complete;
    const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'}</p><div class="card">
      <div style="font-size:40px">💬</div><h3 style="margin:8px 0">Part of Rafiq Complete</h3>
      <p style="color:var(--ink-soft)">Reply to the other speaker in your own words and get feedback on every reply.
      ${c.yearly} a year or ${c.monthly} a month.</p></div></div>`);
    screen(body,[button('See Complete',()=>{location.href='plans.html'}),
      opts ? button('Back to practice',()=>{location.href='practise.html'},true) : button('Skip this step',done,true)]);
    return;
  }
  let t=0;
  /* How the learner replies (TypeSafe: tools/typesafe-exp/early_answers.py, #118): units 1–2 pick
     the right reply from three, unit 3 builds it from word tiles, and own-words typing from unit 4.
     "Type it in your own words" is always there. Settings' "always type" keeps typing; real-life
     scenes (opts) stay as they are. */
  const pref=RafiqPath.answerPref();
  const early = !opts && p && pref!=='type' ? (+p.n<=2 ? 'pick' : (+p.n===3 || pref==='tiles') ? 'tiles' : null) : null;
  let ownWords=false;
  const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'} · you reply</p><div class="chat" id="chat"></div>
    <div id="alt" style="margin-top:12px"></div>
    <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ رَدَّكَ هُنا" style="min-height:70px"></textarea></div>`);
  const chat=body.querySelector('#chat'), ta=body.querySelector('textarea'), alt=body.querySelector('#alt');
  const add=(cls,ar,en)=>{ const b=el(`<div class="bub ${cls}">${ar?`<div class="a">${esc(ar)}</div>`:''}${en?`<div class="e">${esc(en)}</div>`:''}</div>`);
    chat.appendChild(b); b.scrollIntoView({block:'nearest'}); return b; };
  const send=button(judge?'Send':'Show a suggested reply',()=>reply());
  // the Arabic for this turn's goal, if they want it
  const hint=button('Show the Arabic',()=>{ const s=add('them hintb',turns[t][1][1],''); s.onclick=()=>say(turns[t][1][1],s); },true);
  const earlier=[];   // what the learner has said so far (the partner's later lines may refer to it)
  const useSuggested=()=>button('Use this reply',()=>{ const s=turns[t][1]; add('me',s[1],''); earlier.push(s[1]); t++; turn(); },true);
  const next=button('Continue',()=>{ t++; turn(); });
  // units 1–3: the reply they give (picked or built), then say it aloud and carry on
  const replied=(ok)=>{
    const r=turns[t][1], m=add('me',r[1],r[2]); m.onclick=()=>say(r[1],m); earlier.push(r[1]);
    add('note '+(ok?'ok':'no'),'', ok?'✓ Now say it aloud.':'That’s the reply that fits. Say it aloud.');
    say(r[1],m); screen(body,[next]);
  };
  const ownBtn=()=> judge ? button('Type it in your own words',()=>{
    ownWords=true; alt.innerHTML='';
    add('note goal','','In your own words: “'+turns[t][1][2]+'”');
    ta.value=''; ta.classList.remove('hide'); screen(body,[send,hint]); ta.focus(); },true) : null;
  function pick(){
    const right=turns[t][1];
    const others=shuffle(turns.filter((x,j)=>j!==t).map(x=>x[1]).filter(x=>x[1]!==right[1])).slice(0,2);
    let chosen=false;
    shuffle([right].concat(others)).forEach(o=>{
      const bt=document.createElement('button'); bt.type='button'; bt.className='opt'; bt.dir='rtl';
      bt.style.cssText='display:block;width:100%;text-align:right;margin-top:8px;font-family:var(--ar);font-size:20px;line-height:1.7';
      bt.textContent=o[1]; bt._o=o;
      bt.onclick=()=>{ if(chosen) return; chosen=true;
        const ok=o===right; bt.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
        if(!ok) [...alt.querySelectorAll('.opt')].find(x=>x._o===right).classList.add('right');
        // a moment to see green/red, then the reply joins the conversation
        setTimeout(()=>{ if(!alt.isConnected) return; alt.innerHTML=''; replied(ok); }, ok ? 700 : 1400); };
      alt.appendChild(bt);
    });
    screen(body,[ownBtn()].filter(Boolean));
  }
  function build(){
    const right=turns[t][1], w=[];
    right[1].split(/\s+/).filter(Boolean).forEach(x=>{ if(!x.replace(/[؟?!.،,:]/g,'')&&w.length) w[w.length-1]+=x; else w.push(x); });
    const size=Math.ceil(w.length/7), parts=[]; for(let i=0;i<w.length;i+=size) parts.push(w.slice(i,i+size).join(' '));
    let done=false; const fin=ok=>{ if(done) return; done=true; setTimeout(()=>{ if(!alt.isConnected) return; alt.innerHTML=''; replied(ok); }, 900); };
    const tl=RafiqTiles.create({parts, en:right[2], say, onCorrect:r=>fin(r.firstTry)});
    alt.appendChild(tl.el);
    screen(body,[button('Show the answer',()=>{ tl.reveal(); fin(false); },true), ownBtn()].filter(Boolean));
  }
  function them(){
    const [a]=turns[t]; setBar(t,turns.length);
    const b=add('them',a[1],a[2]); b.onclick=()=>say(a[1],b); say(a[1],b);
    alt.innerHTML='';
    if(early && !ownWords){
      ta.classList.add('hide');
      add('note goal','','Your turn. Reply: “'+turns[t][1][2]+'”');
      return early==='pick' ? pick() : build();
    }
    // what to get across — the wording is theirs, so the partner's next line still makes sense
    if(judge) add('note goal','','Your turn — in your own words: “'+turns[t][1][2]+'”');
    ta.value=''; ta.classList.remove('hide');
    screen(body,[send,hint]);
  }
  function turn(){ ownWords=false; if(t>=turns.length) return done(); them(); }
  async function reply(){
    const [a,sug]=turns[t], said=ta.value.trim();
    if(!judge){ add('me',sug[1],'Suggested: '+sug[2]); say(sug[1],null); ta.classList.add('hide'); screen(body,[next]); return; }
    if(!said) return;
    add('me',said,'');
    ta.classList.add('hide');
    const wait=add('note','','Checking…');
    const nx=turns[t+1] ? turns[t+1][0] : null;
    const v=await RafiqJudge.reply(a[1],a[2],sug[1],said,situation, nx&&nx[1], nx&&nx[2], earlier);
    wait.remove();
    if(!v){ add('note','','Couldn\'t check just now. One way to reply: '+sug[1]+' — '+sug[2]); screen(body,[next]); return; }
    if(!v.fits){
      window.RafiqSound&&RafiqSound.answer(false);
      const n=add('note no','',"That doesn't quite answer what they said. Try again, or here's one way:");
      const s=add('them',sug[1],sug[2]); s.onclick=()=>say(sug[1],s);
      ta.classList.remove('hide'); ta.value='';
      screen(body,[send,useSuggested()]);
      return;
    }
    if(!v.follows){
      // a sensible reply, but the other speaker's next line was written for something else:
      // don't let the conversation stop making sense — ask for the missing part instead
      add('note','',"Good Arabic! But their next line assumes you said “"+sug[2]+"” — add that and send again, or use this reply:");
      const s=add('them',sug[1],''); s.onclick=()=>say(sug[1],s);
      ta.classList.remove('hide'); ta.value=said;
      screen(body,[send,useSuggested()]);
      return;
    }
    earlier.push(said);
    window.RafiqSound&&RafiqSound.answer(true);
    add('note '+(v.grammar==='slip'?'no':'ok'),'',
      v.grammar==='ok'?'✓ Good reply.' : v.grammar==='slip'?'✓ Good reply — but check this: '+v.why : '✓ That works.');
    screen(body,[next]);
  }
  turn();
}

/* ── recaps and the unit test (#158) ─────────────────────────
   One kind of question for both: a word's meaning, a word heard, or a gap in a
   sentence ({t:'mean'|'hear', id} or {t:'cloze', u, i}). A wrong answer brings
   the word or sentence back for review tomorrow. */
const clozeOf=q=>RafiqPath.unitData(q.u).cloze[q.i];
const skel=t=>t.replace(/[ً-ْٰـ؟?.]/g,'').trim();
function question(q, pool){
  if(q.t==='b'){ const d=BASICS[Math.floor(q.id/100)].drills[q.id%100], [qq, shown, opts, why]=d, gap=shown.includes('___');
    const said=gap ? shown.replace('___',opts[0]) : hasAr(opts[0]) ? opts[0] : shown;
    return {kicker:qq, id:'b:'+q.id, opts, right:opts[0], ar:hasAr(opts.join('')), say:said||opts[0],
      html:`<div class="card">${shown?`<div class="big" id="w">${esc(shown).replace('___','<span class="gap">___</span>')}</div>`:'<span id="w"></span>'}<div class="en" style="margin-top:10px">${withAr(qq)}</div></div>`,
      answer:`${said?`<div class="big" lang="ar">${esc(said)}</div>`:''}<div class="en">${withAr(qq)} ${esc(opts[0])}</div>${why?`<p class="why">${withAr(why)}</p>`:''}`}; }
  if(q.t==='cloze'){ const d=clozeOf(q), full=d.q.replace('___',d.o[d.a]);
    return {kicker:'Fill the gap', id:'d:'+q.u+'|cloze|'+q.i, opts:d.o, right:d.o[d.a], ar:true, say:full,
      html:`<div class="card"><div class="mid" id="w" lang="ar" dir="rtl">${esc(d.q).replace('___','<span class="gap">___</span>')}</div></div>`,
      answer:`<div class="mid" lang="ar" dir="rtl">${esc(full)}</div>${d.w?`<div class="en">${esc(d.w)}</div>`:''}`}; }
  const w=RafiqPath.wordById(q.id), answer=`<div class="big" lang="ar">${esc(w.ar)}</div><div class="en">${esc(w.en)}</div>`;
  if(q.t==='hear'){ const used=new Set([skel(w.ar)]);
    const others=shuffle(pool).filter(x=>!used.has(skel(x.ar)) && used.add(skel(x.ar))).slice(0,3);
    return {kicker:'Hear it, pick the word', id:'v:'+w.id, opts:others.map(x=>x.ar).concat(w.ar), right:w.ar, ar:true, say:w.ar, answer,
      html:`<div class="card"><button class="hear big-hear" type="button" id="w" aria-label="Hear it again">🔊</button></div>`}; }
  // hear it, tap its picture (#358): no two pictures the same, and no word that sounds almost like it
  if(q.t==='pic'){ const pics=[];
    if(PICS.has(w.id)) shuffle(pool).forEach(x=>{ if(pics.length<3 && x!==w && PICS.has(x.id) && skel(x.ar)!==skel(w.ar) && !tooClose(x.en,w.en)
      && ![w].concat(pics).some(y=>samePic(x.id,y.id))) pics.push(x); });
    if(pics.length<3) return question({t:'hear', id:q.id}, pool);
    return {kicker:'Hear it, tap the picture', id:'v:'+w.id, opts:pics.map(x=>x.id).concat(w.id), right:w.id, pic:true, say:w.ar, answer,
      html:`<div class="card"><button class="hear big-hear" type="button" id="w" aria-label="Hear it again">🔊</button><div class="after" hidden>${answer}</div></div>`}; }
  const others=shuffle(pool.filter(x=>x!==w && !tooClose(x.en,w.en))).slice(0,3);
  // from the meaning to the Arabic (#358): the harder way round; nothing is said until it's answered
  if(q.t==='say'){ const used=new Set([w.ar.trim()]), ar=others.filter(x=>!used.has(x.ar.trim()) && used.add(x.ar.trim()));
    return {kicker:'How do you say it in Arabic?', id:'v:'+w.id, opts:ar.map(x=>x.ar).concat(w.ar), right:w.ar, ar:true, quiet:true, say:w.ar, answer,
      html:`<div class="card">${PICS.has(w.id)?`<div class="pic sm" aria-hidden="true">${wordPic(w.id)}</div>`:''}<div class="en" id="w" style="margin:0">${esc(gloss(w.en))}</div><p class="howto">In Arabic?</p></div>`}; }
  return {kicker:'What does this mean?', id:'v:'+w.id, opts:others.map(x=>gloss(x.en)).concat(gloss(w.en)), right:gloss(w.en), say:w.ar, answer,
    html:`<div class="card"><div class="big" id="w">${esc(w.ar)}</div></div>`};
}
/* One question on screen. onAnswer(ok) as soon as it's answered; Next goes on. */
let asking=null;                         // the question on screen (for tests/review.py)
function askOne(x, head, onAnswer, onNext){
  asking=x;
  const body=el(`<div><p class="kicker">${esc(head||x.kicker)}</p>${x.html}<div class="opts${x.ar?' ar-opts':''}${x.pic?' pic-opts':''}" id="o"></div></div>`);
  const a=body.querySelector('#w'), play=()=>say(x.say,a); if(!x.quiet) a.onclick=play;
  const next=button('Next',onNext); next.disabled=true;
  shuffle(x.opts).forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b._o=o; if(x.ar){ b.lang='ar'; b.dir='rtl'; }
    if(x.pic){ b.innerHTML=wordPic(o); b.setAttribute('aria-label', gloss(RafiqPath.wordById(o).en)); } else b.textContent=o;
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=o===x.right; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(e=>e._o===x.right).classList.add('right');
      if(!ok && !x.free && !x.id.startsWith('b:')) Progress.grade(x.id,'again');   // a basics pick isn't a review item; a lesson's own questions aren't either (free)
      const af=body.querySelector('.after'); if(af) af.hidden=false;
      next.disabled=false; onAnswer(ok);
      if(ok) autoNext(next, x.say, a); else say(x.say,a); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
  if(x.kicker.startsWith('Hear')) play();
}
/* A phrase built from its words (tiles.js), from the meaning (#358): the exact order, with up to two tiles that
   don't belong. Right first time counts as right; graded: a miss goes into review, as askOne's does. */
function buildOne(w, pool, head, graded, onAnswer, onNext){
  const parts=w.ar.trim().split(/\s+/);
  asking={id:'v:'+w.id, build:true, right:w.ar, parts};
  // tiles that don't belong: other words' pieces, but never a piece's twin with or without its last vowel mark (السَّلام / السَّلامُ)
  const bare=t=>t.replace(/[\u064B-\u0652]+$/,'');
  const decoys=shuffle([...new Set(pool.filter(x=>x!==w && !x.ar.includes('/')).flatMap(x=>x.ar.trim().split(/\s+/)))]
    .filter(t=>!parts.some(q=>q===t || bare(q)===t || bare(t)===q))).slice(0,2);
  const body=el(`<div><p class="kicker">${esc(head)}</p><div class="card">${PICS.has(w.id)?`<div class="pic sm" aria-hidden="true">${wordPic(w.id)}</div>`:''}
    <div class="en" style="margin:0">${esc(gloss(w.en))}</div><p class="howto">Build the Arabic: tap the tiles in order.${decoys.length?' Some tiles are extra.':''}</p></div><div id="t"></div></div>`);
  const next=button('Next',onNext); next.disabled=true;
  let told=false;
  const settle=ok=>{ if(told) return; told=true; if(!ok && graded) Progress.grade('v:'+w.id,'again'); next.disabled=false; onAnswer(ok); };
  const tl=RafiqTiles.create({parts, extra:decoys, en:w.en, strict:true, say:(t,e)=>say(t,e), onCorrect:r=>settle(r.firstTry)});
  body.querySelector('#t').appendChild(tl.el);
  screen(body,[next, button('Show the answer',()=>{ tl.reveal(); say(w.ar,null); settle(false); },true)]);
}

/* Recap: before the next lesson, every two lessons (RafiqPath.recapDue), five
   words from earlier lessons: the ones due first, then the ones reviewed longest
   ago. Chosen with TypeSafe (tools/typesafe-exp/review_progress.py). */
const RECAP_N=5;
function recapWords(p){
  const now=new Set((p.words||[]));        // not the unit you're in: its words are fresh
  const met=[...RafiqPath.metWords()].filter(id=>!now.has(id)).map(RafiqPath.wordById).filter(Boolean);
  const at=w=>{ const r=Progress.get('v:'+w.id); return r&&r.at||''; };
  const due=shuffle(met.filter(w=>Progress.isDue('v:'+w.id)));
  const rest=met.filter(w=>!Progress.isDue('v:'+w.id)).sort((a,b)=>at(a)<at(b)?-1:1);
  return {pick:due.concat(rest).slice(0,RECAP_N), pool:met};
}
/* Review (#335): after each lesson of 5, ten quick questions: three of the words just met and seven
   earlier ones (due first, then those reviewed longest ago), mixed, half by meaning and half by ear.
   Teach a small set together, then mix it with older words (the report, #324). A right answer on a
   word that was due moves it on in the schedule; a miss brings any word back tomorrow. It counts as
   the recap (#158), so the two don't stack. */
const REVIEW_N=10, REVIEW_FRESH=3;
function reviewWords(p, step){
  const fresh=RafiqPath.wordsOf(p, step.batch), freshIds=new Set(fresh.map(w=>w.id));
  const met=[...RafiqPath.metWords()].filter(id=>!freshIds.has(id)).map(RafiqPath.wordById).filter(Boolean);
  const at=w=>{ const r=Progress.get('v:'+w.id); return r&&r.at||''; };
  const due=shuffle(met.filter(w=>Progress.isDue('v:'+w.id)));
  const rest=met.filter(w=>!Progress.isDue('v:'+w.id)).sort((a,b)=>at(a)<at(b)?-1:1);
  const earlier=due.concat(rest).slice(0, REVIEW_N-REVIEW_FRESH);
  // few earlier words yet (the first lessons): more of the new ones
  return {pick:shuffle(earlier.concat(shuffle(fresh).slice(0, REVIEW_N-earlier.length))), pool:met.concat(fresh)};
}
function runReview(p, step){
  const {pick, pool}=reviewWords(p, step), plus=PLUS.has(p.n);
  let k=0, right=0;
  const show=()=>{
    if(k>=pick.length){ RafiqPath.recapDone();
      return finish(p, step, `<p>${right} of ${pick.length} right. ${right===pick.length?'You remembered every one 🎉':'The ones you missed come back tomorrow.'}</p>`,
        plus && speedPool(p).length>=4 ? [button(`⚡ Bonus game: how many in ${SPEED_SECS} seconds?`,()=>speedRound(p),true)] : []); }
    setBar(k,pick.length);
    const w=pick[k], due=Progress.isDue('v:'+w.id), head=`Review · ${k+1} of ${pick.length}`;
    const onAnswer=ok=>{ if(ok){ right++; if(due) Progress.grade('v:'+w.id,'good'); } }, onNext=()=>{k++;show();};
    // units 1 and 2 (#358): by meaning, by ear with pictures, and from the meaning to the Arabic
    const t=plus ? ['mean','pic','say'][k%3] : k%2?'hear':'mean';
    if(t==='say' && isPhrase(w)) return buildOne(w, pool, head, true, onAnswer, onNext);
    askOne(question({t, id:w.id}, pool), head, onAnswer, onNext);
  };
  show();
}
/* Beat the clock (#358): a bonus after a review in units 1 and 2, started from its done screen, so the step is
   already finished and nothing here is scored into the review schedule. 40 seconds; a word comes up with two
   meanings, as many as you can. Quick recall of words already met builds fluency (the fourth of Nation's four
   strands). A miss shows the right one and costs 3 seconds, so guessing never beats knowing. The best score
   is kept on this device. */
const SPEED_SECS=40, SPEED_MISS=3;
// the words it draws on: the unit's words met so far, or every word met when those are few
function speedPool(p){
  const unit=new Set(p.words), all=[...RafiqPath.metWords()].map(RafiqPath.wordById).filter(Boolean), mine=all.filter(w=>unit.has(w.id));
  return mine.length>=4 ? mine : all;
}
function speedRound(p, o){              // o (#361): {pool, head, key}, a round on something other than the unit's words (letters and their sounds)
  const pool=o?o.pool:speedPool(p), key=o?o.key:'rafiq_speed_best';
  const body=el(`<div><p class="kicker">Beat the clock · ${o?o.head:'tap the meaning'}</p>
    <div class="sp-hud"><span id="t">0:${SPEED_SECS}</span><div class="sp-bar"><i id="b"></i></div><span id="s">⚡ 0</span></div>
    <div class="card"><div class="big" id="w" lang="ar" style="cursor:default"></div></div><div class="opts sp-opts" id="o"></div></div>`);
  const big=body.querySelector('#w'), opts=body.querySelector('#o'), tEl=body.querySelector('#t'), bar=body.querySelector('#b'), sEl=body.querySelector('#s');
  let score=0, last=null, locked=false, over=false, endAt=Date.now()+SPEED_SECS*1000;
  const ask=()=>{
    if(over) return;
    let w; do{ w=pool[Math.floor(Math.random()*pool.length)]; }while(w===last); last=w;
    const far=pool.filter(x=>x!==w && !tooClose(x.en,w.en)), d=far[Math.floor(Math.random()*far.length)];
    big.textContent=w.ar; opts.innerHTML=''; locked=false;
    shuffle([w,d]).forEach(x=>{ const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=gloss(x.en); b._w=x;
      b.onclick=()=>{ if(over || locked) return; locked=true;
        const ok=x===w; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
        if(ok){ score++; sEl.textContent='⚡ '+score; return setTimeout(ask, 220); }
        [...opts.children].find(o=>o._w===w).classList.add('right');
        endAt-=SPEED_MISS*1000; tEl.classList.add('pen'); setTimeout(()=>{ tEl.classList.remove('pen'); ask(); }, 1100); };
      opts.appendChild(b); });
  };
  const end=()=>{
    over=true; clearInterval(timer);
    let best=0; try{ best=+localStorage.getItem(key)||0; if(score>best) localStorage.setItem(key, score); }catch(_){}
    const n=RafiqPath.next();
    const done=el(`<div class="done"><div class="tick">⚡</div><h2>${score} right in ${SPEED_SECS} seconds</h2>
      <p>${best && score>best ? `Your best yet 🏆 (it was ${best})` : best ? `Your best: ${best}` : 'Nice! Next time, try to beat it.'}</p></div>`);
    screen(done, doneButtons(n, n.step&&n.unit.n===p.n).concat([button('Play again',()=>speedRound(p, o),true)]));
  };
  const timer=setInterval(()=>{
    if(!body.isConnected) return clearInterval(timer);
    const left=Math.max(0, (endAt-Date.now())/1000);
    tEl.textContent='0:'+String(Math.ceil(left)).padStart(2,'0'); bar.style.width=(100*left/SPEED_SECS)+'%'; bar.classList.toggle('low', left<=10);
    if(left<=0) end();
  }, 200);
  screen(body,[]); ask();
}
function runRecap(p, then){
  const {pick, pool}=recapWords(p);
  if(pick.length<RECAP_N) return then();
  let k=0, right=0;
  const show=()=>{
    if(k>=pick.length){ RafiqPath.recapDone(); RafiqPath.markDay(); setBar(1,1);
      const body=el(`<div class="done"><div class="tick">✓</div><h2>Recap — ${right} of ${pick.length}</h2>
        <p>${right===pick.length?'You remembered every one 🎉 On to the next lesson.':'The ones you missed come back for review tomorrow.'}</p></div>`);
      return screen(body,[button('Start the lesson',then)]); }
    setBar(k,pick.length);
    askOne(question({t:k%2?'hear':'mean', id:pick[k].id}, pool), `Quick recap · ${k+1} of ${pick.length}`, ok=>{ if(ok) right++; }, ()=>{k++;show();});
  };
  show();
}

/* The unit test: 18 questions from the unit: 3 words heard, 5 sentence gaps, the rest meanings.
   Pass with 80%. Below that, the questions missed are reviewed (the answer, then
   the question again until it's right) before a retake; the next unit opens on a
   pass. Chosen with TypeSafe (tools/typesafe-exp/review_progress.py): 18 questions;
   it leaned slightly to 90%, but 80% leaves room for a slip on a sound. */
const PASS=0.8;
function testQuestions(p){
  if(p.basics){ const ws=shuffle(RafiqPath.wordsOf(p));
    return shuffle(BASICS.flatMap((l,li)=>shuffle(l.drills.map((_,i)=>({t:'b', id:li*100+i}))).slice(0,2))).slice(0,12)   // 18 in all, however many lessons (#277)
      .concat(ws.slice(0,4).map(w=>({t:'mean',id:w.id})), ws.slice(4,6).map(w=>({t:'hear',id:w.id}))); }
  const words=shuffle(RafiqPath.wordsOf(p)), u=RafiqPath.unitData(p.n);
  let cl=((u&&u.cloze)||[]).map((d,i)=>({t:'cloze',u:p.n,i,d}));
  if(RafiqPath.teaches(p.n) && window.RafiqTeach){ const k=RafiqTeach.taught(p.n);
    cl=cl.filter(x=>RafiqTeach.coverage(x.d.q.replace('___',' ')+' '+x.d.o.join(' '),k)>=0.8); }
  cl=shuffle(cl).slice(0,5);
  const m=15-cl.length;                   // fewer gaps (unit 1 has 4 from taught words): more meanings
  return words.slice(0,m).map(w=>({t:'mean',id:w.id})).concat(words.slice(m,m+3).map(w=>({t:'hear',id:w.id})),
    cl.map(({t,u,i})=>({t,u,i})));
}
function runTest(p, step){
  const pool=RafiqPath.wordsOf(p), drillOf=q=>(BASICS[Math.floor(q.id/100)]||{drills:[]}).drills[q.id%100];
  const missedBefore=(RafiqPath.testReview(p.n)||[]).filter(q=>q.t!=='b' || drillOf(q));   // the basics' lessons moved (#277)
  if(missedBefore.length) return reviewMistakes(p, step, missedBefore);
  const qs=testQuestions(p), missed=[];
  let k=0;
  const show=()=>{
    if(k>=qs.length) return result();
    setBar(k,qs.length);
    askOne(question(qs[k],pool), `Unit test · ${k+1} of ${qs.length}`, ok=>{ if(!ok) missed.push(qs[k]); }, ()=>{k++;show();});
  };
  const result=()=>{
    const right=qs.length-missed.length, pct=Math.round(100*right/qs.length);
    if(right>=Math.ceil(PASS*qs.length))
      return finish(p, step, `<div class="wnote up">🎓 <b>${right} of ${qs.length}</b> (${pct}%) — ${p.basics?'the basics':'unit '+(+p.n)} passed</div>`
        + (p.basics ? `<div class="wnote"><span lang="ar" dir="rtl" style="font-family:var(--ar);font-size:1.2rem">${withMyName(BASICS_GOAL[basicsG()]).html}</span><br>${myName()?'You can say it.':'You can say it, with your own name.'}</div>` : ''),
        p.basics && speedPool(p).length>=4 ? [button(`⚡ Bonus game: how many in ${SPEED_SECS} seconds?`,()=>speedRound(p),true)] : []);   // #361: the basics' words against the clock
    RafiqPath.testFailed(p.n, missed); setBar(1,1);
    const body=el(`<div class="done"><div class="tick">${right} / ${qs.length}</div><h2>Not quite yet</h2>
      <p>You need ${Math.ceil(PASS*qs.length)} to pass. Go over the ${missed.length} you missed, then try the test again.</p></div>`);
    screen(body,[button('Review my mistakes',()=>reviewMistakes(p, step, missed)), button('Complete',()=>{location.href='dashboard.html'},true)]);
  };
  show();
}
function reviewMistakes(p, step, missed){
  const pool=RafiqPath.wordsOf(p), left=missed.slice();
  const show=()=>{
    if(!left.length){ RafiqPath.testReviewed(p.n); setBar(1,1);
      const body=el(`<div class="done"><div class="tick">✓</div><h2>Mistakes reviewed</h2><p>Ready when you are.</p></div>`);
      return screen(body,[button('Try the test again',()=>runTest(p, step)), button('Complete',()=>{location.href='dashboard.html'},true)]); }
    setBar(missed.length-left.length, missed.length);
    const q=left[0], x=question(q,pool);
    // the right answer first, then the question
    const body=el(`<div><p class="kicker">Your mistakes · ${missed.length-left.length+1} of ${missed.length}</p>
      <div class="card" id="w">${x.answer}</div><p class="howto">Tap to hear it, then try it again</p></div>`);
    const a=body.querySelector('#w'); a.onclick=()=>say(x.say,a);
    screen(body,[button('Try it',()=>askOne(question(q,pool), 'Try it again', ok=>{ left.shift(); if(!ok) left.push(q); }, show))]);
    say(x.say,a);
  };
  show();
}

function runPractise(p){
  location.href='session.html?unit='+p.n+'&n=10';
}

/* The basics (#165): a lesson is 1-2 teaching screens (examples to tap and hear), then 8 quick picks on
   single words and short sentences. A missed pick comes back at the end until it's right. When it's done,
   the lesson's words count as met: into review, back tomorrow. */
const hasAr=t=>/[\u0600-\u06FF]/.test(t);
function basicsDrill(d, head, onAnswer, onNext, guess){        // guess (#361): asked before the teaching, so a miss makes no sound
  const [q, shown, opts, why]=d, right=opts[0], ar=hasAr(opts.join(''));
  const gap=shown.includes('___');
  const body=el(`<div><p class="kicker">${esc(head)}</p><div class="card">
      ${shown?`<div class="big" id="w" style="font-size:${gap||shown.length>12?'clamp(1.6rem,7vw,2.2rem)':''}">${esc(shown).replace('___','<span class="gap">___</span>')}</div>`:''}
      <div class="en" style="margin-top:${shown?12:0}px">${withAr(q)}</div></div>
    <div class="opts${ar?' ar-opts':''}" id="o"></div><p class="why hide" id="y">${withAr(why||'')}</p>${guess?'<p class="taphint" id="gh">Not sure? Just guess. Getting it wrong is fine: the lesson comes next.</p>':''}</div>`);
  const w=body.querySelector('#w');
  // what to say: the finished sentence for a gap, the right Arabic answer, or the Arabic shown
  const spoken=gap ? shown.replace('___', right) : ar ? right : shown;
  if(w && !gap) w.onclick=()=>say(shown,w);
  const next=button('Next',onNext); next.disabled=true;
  shuffle(opts).forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=o; if(hasAr(o)){ b.lang='ar'; b.dir='rtl'; }
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=o===right; b.classList.add(ok?'right':'wrong'); if(ok || !guess) window.RafiqSound&&RafiqSound.answer(ok);
      const r=[...body.querySelectorAll('.opt')].find(e=>e.textContent===right); if(!ok) r.classList.add('right');
      if(gap && w) w.textContent=spoken;
      body.querySelector('#y').classList.remove('hide'); if(guess) body.querySelector('#gh').remove();
      next.disabled=false; onAnswer(ok);
      if(spoken) say(spoken, w||r); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
  if(w && !gap && !ar) say(shown,w);
}
/* The basics' goal (#168): the sentence the section builds up, as a man or a woman says it. */
const basicsG=()=>{ try{ return localStorage.getItem('rafiq_basics_g')==='f' ? 'f' : 'm'; }catch(_){ return 'm'; } };
const setBasicsG=g=>{ try{ localStorage.setItem('rafiq_basics_g', g); }catch(_){} };
/* The learner's own name (#169): the first name given at sign-up, in Arabic when it's a common name
   (BASICS_NAMES), otherwise as typed. null when there's no name, and the example name stays. */
const EXAMPLE_NAMES=['سَمِير','مَرْيَم'];
function myName(){
  let raw=''; try{ raw=(localStorage.getItem('bay_name')||'').trim().split(/\s+/)[0]||''; }catch(_){}
  if(!raw) return null;
  const k=raw.toLowerCase().replace(/[^a-z]/g,'');
  return {ar: typeof BASICS_NAMES!=='undefined' && BASICS_NAMES[k] || null, latin: raw.charAt(0).toUpperCase()+raw.slice(1)};
}
/* A goal sentence with the learner's name in it: {html, play}. play is what to say, in order; null is a
   pause where the learner says their name (a name with no Arabic spelling has no recording). */
function withMyName(line){
  const ex=EXAMPLE_NAMES.find(n=>line.includes(n)), nm=myName();
  if(!ex || !nm) return {html:esc(line), play:[line], own:false};
  const [a,b]=line.split(ex), rest=b.replace(/^،\s*/,'').trim();
  return {html: esc(a)+(nm.ar ? `<span class="nm">${esc(nm.ar)}</span>` : `<bdi dir="ltr" lang="en" class="nm">${esc(nm.latin)}</bdi>`)+esc(b),
          play:[a.trim(), nm.ar||null].concat(rest ? [rest] : []), own:true};
}
function sayInTurn(parts, el){
  const next=k=>{ if(k>=parts.length || !el.isConnected) return;
    if(parts[k]===null) return setTimeout(()=>next(k+1), 1100);          // a moment to say your name
    say(parts[k], el, ()=>setTimeout(()=>next(k+1), 150)); };
  next(0);
}
function basicsGoal(then){
  const body=el(`<div><p class="kicker">The basics · your goal</p><div class="card note">
    <h3 class="gh">By the end of the basics, you’ll say</h3>
    <div class="mid" id="g" style="line-height:1.9"></div><div class="gtr">${esc(BASICS_GOAL.en)}</div>
    <p style="margin-top:14px">Each lesson teaches one building block and adds a piece of this sentence. <span id="nmnote"></span></p>
    <p class="howto" style="margin-top:10px">Are you saying it as a man or a woman?</p></div></div>`);
  const g=body.querySelector('#g'), note=body.querySelector('#nmnote');
  const en=body.querySelector('.gtr'); if(myName()) en.textContent=BASICS_GOAL.en.replace('…', myName().latin);
  const show=()=>{ const x=withMyName(BASICS_GOAL[basicsG()]); g.innerHTML=x.html;
    note.textContent=x.own ? 'It has your name in it, from when you signed up.' : 'The name is an example: you’ll say your own.'; return x; };
  const x=show(); g.onclick=()=>sayInTurn(withMyName(BASICS_GOAL[basicsG()]).play,g);
  const pick=v=>{ setBasicsG(v); then(); };
  screen(body,[button('As a man',()=>pick('m')), button('As a woman',()=>pick('f'))]);
  sayInTurn(x.play,g);
}
function basicsSoFar(L, i, then){
  const so=L.sofar, line=so[basicsG()], mine=withMyName(line);
  const shown=mine.html.replace(esc(so.adds), `<mark class="new">${esc(so.adds)}</mark>`);
  const pieces=BASICS.filter(l=>!l.sofar.bonus).length, piece=BASICS.slice(0,i+1).filter(l=>!l.sofar.bonus).length;
  const body=el(`<div><p class="kicker">${so.bonus?'A bonus':`Your sentence so far · ${piece} of ${pieces}`}</p><div class="card note">
    <h3 class="gh">${so.bonus?'You can also say':piece>=pieces?'You can say the whole sentence':'You can now say'}</h3>
    <div class="mid" id="s" style="line-height:1.9">${shown}</div><div class="gtr">${withAr(mine.own ? so.en.replace('…', myName().latin) : so.en)}</div>
    <p class="taphint">🔊 Tap to hear it, then say it aloud${so.bonus||piece===1||mine.own?'':' with your own name'}</p><div class="rec" id="rec"></div></div></div>`);
  const sEl=body.querySelector('#s'); sEl.onclick=()=>sayInTurn(mine.play,sEl);
  recorder(body.querySelector('#rec'));      // #361: hear yourself beside the recording, lesson by lesson
  screen(body,[button('Continue',then)]);
  sayInTurn(mine.play,sEl);
}
function runBasics(p, step){
  const L=BASICS[step.lesson], T=L.teach;
  if(L.build) return runTogether(p, step, L);
  // three drills from earlier lessons at the end (#277), so nothing is learned once and dropped
  const fresh=shuffle(BASICS.slice(0,step.lesson).flatMap(l=>l.drills)).slice(0,3), all=2+T.length+L.drills.length+fresh.length;   // 2: the guess and the Match-up (#361)
  const teach=i=>{
    if(i>=T.length) return match();
    setBar(1+i, all);
    const t=T[i];
    const body=el(`<div><p class="kicker">${esc(L.title)} · ${i+1} of ${T.length}</p><div class="card note">
      <h3 class="gh">${withAr(t.h)}</h3>
      <div class="pairs">${t.pairs.map(([a,e])=>`<div class="pair" data-say="${esc(a.replace(/ · /g,'، '))}"><div class="mid">${esc(a)}</div><div class="gtr">${esc(e)}</div></div>`).join('')}</div>
      <p class="taphint">🔊 Tap an example to hear it again</p><p>${withAr(t.en)}</p></div></div>`);
    const rows=[...body.querySelectorAll('.pair')];
    rows.forEach(r=>r.onclick=()=>say(r.dataset.say, r.querySelector('.mid')));
    screen(body,[button(i<T.length-1?'Next':'Practise',()=>teach(i+1))]);
    const playRow=k=>{ if(k<rows.length && rows[k].isConnected) say(rows[k].dataset.say, rows[k].querySelector('.mid'), ()=>setTimeout(()=>playRow(k+1),350)); };
    playRow(0);
  };
  /* #361: the lesson's examples become a Match-up straight after the teaching screens (the short ones, 3 to 5 of
     them), so they're used before they're asked about. */
  const match=()=>{
    const pairs=shuffle(T.flatMap(t=>t.pairs).filter(([a])=>!a.includes('·') && a.length<=22))
      .filter(([a,e],k,all)=>all.findIndex(x=>x[0]===a || gloss(x[1])===gloss(e))===k).slice(0,5);
    if(pairs.length<3) return drill();
    setBar(1+T.length, all);
    matchGame(pairs.map(([ar,en],id)=>({id, ar, en})), `${L.title} · match-up`, ()=>{}, drill);
  };
  /* #361: after the picks, saying it, not recognising it: one or two of the lesson's "How do you say" answers of two
     words or more, built from tiles. The tiles that don't belong are the words of its wrong choices (the endings
     are the lesson, so near-twins stay), and only tiles with a recording are used. */
  const recorded=t=>!!(window.RQ && RQ.clipId(t));
  const decoys=o=>[...new Set(o.slice(1).flatMap(x=>x.split(' ')))].filter(t=>!o[0].split(' ').includes(t) && recorded(t)).slice(0,2);
  let B=null, bi=0;
  const build=()=>{
    // the ones with a tile that doesn't belong first: without one, two tiles only ask for their order
    if(!B) B=shuffle(L.drills.filter(([,shown,o])=>!shown && hasAr(o[0]) && o[0].includes(' ') && o[0].split(' ').every(recorded)))
      .sort((x,y)=>decoys(y[2]).length-decoys(x[2]).length).slice(0,2);
    if(bi>=B.length) return f<fresh.length ? again() : done();
    const [q,,o]=B[bi], parts=o[0].split(' '), extra=decoys(o);
    const body=el(`<div><p class="kicker">${esc(L.title)} · build it</p><div class="card"><div class="en" style="margin:0">${withAr(q)}</div>
      <p class="howto">Build the Arabic: tap the tiles in order.${extra.length?' Some tiles are extra.':''}</p></div><div id="t"></div></div>`);
    const next=button('Next',()=>{bi++;build();}); next.disabled=true;
    const tl=RafiqTiles.create({parts, extra, en:q, strict:true, say:(t,e)=>say(t,e), onCorrect:()=>{ next.disabled=false; }});
    body.querySelector('#t').appendChild(tl.el);
    screen(body,[next, button('Show the answer',()=>{ tl.reveal(); say(o[0],null); next.disabled=false; },true)]);
  };
  let queue=[], right=0, f=0;
  const drill=()=>{
    if(!queue.length && !right) queue=shuffle(L.drills.map((_,k)=>k));
    if(!queue.length) return build();
    const k=queue.shift();
    setBar(2+T.length+right, all);
    basicsDrill(L.drills[k], `${L.title} · practise`, ok=>{ if(ok) right++; else queue.push(k); }, drill);
  };
  const again=()=>{
    setBar(2+T.length+L.drills.length+f, all);
    basicsDrill(fresh[f], 'Keep it fresh · from earlier lessons', ()=>{}, ()=>{f++; drill();});
  };
  const done=()=>{
    const first=!RafiqPath.stepDone(p.n, step.key);
    L.words.forEach(id=>{ if(Progress.isNew('v:'+id)){ Progress.grade('v:'+id,'good',1); if(first) RafiqPath.wordMet(); } });
    basicsSoFar(L, step.lesson, ()=>finish(p, step));
  };
  // #361: one of the lesson's picks before the teaching: a guess, even a wrong one, helps what's taught next to stick
  const guess=()=>{ setBar(0, all); basicsDrill(L.drills[0], `${L.title} · before you start, have a guess`, ()=>{}, ()=>teach(0), true); };
  // the first lesson opens with the goal (#168)
  if(step.lesson===0 && !RafiqPath.stepDone(p.n, step.key)) basicsGoal(guess); else guess();
}

/* Put it together (#277): six sentences built from word tiles, each with a tile that doesn't belong;
   then the goal sentence with your own name: hear it, say it, and record yourself where the browser
   can, to hear the two side by side. */
function runTogether(p, step, L){
  const B=L.build, total=B.length+1;
  let i=0;
  const build=()=>{
    if(i>=B.length) return sayIt();
    setBar(i,total);
    const s=B[i];
    const body=el(`<div><p class="kicker">Put it together · ${i+1} of ${B.length}</p><div class="card"><div class="en" style="margin:0">${esc(s.en)}</div>
      <p class="howto">Build the Arabic: tap the tiles in order. One tile is extra.</p></div><div id="t"></div></div>`);
    const next=button('Next',()=>{i++;build();}); next.disabled=true;
    const tl=RafiqTiles.create({parts:s.ar.split(' '), extra:s.extra||[], en:s.en, say:(t,e)=>say(t,e), onCorrect:()=>{ next.disabled=false; }});
    body.querySelector('#t').appendChild(tl.el);
    screen(body,[next, button('Show the answer',()=>{ tl.reveal(); say(s.ar,null); next.disabled=false; },true)]);
  };
  const sayIt=()=>{
    setBar(B.length,total);
    const mine=withMyName(BASICS_GOAL[basicsG()]);
    const body=el(`<div><p class="kicker">Put it together · your sentence</p><div class="card note">
      <h3 class="gh">Now say your sentence</h3><div class="mid" id="s" style="line-height:1.9">${mine.html}</div>
      <div class="gtr">${esc(mine.own?BASICS_GOAL.en.replace('…', myName().latin):BASICS_GOAL.en)}</div>
      <p class="taphint">🔊 Tap to hear it, then say it aloud${mine.own?'':' with your own name'}</p><div class="rec" id="rec"></div></div></div>`);
    const sEl=body.querySelector('#s'); sEl.onclick=()=>sayInTurn(mine.play,sEl);
    recorder(body.querySelector('#rec'));
    screen(body,[button('Finish the lesson',()=>finish(p, step, `<div class="wnote up">🗣 <b>Your first Arabic sentence</b>, with your own name</div>`))]);
    sayInTurn(mine.play,sEl);
  };
  build();
}
/* Record yourself (#277), where the browser can: the recording stays on this device and is only played back. */
function recorder(box){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return;
  let rec=null, url=null;
  const mk=(t,fn)=>{ const b=document.createElement('button'); b.type='button'; b.className='hear'; b.textContent=t; b.onclick=fn; box.appendChild(b); return b; };
  const recBtn=mk('🎙 Record yourself',()=>toggle()), playBtn=mk('▶ Play yours',()=>{ if(url) new Audio(url).play().catch(()=>{}); });
  playBtn.style.display='none';
  async function toggle(){
    if(rec && rec.state==='recording'){ rec.stop(); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true}), chunks=[];
      rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); if(url) URL.revokeObjectURL(url);
        url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'})); recBtn.textContent='🎙 Record again'; playBtn.style.display=''; };
      rec.start(); recBtn.textContent='■ Stop';
    }catch(_){ recBtn.textContent='The microphone isn’t available'; recBtn.disabled=true; }
  }
}

/* "Say it yourself" in units 1-3 (#164): no writing from scratch. Build your own sentences one gap at
   a time, picking the word that's true for you (all from words already taught), hear each one, then see
   and say them all. A task with gender:true first asks whether you're talking as a man or a woman, and a
   frame with sets:true (a house or a flat) sets which forms follow. An ask:true task shows an answer and
   you pick the question that goes with it. Chosen with TypeSafe (tools/typesafe-exp/say_it_early.py). */
function runSayOwn(p, step){
  const tasks=RafiqPath.unitData(p.n).say;
  let ti=0, fi=0, g=null, mine=[];
  const total=tasks.reduce((n,t)=>n+t.frames.length,0);
  const done=()=>tasks.slice(0,ti).reduce((n,t)=>n+t.frames.length,0)+fi;
  const task=()=>{
    if(ti>=tasks.length) return finish(p, step);
    fi=0; g=null; mine=[];
    tasks[ti].gender ? who() : frame();
  };
  const who=()=>{
    const t=tasks[ti];
    const body=el(`<div><p class="kicker">Say it yourself · ${esc(t.en)}</p>
      <div class="card"><div class="en" style="margin-top:0">Are you talking as a man or a woman?</div>
      <p class="howto" style="margin-top:10px">Some Arabic words change for each.</p></div></div>`);
    screen(body,[button('A man',()=>{g='m';frame()}), button('A woman',()=>{g='f';frame()})]);
  };
  const frame=()=>{
    const t=tasks[ti];
    if(fi>=t.frames.length) return mineScreen();
    setBar(done(),total);
    const f=t.frames[fi], head=`${t.en} · ${fi+1} of ${t.frames.length}`;
    if(t.ask){
      const body=el(`<div><p class="kicker">${esc(head)}</p><div class="card"><p class="howto" style="margin:0 0 6px">They say:</p>
        <div class="mid" id="q">${esc(f.q)}</div><div class="gtr">${esc(f.qen)}</div>
        <p class="howto" style="margin-top:12px">What did you ask?</p></div><div class="opts ar-opts" id="o"></div></div>`);
      const q=body.querySelector('#q'); q.onclick=()=>say(f.q,q);
      const next=button('Next',()=>{fi++;frame()}); next.disabled=true;
      shuffle(f.o).forEach(o=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button'; b.lang='ar'; b.dir='rtl'; b.textContent=o;
        b.onclick=()=>{ if(!next.disabled) return;
          const right=f.o[f.a], ok=o===right; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
          const r=[...body.querySelectorAll('.opt')].find(e=>e.textContent===right); if(!ok) r.classList.add('right');
          mine.push([right, '']); next.disabled=false; say(right, r); };
        body.querySelector('#o').appendChild(b);
      });
      screen(body,[next]); say(f.q,q);
      return;
    }
    const pattern=typeof f.ar==='string' ? f.ar : f.ar[g||'m'];
    const opts=f.o.filter(o=>!o[2] || !g || f.sets || o[2]===g);
    const body=el(`<div><p class="kicker">${esc(head)}</p><div class="card">
      <div class="mid" id="s">${pattern==='___'?'<span class="gap">___</span>':esc(pattern).replace('___','<span class="gap">___</span>')}</div>
      <div class="gtr" id="e">${esc(f.en)}</div><p class="howto" style="margin-top:12px">Pick what’s true for you</p></div>
      <div class="opts" id="o"></div></div>`);
    const s=body.querySelector('#s'), e=body.querySelector('#e');
    const next=button('Next',()=>{fi++;frame()}); next.disabled=true;
    opts.forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.innerHTML=`<span lang="ar" dir="rtl" style="font-family:var(--ar);font-size:1.3rem">${esc(o[0])}</span> <span style="color:var(--ink-soft);font-size:.9rem">· ${esc(o[1])}</span>`;
      b.onclick=()=>{
        [...body.querySelectorAll('.opt')].forEach(x=>x.classList.remove('right')); b.classList.add('right');
        if(f.sets) g=o[2];
        const line=pattern==='___' ? o[0] : pattern.replace('___',o[0]);
        const en=pattern==='___' ? o[1] : f.en.replace('…', o[1]);   // the whole sentence in English
        s.textContent=line; e.textContent=en;
        mine[fi]=[line, en]; next.disabled=false; say(line, s); };
      body.querySelector('#o').appendChild(b);
    });
    s.onclick=()=>{ if(mine[fi]) say(mine[fi][0], s); };
    screen(body,[next]);
  };
  const mineScreen=()=>{
    const t=tasks[ti], lines=mine.filter(Boolean);
    const body=el(`<div><p class="kicker">Say it yourself · ${esc(t.en)}</p><div class="card note">
      <h3 class="gh">${t.ask?'Your questions':'In your own words'}</h3>
      <div class="pairs">${lines.map(([ar,en])=>`<div class="pair" data-say="${esc(ar)}"><div class="mid">${esc(ar)}</div>${en?`<div class="gtr">${esc(en)}</div>`:''}</div>`).join('')}</div>
      <p class="taphint">🔊 Tap a sentence to hear it</p><p>Now say them aloud, one after another.</p></div></div>`);
    const rows=[...body.querySelectorAll('.pair')];
    rows.forEach(r=>r.onclick=()=>say(r.dataset.say, r.querySelector('.mid')));
    const playAll=k=>{ if(k<rows.length && rows[k].isConnected) say(rows[k].dataset.say, rows[k].querySelector('.mid'), ()=>setTimeout(()=>playAll(k+1),400)); };
    screen(body,[button(ti<tasks.length-1?'Next task':'Finish',()=>{ti++;task()}), button('Hear them all',()=>playAll(0),true)]);
    playAll(0);
  };
  task();
}
function runSpeak(p, step){
  if(RafiqPath.teaches(p.n) && (RafiqPath.unitData(p.n).say||[]).length) return runSayOwn(p, step);
  const u=RafiqPath.unitData(p.n), prompts=(u.prompts||[]).slice(0,2);
  let i=0;
  const judge=window.RafiqJudge&&RafiqJudge.on;
  const DONE=['Not the task yet — read the question again.','Partly there — the task asks for a bit more.','Task done ✓'];
  const show=()=>{
    if(i>=prompts.length) return finish(p, step);
    setBar(i,prompts.length);
    const [tAr,tEn,exAr,exEn]=prompts[i];
    const body=el(`<div><p class="kicker">Say it yourself · ${i+1} of ${prompts.length}</p>
      <div class="card" style="text-align:left"><div style="font-size:18px;font-weight:600">${esc(tEn)}</div>
      <div class="mid" style="text-align:right;font-size:18px;color:var(--rubric)">${esc(tAr)}</div>
      <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ جَوابَكَ هُنا"></textarea>
      <div id="out"></div>
      <div id="ex" class="hide" style="margin-top:14px;border-top:1px dashed var(--rule);padding-top:12px">
        <p class="kicker">One way to answer</p><div class="mid" id="exa" style="text-align:right">${esc(exAr)}</div>
        <div style="color:var(--ink-soft);font-size:14px">${esc(exEn)}</div></div></div>
      <p class="howto">Say it aloud first, then type it</p></div>`);
    const ta=body.querySelector('textarea'), out=body.querySelector('#out');
    const exa=body.querySelector('#exa'); exa.onclick=()=>say(exAr,exa);
    const btns=[];
    if(judge) btns.push(button('Check my answer',()=>{
      if(!ta.value.trim()) return;
      out.innerHTML='<div class="verdict">Checking…</div>';
      RafiqJudge.prompt(tEn,exAr,ta.value).then(v=>{
        if(!v){ out.innerHTML='<div class="verdict">Couldn\'t check just now — compare with the example.</div>'; return; }
        if(v.done!==1) window.RafiqSound&&RafiqSound.answer(v.done===2);
        out.innerHTML=`<div class="verdict ${v.done===2?'ok':v.done===0?'no':''}">${DONE[v.done]}</div>`+
          `<div class="verdict ${v.grammarOk?'ok':'no'}">${v.grammarOk?'Grammar: no mistakes spotted ✓':'Grammar: check this — '+esc(v.why)}</div>`;
      });
    }));
    btns.push(button('Show an example',()=>{body.querySelector('#ex').classList.remove('hide');say(exAr,exa)},true));
    btns.push(button(i<prompts.length-1?'Next task':'Finish',()=>{i++;show()},!judge));
    screen(body,btns);
  };
  show();
}

/* After a words step: today's new words, highlighted when it beats your
   usual day or your best. */
function wordsNote(step){
  if(!step || step.kind!=='words') return '';
  const r=RafiqPath.wordsReport(); if(!r.today) return '';
  const msg = r.record ? `🏆 <b>${r.today} new words today</b> — your best day yet (was ${r.best})`
    : r.aboveUsual ? `🌟 <b>${r.today} new words today</b> — more than your usual ${r.usual}`
    : `<b>${r.today}</b> new word${r.today===1?'':'s'} today`;
  return `<div class="wnote${r.record||r.aboveUsual?' up':''}">${msg}</div>`;
}
function finish(p, step, note, extra){
  RafiqPath.complete(p.n, step.key);
  setBar(1,1);
  const n=RafiqPath.next();
  const sameUnit=n.step&&n.unit.n===p.n;
  const s=RafiqPath.streak(), today=RafiqPath.doneToday(), sg=RafiqPath.streakGoal(s);
  // the step that meets today's goal (and so adds the day to the streak) and lands on a streak goal gets a celebration
  const hit = sg.reached && today===RafiqPath.GOAL;
  const body=el(`<div class="done"><div class="tick">${hit?'🎉':'✓'}</div><h2>${hit?`${s}-day streak!`:esc(step.title)+' — done'}</h2>
    <p>${hit?esc(sg.reached.why):today>=RafiqPath.GOAL?'Daily goal reached. Anything more is a bonus.':'One more step and today\'s goal is done.'}</p>
    ${note||''}${wordsNote(step)}
    <span class="streak">🔥 ${s}-day streak${sg.next?` · next goal ${sg.next.days} days`:''}</span></div>`);
  if(p.alpha && step.kind==='letters') body.appendChild(alphabetChart('Your alphabet', ALPHABET_GROUPS[step.group].letters.map(l=>l[0])));
  if(p.alpha && (step.kind==='play' || step.kind==='hearing')) body.appendChild(alphabetChart('Your alphabet', []));
  screen(body,doneButtons(n, sameUnit).concat(extra||[]));
}
/* Every finished step: Complete (home) first, Continue learning (the next step,
   named underneath) second. cont=1 tells the next step it follows straight on. */
function doneButtons(n, sameUnit){
  const btns=[button('Complete',()=>{location.href='dashboard.html'})];
  if(n.step){
    const c=button('',()=>{location.href='learn.html?u='+n.unit.n+'&s='+n.step.key+'&cont=1'},true);
    const where=sameUnit?n.step.title:(n.unit.pre?(n.unit.basics?'The basics: ':''):'Unit '+(+n.unit.n)+': ')+n.step.title;
    c.innerHTML=`Continue learning<small>${esc(where)}</small>`;
    btns.push(c);
  }
  return btns;
}

/* A real-life scene (?scene=id): Complete only, no path step. */
function runScene(sc){

/* ── Your salah (salah.js, #38) ─────────────────────────────
   One part, words first: Listen · Word by word · Check · Put it together ·
   Follow along. Prayer phrases play the app's voice; Quran (Al-Fatiha, the
   surahs) plays only a licensed recitation, so until there is one it's a
   read-along. Its own progress: nothing here counts towards the daily goal. */
function salahSay(p, line, text, elx, after){
  const S=RafiqSalah;
  // prayer phrases in the app's voice, including one inside a Quran part (آمِين has no verse)
  if(!S.isQuran(p) || (line && !line.ref)){ if(window.RQ) RQ.speak(text, elx, after); else if(after) after(); return true; }
  if(line && S.recitation(line) && text===line.ar){ recite(line, null, after, elx); return true; }
  if(after) after();
  return false;
}
/* Why a Quran line has no recitation, for the note under it. */
function silentWhy(){
  const e=RafiqSalah.recitationError();
  return e==='signin' ? 'Sign in to hear the recitation. Read along for now.'
    : e==='not_configured' ? 'Recitation coming soon: read along for now.'
    : e ? 'The recitation couldn\'t load just now: read along, and try again later.'
    : 'Read along: this verse has no recitation yet.';
}
/* Light each word as it is heard, following the audio itself (so the pace always
   matches): the recitation's word timings when there are some, otherwise the clip
   shared out over the words by their length. onWord(k) for each new word. */
const wordWeights=ws=>ws.map(w=>w.ar.replace(/[\u064b-\u0652\u0670\u0640]/g,'').length+1);
function trackWords(a, onWord, weights, timings, onSpoken){
  const total=weights.reduce((x,y)=>x+y,0), src=a.src; let last=-2;
  const tick=()=>{
    if(a.paused||a.ended||a.src!==src) return;          // stopped, finished, or the player moved on (it's shared)
    const ms=a.currentTime*1000, d=a.duration*1000; let k=-1;
    if(timings) k=timings.findIndex(([s,e])=>ms>=s&&ms<e);
    else if(d>0){ let acc=0; for(let i=0;i<weights.length;i++){ acc+=weights[i]; if(ms<d*acc/total){ k=i; break; } } }
    if(k>=0 && k!==last){ last=k; onWord(k); }
    // the last word is over (a recitation's own pause may follow)
    if(onSpoken && timings && ms>=timings[timings.length-1][1]){ const f=onSpoken; onSpoken=null; f(); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

/* Say a line in the app's voice (not the Quran), lighting its words in step: from the
   recording's measured word timings, or shared out by length if it has none yet. */
function sayTracked(line, onWord, after, elx, slow, onPlay){
  onWord(0); let a0=null;
  RQ.speak(line.ar, elx||null, ()=>{ onWord(-1); if(after) after(a0); },
    { onStart:a=>{ a0=a; if(onPlay) onPlay(); if(slow) a.playbackRate=Math.min(a.playbackRate,0.8); trackWords(a, onWord, wordWeights(line.words), RafiqSalah.timings(line)); } });
}
/* Play a Quran line's licensed recitation through the app's player (so an iPhone
   that blocks it gets the "Tap anywhere to hear" cue), lighting words as they're said. */
function recite(line, onWord, after, elx, onSpoken, onPlay){
  const S=RafiqSalah, r=S.recitation(line);
  if(!r){ if(after) after(); return; }
  if(onWord) onWord(0);
  let spoken=false, started=false; const said=()=>{ if(!spoken){ spoken=true; if(onSpoken) onSpoken(); } };
  // after(started): false when the recitation couldn't play (no connection, blocked)
  RQ.speak(line.ar, elx||null, ()=>{ if(started) said(); if(onWord) onWord(-1); if(after) after(started); },
    { src:r.url, onStart:a=>{ started=true; if(onPlay) onPlay(); if(onWord) trackWords(a, onWord, wordWeights(line.words), S.timings(line), said); } });
}

    const c=S.counts(), n=S.next();

      <p>You now understand <b>${c.known} of ${c.total}</b> words of your salah. Its words join your salah review.</p></div>`);
    screen(body,[n?button('Next: '+n.title,()=>{location.href='learn.html?salah='+n.id}):button('Review',()=>{location.href='learn.html?salah=review'}),

/* Pray along (#124): the whole prayer in order at praying pace, each word lit with
   its meaning under it: something to open just before praying. Prayer phrases play
   the app's voice; the Quran is read along silently until there's a licensed recitation. */
function runPrayAlong(){
  const S=RafiqSalah;
  if(!S.enabled()){ location.replace('dashboard.html'); return; }
  if(!S.complete()) return salahUpsell('Pray along');
  document.title='Pray along — Rafiq'; document.querySelector('.close').href='salah.html';
  let surah=qs.get('surah'); if(!S.part(surah)||S.part(surah).group!=='surah') surah='ikhlas';
  const ORDER=['takbir','opening','refuge','fatiha1','fatiha2',surah,'ruku','rising','sujud','tashahhud','salawat','taslim'];
  const seq=[]; ORDER.forEach(id=>{ const p=S.part(id); if(p) p.lines.forEach(l=>seq.push({p,l})); });
  const qLines=seq.filter(x=>S.isQuran(x.p)).map(x=>x.l);
  if(S.needsRecitation(qLines)) return S.loadRecitation(qLines).then(runPrayAlong);
  let i=0, playing=true, timer=null, slow=false;
  try{ slow=localStorage.getItem('rafiq_prayalong_slow')==='1'; }catch(_){}
  function show(){
    clearTimeout(timer); if(window.RQ) RQ.stop();
    if(i>=seq.length){ setBar(1,1); screen(el(`<div class="done"><div class="tick">🕌</div><h2>That's the whole prayer</h2>
      <p>Open Pray along before you pray and the meanings will be with you.</p></div>`),[button('Back to your salah',()=>{location.href='salah.html'}),
      button('Again',()=>{i=0;playing=true;show();},true)]); return; }
    setBar(i,seq.length);
    const {p,l}=seq[i], quran=S.isQuran(p)&&!!l.ref, heard=!quran||!!S.recitation(l);   // آمِين: voiced, not recited
    // heading pinned to the top, credit to the bottom; only the line itself is centred between
    const body=el(`<div class="pa-screen"><p class="kicker">🕌 Pray along · ${esc(p.title)}</p>
      <div class="pa-mid">
      <div class="pa-cue" aria-live="polite"><span class="ic"></span><b></b></div>
      <div class="card pa${l.words.length>6?' long':''}">${l.words.map((w,k)=>`<span class="pw" data-k="${k}"><b>${esc(w.ar)}</b><i>${esc(w.en)}</i></span>`).join('')}</div>
      <p class="pa-en">${esc(l.en)}</p>
      ${quran&&!heard?`<p class="taphint">${esc(silentWhy())}</p>`:''}
      </div>
      ${quran&&heard?`<p class="taphint credit pa-credit">${esc(S.credit())}</p>`:''}
</div>`);
    // playback controls sit with Next, within thumb reach, so a long line never pushes them off screen
    const ctl=el(`<div class="pa-ctl"><button type="button" class="hear" id="pv">‹ Back</button><button type="button" class="hear" id="pp">${playing?'Pause':'Play'}</button>
      <button type="button" class="hear" id="sp">${slow?'Normal pace':'Slower'}</button></div>`);
    screen(body,[ctl, button(i<seq.length-1?'Next':'Finish',()=>{i++;show();})]);
    const words=[...body.querySelectorAll('.pw')];
    ctl.querySelector('#pv').onclick=()=>{ i=Math.max(0,i-1); show(); };
    ctl.querySelector('#pp').onclick=()=>{ playing=!playing; if(window.RQ) RQ.stop(); show(); };
    ctl.querySelector('#sp').onclick=()=>{ slow=!slow; try{ localStorage.setItem('rafiq_prayalong_slow',slow?'1':'0'); }catch(_){} show(); };
    /* What to do now, big and plain: Listen while it's said, Now repeat in the pause after it */
    const cue=body.querySelector('.pa-cue');
    const CUES={loading:['⏳','Loading…'], listen:['🔊','Listen'], repeat:['🗣','Now repeat'], read:['👀','Read along'], paused:['⏸','Paused']};
    const setCue=c=>{ cue.className='pa-cue '+c; cue.querySelector('.ic').textContent=CUES[c][0]; cue.querySelector('b').textContent=CUES[c][1]; };
    if(!playing){ setCue('paused'); words.forEach(w=>w.classList.add('on')); return; }
    const next=wait=>{ timer=setTimeout(()=>{ if(playing && body.isConnected){ i++; show(); } }, wait); };
    // while it's your turn to repeat, the whole line stays lit to read from
    const lit=k=>{ if(k<0 && cue.classList.contains('repeat')) return; words.forEach((w,n)=>w.classList.toggle('on',n===k)); };
    const repeat=()=>{ setCue('repeat'); words.forEach(w=>w.classList.add('on')); };
    const box=body.querySelector('.pa');
    // heard lines: Listen with words lit in step, then Now repeat. The Quran recitation has
    // its own pause to repeat in; a prayer phrase gets a pause about as long as itself.
    // the next verse's recitation downloads while this line plays, so it starts straight away
    const nx=seq[i+1], nr=nx && S.isQuran(nx.p) && S.recitation(nx.l);
    if(nr) fetch(nr.url, {mode:'no-cors'}).catch(()=>{});
    // "Listen" only once the audio is actually playing (a recitation can take a moment to arrive)
    const listening=()=>setCue('listen');
    // audio that couldn't play: read it instead, at a steady pace, rather than "repeat" what wasn't heard
    const unheard=()=>{ setCue('read'); words.forEach(w=>w.classList.add('on')); next((slow?1.6:1)*Math.max(2500, words.length*850)); };
    if(quran && heard){ setCue('loading'); return recite(l, lit, ok=>ok?next(slow?1600:800):unheard(), box, repeat, listening); }
    if(!quran){ setCue('loading');

    timer=setTimeout(step,per);
  }
  show();
}

      b.onclick=()=>{ if(!nx.disabled) return; const ok=x===w; if(ok) right++; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
        if(!ok) [...body.querySelectorAll('.opt')].find(o=>o._w===w).classList.add('right');
        Progress.grade(S.wid(w), ok?'good':'again'); nx.disabled=false;
        if(ok) autoNext(nx, S.voiced(w)?S.sayAr(w):null, listen?null:wEl); };
      body.querySelector('#o').appendChild(b); });
    screen(body,[nx]);
    if(listen) hear();
  };
  q(0);
}
/* Bridge card after "Meet new words": a word you just met shares a root with
   something you say in salah. */
function salahBridge(words){
  const S=window.RafiqSalah; if(!S || !S.enabled()) return null;
  for(const w of words){ const b=S.bridgeFor(w.id); if(b) return Object.assign({w}, b); }
  return null;
}
function showBridge(b, then){
  const l=b.line, S=RafiqSalah;
  const phrase=l.words.map((x,k)=>k===b.index?`<mark>${esc(x.ar)}</mark>`:esc(x.ar)).join(' ');
  const body=el(`<div><p class="kicker">🕌 You'll hear this in your salah</p>
    <div class="card"><div class="mid salah-ar">${phrase}</div><div class="en">${esc(l.en)}</div>
    <p class="wnote" style="margin-top:14px"><b class="ar">${esc(b.w.ar)}</b> (${esc(b.w.en.split('/')[0])}) shares its root <b class="ar">${esc(b.root.split('').join(' '))}</b>
      with <b class="ar">${esc(b.word.ar)}</b>, “${esc(b.word.en)}”, in ${esc(b.part.title)}.</p></div></div>`);
  screen(body,[button('Continue',then), button('See your salah',()=>{location.href='salah.html'},true)]);
}

(async function(){
  if(typeof requireLogin==='function') requireLogin();
  await Progress.init();
  if(qs.get('salah') && window.RafiqSalah){ const k=qs.get('salah');
    // the Quran's official meanings and recitation first, so every screen uses the same ones
    if(RafiqSalah.enabled()){ screen(el(`<div class="done"><p>Loading your salah…</p></div>`),[]); await RafiqSalah.ready(); }
    return k==='review' ? runSalahReview() : k==='prayalong' ? runPrayAlong() : ['quiz','listen','top50'].includes(k) ? runSalahDrill(k) : runSalah(k); }
  const scene=qs.get('scene')&&typeof SCENES!=='undefined'&&SCENES.find(s=>s.id===qs.get('scene'));
  if(scene) return runScene(scene);
  let p=RafiqPath.units().find(x=>x.n===qs.get('u'))||RafiqPath.next().unit;
  // A locked unit or step (someone typed the address, or an old link) sends
  // you to where you actually are on the path.
  if(!RafiqPath.unitOpen(p.n)) p=RafiqPath.next().unit;
  // every step of the reading starter done, letters still to turn green: the check-in (#276)
  if(p.alpha && qs.get('s')==='checkin'){ document.title='Letter check-in — Rafiq'; return runCheckIn(RafiqPath.checkInLetters().slice(0,10), null); }
  const steps=RafiqPath.steps(p);
  let step=steps.find(s=>s.key===RafiqPath.stepKey(qs.get('s')))||steps.find(s=>!RafiqPath.stepDone(p.n,s.key))||steps[0];
  if(!RafiqPath.stepOpen(p.n,step.key)) step=steps.find(s=>RafiqPath.stepOpen(p.n,s.key)&&!RafiqPath.stepDone(p.n,s.key))||steps[0];
  document.title=step.title+' — Rafiq';
  const run=()=>({words:PLUS.has(p.n)?runWordsPlus:runWords,review:runReview,listen:runListen,grammar:runGrammar,practise:runPractise,speak:runSpeak,
    letters:runLetters,vowels:runVowels,rules:runRules,hearing:runHearing,chat:runChat,test:runTest,basics:runBasics,
    play:runPlay,sound:runSound,firstwords:runFirstWords,line:runLine})[step.kind](p,step);
  // a new reading-starter step starts with a check-in on letters from an earlier day (#276)
  const ci=p.alpha && step.kind!=='hearing' && !RafiqPath.stepDone(p.n,step.key) ? RafiqPath.checkInLetters().slice(0,5) : [];
  if(ci.length) runCheckIn(ci, ()=>{ checkedIn=true; run(); });
  // every two lessons, a short recap before the next new one (#158)
  else if(!p.pre && step.kind!=='test' && step.kind!=='review' && !RafiqPath.stepDone(p.n,step.key) && RafiqPath.recapDue()) runRecap(p, run); else run();
})();
