<script>
DATA.forEach(u=>Object.assign(u,(typeof EXTRA!=='undefined'&&EXTRA[u.n])||{}));
const qs=new URLSearchParams(location.search);
const stage=document.getElementById('stage'), bar=document.getElementById('bar');
const say=(t,el,after)=>{ if(window.RQ) RQ.speak(t.replace(/=/g,' '),el,after); else if(after) after(); };
/* The Pray along cue on any exercise that plays something first: 🔊 Listen while it plays,
   then whose turn it is ("Now say it", "Now pick the word") once it has finished.
   Goes above the exercise's card; returns play(), for the "again" buttons too. */
const TURNS={say:['🗣','Now say it'], repeat:['🗣','Now repeat'], pick:['👆','Now pick'], type:['⌨️','Now type it']};
function listenThen(body, speak, turn, label){
  const c=el(`<div class="pa-cue listen" aria-live="polite"><span class="ic">🔊</span><b>Listen</b></div>`);
  const at=body.querySelector('.card'); (at?at.parentNode:body).insertBefore(c, at||body.firstChild);
  const set=(cls,ic,txt)=>{ c.className='pa-cue '+cls; c.firstChild.textContent=ic; c.lastChild.textContent=txt; };
  const [ic,txt]=TURNS[turn]||TURNS.say;
  return ()=>{ set('listen','🔊','Listen'); speak(()=>{ if(c.isConnected) set('repeat',ic,label||txt); }); };
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setBar(i,n){ bar.style.width=Math.round(100*i/Math.max(1,n))+'%'; }
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
/* Every exercise screen is laid out like Pray along: the heading(s) pinned to the top, the
   exercise itself in the middle, notes and credits (.credit, .x-note) at the bottom. */
function zones(body){
  if(!body || body.nodeType!==1 || body.matches('.pa-screen,.done,.x-screen')) return;
  const top=document.createElement('div'); top.className='x-top';
  while(body.firstElementChild && body.firstElementChild.matches('p.kicker')) top.appendChild(body.firstElementChild);
  const bottom=document.createElement('div'); bottom.className='x-bottom';
  [...body.querySelectorAll(':scope > .credit, :scope > .x-note')].forEach(n=>bottom.appendChild(n));
  const mid=document.createElement('div'); mid.className='x-mid';
  while(body.firstChild) mid.appendChild(body.firstChild);
  body.classList.add('x-screen');
  if(top.childElementCount) body.appendChild(top);
  body.appendChild(mid);
  if(bottom.childElementCount) body.appendChild(bottom);
}
function screen(body, buttons){
  stage.innerHTML='';
  zones(body);
  stage.appendChild(body);
  const f=document.createElement('div'); f.className='foot';
  buttons.forEach(b=>f.appendChild(b)); stage.appendChild(f);
  window.scrollTo(0,0);
}
/* A right answer on a simple pick moves on by itself once the word has been said
   (chosen with TypeSafe: tools/typesafe-exp/auto_advance.py). A wrong answer
   waits for Next, so the right one can be looked at. Next stays, to go sooner.
   Nothing moves while the report sheet is open or the app is in the background,
   and a screen that has already moved on is left alone. */
function autoNext(next, text, el){
  let gone=false;
  const go=()=>{
    if(gone || !next.isConnected) return;
    if(document.querySelector('.rp-sheet') || document.hidden) return setTimeout(go, 700);
    gone=true; next.click();
  };
  if(text && window.RQ) RQ.speak(text.replace(/=/g,' '), el, ()=>setTimeout(go, 500));
  else setTimeout(go, 900);
  setTimeout(go, 6000);                  // in case the audio never reports that it ended
}
function button(label, fn, ghost){ const b=document.createElement('button'); b.className='go'+(ghost?' ghost':''); b.type='button'; b.textContent=label; b.onclick=fn; return b; }

/* ── steps ─────────────────────────────────────────────── */
/* A phrase taken apart, word by word (teach.js), under its meaning. */
function partsHTML(ar){
  const ps=window.RafiqTeach && RafiqTeach.parts(ar);
  return ps ? `<div class="wparts" aria-label="Word by word">${ps.map(([a,e])=>`<span><b lang="ar">${esc(a)}</b><i>${esc(e)}</i></span>`).join('')}</div>` : '';
}
function runWords(p, step){
  const words=RafiqPath.wordsOf(p, step.batch);
  // teach first (#156): after the meaning check, hear a few and pick the word
  const HEAR=RafiqPath.teaches(p.n) ? Math.min(5, words.length) : 0, heard=shuffle(words).slice(0,HEAR);
  const total=words.length*2+HEAR;       // meet each word, then a short check
  let i=0;
  const meet=()=>{
    if(i>=words.length) return check(0);
    const w=words[i]; setBar(i,total);
    const pic=PIC[w.id]?`<div class="pic" aria-hidden="true">${PIC[w.id]}</div>`:'';
    const body=el(`<div><p class="kicker">New word ${i+1} of ${words.length}</p>
      <div class="card">${pic}<div class="big" id="w">${esc(w.ar)}</div>
      <div class="tr">${esc(w.tr||'')}</div><div class="en">${esc(w.en)}</div>${partsHTML(w.ar)}
      <button class="hear" type="button" id="h">🔊 Hear it again</button></div>
      <p class="howto">Say it aloud once, then carry on</p></div>`);
    screen(body,[button(i<words.length-1?'Next word':'Check yourself',()=>{i++;meet()})]);
    const a=body.querySelector('#w'), play=listenThen(body, done=>say(w.ar,a,done), 'say');
    a.onclick=play; body.querySelector('#h').onclick=play; play();
  };
  // Light check straight after meeting: pick the meaning. Learning, not a test —
  // a miss just shows the answer and moves on.
  const order=shuffle(words);
  const check=k=>{
    if(k>=order.length) return hear(0);
    setBar(words.length+k,total);
    ask(k);
  };
  // hear it, then pick the word you heard, so sound and spelling go together
  const hear=k=>{
    if(k>=HEAR) return done();
    setBar(words.length*2+k,total);
    const w=heard[k];
    // no two choices with the same letters (ما اسْمُكَ / ما اسْمُكِ differ only in a vowel you can barely hear)
    const skel=t=>t.replace(/[\u064B-\u0652\u0670\u0640؟?.]/g,'').trim(), used=new Set([skel(w.ar)]);
    const pool=shuffle(words).filter(x=>!used.has(skel(x.ar)) && used.add(skel(x.ar))).slice(0,3).concat([w]);
    const body=el(`<div><p class="kicker">Hear it, pick the word</p>
      <div class="card"><button class="hear big-hear" type="button" id="h" aria-label="Hear it again">🔊</button></div><div class="opts ar-opts" id="o"></div></div>`);
    const h=body.querySelector('#h'), play=()=>say(w.ar,h); h.onclick=play;
    const next=button('Next',()=>hear(k+1)); next.disabled=true;
    shuffle(pool).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button'; b.lang='ar'; b.dir='rtl'; b.textContent=x.ar;
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===w?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(x===w);
        if(x!==w) [...body.querySelectorAll('.opt')].find(o=>o.textContent===w.ar).classList.add('right');
        next.disabled=false; if(x===w) autoNext(next, w.ar, h); };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]); play();
  };
  const done=()=>{
    // into daily review; the first time through, every word counts as met today
    const first=!RafiqPath.stepDone(p.n, step.key);
    // a new word comes back tomorrow, then FSRS spaces it out (7, 32, 118 days; #158)
    words.forEach(w=>{ if(Progress.isNew('v:'+w.id)) Progress.grade('v:'+w.id,'good',1); if(first) RafiqPath.wordMet(); });
    const br=salahBridge(words);
    return br ? showBridge(br, ()=>finish(p, step)) : finish(p, step);
  };
  const ask=k=>{
    const w=order[k];
    const pool=shuffle(words.filter(x=>x!==w && !tooClose(x.en,w.en))).slice(0,3).concat([w]);
    const body=el(`<div><p class="kicker">What does this mean?</p>
      <div class="card"><div class="big" id="w">${esc(w.ar)}</div></div><div class="opts" id="o"></div></div>`);
    const a=body.querySelector('#w'); a.onclick=()=>say(w.ar,a);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(pool).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=gloss(x.en);
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===w?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(x===w);
        if(x!==w) [...body.querySelectorAll('.opt')].find(o=>o.textContent===gloss(w.en)).classList.add('right');
        next.disabled=false;
        if(x===w) autoNext(next, w.ar, a); else say(w.ar,a); };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet();
}

function runListen(p, step){
  const u=RafiqPath.unitData(p.n), lines=u.dialogue, c=u.convos&&u.convos[0];
  let i=0, showEn=true;
  const show=()=>{
    if(i>=lines.length) return finish(p, step);
    setBar(i,lines.length);
    const l=lines[i];
    const body=el(`<div><p class="kicker">${esc(c?c.sub:'Conversation')} · line ${i+1} of ${lines.length}</p>
      <div class="card"><div class="who">${esc(l[0])}</div><div class="mid" id="a">${esc(l[1])}</div>
      <div class="en${showEn?'':' hide'}" id="e">${esc(l[2])}</div>
      <button class="hear" type="button" id="h">🔊 Again</button></div>
      <p class="howto">Listen, then say it after the voice</p></div>`);
    const a=body.querySelector('#a'), play=listenThen(body, done=>say(l[1],a,done), 'say');
    a.onclick=play; body.querySelector('#h').onclick=play;
    const tog=button(showEn?'Hide English':'Show English',()=>{showEn=!showEn;body.querySelector('#e').classList.toggle('hide',!showEn);tog.textContent=showEn?'Hide English':'Show English'},true);
    screen(body,[button(i<lines.length-1?'Next line':'Finish',()=>{i++;show()}),tog]);
    play();
  };
  show();
}

/* Word endings, explained once in plain English wherever a note mentions them. */
const ENDINGS_RE=/(^|[\s(‘'])-(u|a|i|un|an|in)\b|extra -n/;
const ENDINGS_HTML=`<details class="endings"><summary>What are these endings (-u, -a, -i)?</summary>
  <p>Arabic words change their last vowel to show their job in the sentence:</p>
  <ul><li><b>-u</b> (ـُ): the usual ending</li><li><b>-a</b> (ـَ): for the thing receiving an action, and after some words</li>
  <li><b>-i</b> (ـِ): after little words like فِي ‘in’ and بِـ ‘with’</li></ul>
  <p>Without ال, add an <b>n</b> sound: <b>-un</b> (ـٌ), <b>-an</b> (ـً), <b>-in</b> (ـٍ). You’ll pick these up as you go, and people often leave them off when speaking.</p></details>`;
/* The short meaning shown on an answer button: the part before the first '/'
   that isn't inside brackets, without wrapping brackets. */
/* An example like 'هَذا طالِبٌ · هَذِهِ طالِبَةٌ' with 'This is… (m) · This is… (f)': Arabic runs right to
   left, so on one line the pairs sit opposite their English. Split into [arabic, english] rows. */
function pairsOf(g){
  if(!g.tr) return null;
  const a=g.ar.split(' · '), e=g.tr.split(' · ');
  return a.length>1 && a.length===e.length ? a.map((x,i)=>[x.replace(/[.،]\s*$/,'').trim(), e[i].replace(/\.\s*$/,'').trim()]) : null;
}
function gloss(en){
  let d=0, s=String(en||'');
  for(let i=0;i<s.length;i++){ const c=s[i]; if(c==='(') d++; else if(c===')') d--; else if(c==='/' && d<=0){ s=s.slice(0,i); break; } }
  s=s.trim(); if(/^\(.*\)$/.test(s)) s=s.slice(1,-1).trim();
  return s;
}
/* Two meanings too close to both be offered (the same, or one inside the other: 'yes' / 'yes, of course'). */
const tooClose=(a,b)=>{ a=gloss(a).toLowerCase(); b=gloss(b).toLowerCase(); return a===b || (' '+a+' ').includes(' '+b+' ') || (' '+b+' ').includes(' '+a+' '); };
function runGrammar(p, step){
  const notes=RafiqPath.unitData(p.n).grammar||[];
  let i=0;
  const show=()=>{
    if(i>=notes.length) return finish(p, step);
    setBar(i,notes.length);
    const g=notes[i];
    const body=el(`<div><p class="kicker">How it works · ${i+1} of ${notes.length}</p>
      <div class="card note">${g.h ? `<h3 class="gh">${esc(g.h)}</h3><p class="gt">${esc(g.t)}</p>` : `<h3>${esc(g.t)}</h3>`}
        ${pairsOf(g) ? `<div class="pairs">${pairsOf(g).map(([ar,en])=>`<div class="pair" data-say="${esc(ar)}"><div class="mid">${esc(ar)}</div><div class="gtr">${esc(en)}</div></div>`).join('')}</div>`
          : `<div class="mid" id="a">${esc(g.ar.replace(/=/g,' '))}</div>${g.tr ? `<div class="gtr">${esc(g.tr)}</div>` : ''}`}
        <p class="taphint">🔊 Tap ${pairsOf(g) ? 'an example' : 'the Arabic'} to hear it again</p>
        <p>${esc(g.en)}</p>${ENDINGS_RE.test(g.en) ? ENDINGS_HTML : ''}
        ${g.bad ? `<div class="gbad" role="note" aria-label="A common mistake, crossed out"><span class="gx" aria-hidden="true">✗</span><div><s lang="ar" dir="rtl">${esc(g.bad[0])}</s><p>${esc(g.bad[1])}</p></div></div>` : ''}</div></div>`);
    const a=body.querySelector('#a'); if(a) a.onclick=()=>say(g.ar,a);
    const rows=[...body.querySelectorAll('.pair')];
    rows.forEach(r=>r.onclick=()=>say(r.dataset.say,r.querySelector('.mid')));
    screen(body,[button(i<notes.length-1?'Next':'Finish',()=>{i++;show()})]);
    // play the example straight away; paired examples one row after another
    const playRow=k=>{ if(k>=rows.length || !rows[k].isConnected || !window.RQ) return;
      RQ.speak(rows[k].dataset.say, rows[k].querySelector('.mid'), ()=>setTimeout(()=>playRow(k+1), 350)); };
    if(rows.length) playRow(0); else if(a) say(g.ar,a);
  };
  show();
}

/* ── Reading starter ─────────────────────────────────────
   Meet each letter (shape, name, sound, joined forms, three words with it in
   red), then pick letters by sound. Before a new group, unless the learner came
   straight from the last one, a short warm-up on earlier letters. The unit ends
   with a listening test. Every answer about a letter is kept as 'l:<letter>'
   (box 1 = missed last time) so warm-ups and practice can aim at it. */
const ZWJ='\u200d';
const AR_LETTER=/[ء-ي]/, AR_MARK=/[ً-ْٰ]/;
const NO_JOIN=/[اأإآدذرزوؤةء]/;                 // never join to the letter after them
const POS=['start','middle','end'];
const ALL_LETTERS=ALPHABET_GROUPS.flatMap((g,gi)=>g.letters.map(l=>({ch:l[0], name:l[1], group:gi, l})));
const letterOf=ch=>(ALL_LETTERS.find(x=>x.ch===ch)||{}).l;
function forms(l, joins){
  return joins ? [l, l+ZWJ, ZWJ+l+ZWJ, ZWJ+l] : [l, ZWJ+l];
}
const gradeLetter=(ch,ok)=>Progress.grade('l:'+ch, ok?'good':'again');
const weakLetter=ch=>{ const r=Progress.get('l:'+ch); return !!(r && r.box===1); };
const lastSeen=ch=>{ const r=Progress.get('l:'+ch); return (r && r.at) || ''; };
const trHTML=t=>esc(t).replace(/\[(.+?)\]/g,'<b class="hl">$1</b>');

/* A word with one letter in red. Zero-width joiners either side of the colour
   change keep the letters joined in browsers that shape each span separately. */
function hlWord(word, ch, pos){
  const c=[...word], base=[]; c.forEach((x,i)=>{ if(AR_LETTER.test(x)) base.push(i); });
  const is=i=>ch==='ا' ? /[اأإآ]/.test(c[i]) : c[i]===ch;
  const hits=base.filter(is); if(!hits.length) return esc(word);
  const first=base[0], last=base[base.length-1];
  const at = pos==='start' ? (is(first)?first:hits[0])
           : pos==='end'   ? (is(last)?last:hits[hits.length-1])
           : (hits.find(i=>i!==first&&i!==last) ?? hits[0]);
  let end=at+1; while(end<c.length && AR_MARK.test(c[end])) end++;
  const prev=base.filter(i=>i<at).pop(), next=base.find(i=>i>=end);
  const joinIn = prev!=null && !NO_JOIN.test(c[prev]);
  const joinOut= next!=null && !NO_JOIN.test(c[at]) && c[next]!=='ء';
  return esc(c.slice(0,at).join(''))+(joinIn?ZWJ:'')+
    `<span class="hl">${joinIn?ZWJ:''}${esc(c.slice(at,end).join(''))}${joinOut?ZWJ:''}</span>`+
    (joinOut?ZWJ:'')+esc(c.slice(end).join(''));
}
/* A word with one vowel mark in red: the word in red underneath, and on top the
   same word in ink without that mark (removing a mark doesn't move the letters). */
function hlMark(word, mark){
  const i=word.indexOf(mark); if(i<0) return esc(word);
  return `<span class="mk"><span class="mk-r">${esc(word)}</span><span class="mk-i" aria-hidden="true">${esc(word.slice(0,i)+word.slice(i+mark.length))}</span></span>`;
}

/* The whole alphabet, right to left from the top right. intro: every letter
   plain. Otherwise letters from finished groups are green (the ones just learned
   settle in last) and the rest greyed. Tap any letter to hear its name. */
function learnedLetters(){
  return new Set(ALPHABET_GROUPS.flatMap((g,i)=>RafiqPath.stepDone('00','letters'+(i+1)) ? g.letters.map(l=>l[0]) : []));
}
function alphabetChart(title, fresh, intro){
  const got=intro?null:learnedLetters();
  const w=el(`<div class="abc${intro?' intro':''}"><p class="kicker">${esc(title)}${got?` · ${got.size} of ${ALL_LETTERS.length}`:''}</p>
    <div class="abc-grid"></div><p class="abc-tip">Tap a letter to hear its name</p></div>`);
  const grid=w.querySelector('.abc-grid');
  ALL_LETTERS.forEach(x=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=x.ch;
    const on=!!(got&&got.has(x.ch)), nu=on&&!!fresh&&fresh.includes(x.ch);
    b.className='abc-l'+(on?' got':'')+(nu?' new':'');
    if(nu) b.style.animationDelay=(150+70*fresh.indexOf(x.ch))+'ms';
    b.setAttribute('aria-label', x.name+(got?(on?', learned':', not learned yet'):''));
    b.onclick=()=>say(x.name,b);
    grid.appendChild(b);
  });
  return w;
}

/* One letter's card: big letter (tap for its name), sound, joined forms, and
   three words with the letter in red (tap to hear). */
function letterCard(l, kicker){
  const [ch,name,sound,,,exs]=l, joins=!sound.includes('*');
  const f=forms(ch,joins), labels=joins?['alone','start','middle','end']:['alone','end'];
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><div class="big" id="w" style="font-size:72px">${ch}</div>
    <div class="mid" style="font-size:20px">${esc(name)}</div>
    <div class="en" style="font-size:16px">${esc(sound.replace(' *',''))}</div>
    <div class="forms">${f.map((x,k)=>`<div><div class="mid" style="cursor:default">${x}</div><div class="tr">${labels[k]}</div></div>`).join('')}</div>
    ${joins?'':'<p class="tr">Doesn\'t join to the letter after it</p>'}
    <p class="kicker ex-k">In words · tap to hear</p>
    <div class="exs">${(exs||[]).map((e,k)=>`<button type="button" class="ex" data-k="${k}">
      <span class="ex-ar">${hlWord(e[0],ch,POS[k])}</span>
      <span class="ex-tx"><span class="ex-tr">${trHTML(e[1])}</span><span class="ex-en">${esc(e[2])}</span></span>
      <span class="ex-pos">${POS[k]}</span></button>`).join('')}</div></div></div>`);
  const a=body.querySelector('#w'); a.onclick=()=>say(name,a);
  body.querySelectorAll('.ex').forEach(b=>b.onclick=()=>say(exs[+b.dataset.k][0],b));
  return {body, speak:()=>say(name,a)};
}

/* "Which letter is this?": the sound, and the first sound of its example word. */
function letterQuestion({t, options, kicker, at, total, onNext}){
  setBar(at,total);
  const [ch,name,sound,,exEn]=t;
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><div class="en" style="margin:0">${esc(sound.replace(' *','').split(' — ')[0])}</div>
    <div class="tr">the first sound of the word for "${esc(exEn)}"</div></div><div class="opts" id="o"></div></div>`);
  const next=button('Next',onNext); next.disabled=true;
  shuffle(options).forEach(x=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=x[0];
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=x===t; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok); gradeLetter(ch,ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===ch).classList.add('right');
      next.disabled=false;
      if(ok) autoNext(next, name, null); else say(name,null); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
}

/* Up to 5 earlier letters: ones missed last time first, then the group just
   before this one, then whichever has gone longest without practice. */
function warmUpLetters(group){
  const earlier=ALPHABET_GROUPS.slice(0,group).flatMap(g=>g.letters);
  const pick=[], add=l=>{ if(pick.length<5 && !pick.includes(l)) pick.push(l); };
  shuffle(earlier.filter(l=>weakLetter(l[0]))).slice(0,2).forEach(add);
  shuffle(ALPHABET_GROUPS[group-1].letters).slice(0,2).forEach(add);
  earlier.slice().sort((a,b)=>lastSeen(a[0]).localeCompare(lastSeen(b[0]))).forEach(add);
  return shuffle(pick);
}

function runLetters(p, step){
  const g=ALPHABET_GROUPS[step.group], L=g.letters;
  const intro=step.group===0;
  // straight on from the last group (Continue learning) the earlier letters are fresh: no warm-up
  const warm=step.group>0 && !qs.get('cont') ? warmUpLetters(step.group) : [];
  const earlier=ALPHABET_GROUPS.slice(0,step.group).flatMap(x=>x.letters);
  const before=(intro?1:0)+warm.length, total=before+L.length*2;
  const start=()=>{
    if(!intro) return warmUp(0);
    setBar(0,total);
    const body=el(`<div><p class="kicker">Before you start</p><div class="card">
      <h2 class="abc-h">The Arabic alphabet</h2>
      <p class="abc-p">These are the 28 letters of Arabic. They're read from right to left, starting at the top right. You'll learn them in 7 small groups, beginning with the first four.</p></div></div>`);
    body.querySelector('.card').appendChild(alphabetChart('All 28 letters', null, true));
    screen(body,[button('Start with the first letters',()=>meet(0))]);
  };
  const warmUp=k=>{
    if(k>=warm.length) return meet(0);
    const t=warm[k], mates=ALPHABET_GROUPS.find(x=>x.letters.includes(t)).letters;
    const opts=[t].concat(shuffle(mates.filter(l=>l!==t)).slice(0,3));
    shuffle(earlier.filter(l=>!opts.includes(l))).slice(0,Math.max(0,4-opts.length)).forEach(l=>opts.push(l));
    letterQuestion({t, options:opts, kicker:`Warm-up before new letters · ${k+1} of ${warm.length}`,
      at:k+(intro?1:0), total, onNext:()=>warmUp(k+1)});
  };
  const meet=i=>{
    if(i>=L.length) return check(0);
    setBar(before+i,total);
    const c=letterCard(L[i], `${g.title} · ${i+1} of ${L.length}`);
    screen(c.body,[button(i<L.length-1?'Next letter':'Check yourself',()=>meet(i+1))]);
    c.speak();
  };
  const order=shuffle(L);
  const check=k=>{
    if(k>=order.length) return finish(p, step);
    letterQuestion({t:order[k], options:L, kicker:'Which letter is this?', at:before+L.length+k, total, onNext:()=>check(k+1)});
  };
  start();
}

function runVowels(p, step){
  const V=VOWEL_MARKS, total=V.length+5;
  // the mark after ب in red; for a long vowel, the letter after it
  const shown=(w,word,pos)=>{ const m=w.slice(1); return AR_MARK.test(m) ? hlMark(word,m) : hlWord(word,m,pos); };
  const meet=i=>{
    if(i>=V.length) return check(0);
    setBar(i,total);
    const [w,sound,what,ex]=V[i];
    const body=el(`<div><p class="kicker">The vowel marks · ${i+1} of ${V.length}</p>
      <div class="card"><div class="big" style="font-size:80px;cursor:default">${shown(w,w,'end')}</div>
      <div class="en">"${esc(sound)}"</div><p style="color:var(--ink-soft);margin-top:10px">${esc(what)}</p>
      ${ex?`<p class="kicker ex-k">In a word · tap to hear</p><div class="exs"><button type="button" class="ex" id="x">
        <span class="ex-ar">${shown(w,ex[0],'middle')}</span>
        <span class="ex-tx"><span class="ex-tr">${trHTML(ex[1])}</span><span class="ex-en">${esc(ex[2])}</span></span></button></div>`:''}</div>
      <p class="x-note taphint">Most books for learners — and this app — show every vowel</p></div>`);
    const x=body.querySelector('#x'); if(x) x.onclick=()=>say(ex[0],x);
    screen(body,[button(i<V.length-1?'Next':'Check yourself',()=>meet(i+1))]);
  };
  const order=shuffle(V).slice(0,5);
  const check=k=>{
    if(k>=order.length) return finish(p, step);
    setBar(V.length+k,total);
    const t=order[k];
    const body=el(`<div><p class="kicker">Which one says "${esc(t[1])}"?</p><div class="opts" id="o"></div></div>`);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(V.filter(x=>x!==t)).slice(0,3).concat([t]).sort(()=>Math.random()-.5).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.style.fontFamily='var(--ar)'; b.style.fontSize='30px'; b.textContent=x[0];
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===t?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(x===t);
        if(x!==t) [...body.querySelectorAll('.opt')].find(o=>o.textContent===t[0]).classList.add('right');
        next.disabled=false;
        if(x===t) autoNext(next, null); };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet(0);
}

/* Listening test: a word is played (not shown) and the learner picks the letter
   it starts with from letters that sound alike. 12 questions, 9 to pass. Below
   that: each missed letter's card again, listening practice on those letters and
   their look-alikes, then a retake with a fresh set of words. */
const TEST_LEN=12, TEST_PASS=9;
function testItems(){
  const sets=[...new Set(LISTEN_TEST.map(x=>x[2]))];
  const pick=sets.map(s=>shuffle(LISTEN_TEST.filter(x=>x[2]===s))[0]);        // every kind of look-alike at least once
  shuffle(LISTEN_TEST.filter(x=>!pick.includes(x))).slice(0,TEST_LEN-pick.length).forEach(x=>pick.push(x));
  return shuffle(pick);
}
function hearQuestion({it, kicker, at, total, onAnswer, onNext}){
  setBar(at,total);
  const [word,ch,opts,en]=it;
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><button type="button" class="hear-big" id="play" aria-label="Play the word again">🔊</button>
    <div class="tr" style="margin-top:10px">Which letter does this word start with?</div>
    <div id="rev" class="rev hide"></div></div><div class="opts" id="o"></div></div>`);
  const play=body.querySelector('#play'), hear=listenThen(body, done=>say(word,play,done), 'pick', 'Now pick the first letter');
  play.onclick=hear;
  const next=button('Next',onNext); next.disabled=true;
  shuffle([...opts]).forEach(x=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=x;
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=x===ch; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok); gradeLetter(ch,ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===ch).classList.add('right');
      const rev=body.querySelector('#rev');
      rev.innerHTML=`<div class="mid" id="rw">${hlWord(word,ch,'start')}</div><div class="tr">${esc(en)}</div>`;
      rev.classList.remove('hide'); const rw=rev.querySelector('#rw'); rw.onclick=()=>say(word,rw);
      onAnswer(ok,ch); next.disabled=false;
      if(ok) autoNext(next, word, rw); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
  hear();
}
function runHearing(p, step){
  const home=()=>{location.href='dashboard.html'};
  const intro=()=>{
    setBar(0,1);
    const body=el(`<div><p class="kicker">Listening test</p><div class="card">
      <div style="font-size:44px">🎧</div><h2 class="abc-h">Can you hear the difference?</h2>
      <p class="abc-p">You'll hear ${TEST_LEN} words without seeing them. For each one, pick the letter it starts with. The choices sound alike, so listen closely, and play a word as often as you like. ${TEST_PASS} right to pass.</p></div></div>`);
    screen(body,[button('Start the test',test)]);
  };
  const test=()=>{
    const items=testItems(), missed=[]; let k=0, score=0;
    const q=()=>{
      if(k>=items.length) return result();
      hearQuestion({it:items[k], kicker:`Listening test · ${k+1} of ${items.length}`, at:k, total:items.length,
        onAnswer:(ok,ch)=>{ if(ok) score++; else if(!missed.includes(ch)) missed.push(ch); }, onNext:()=>{k++;q();}});
    };
    const result=()=>{
      if(score>=TEST_PASS) return finish(p, step, `<div class="wnote up">🎧 <b>${score} / ${items.length}</b>: you passed the listening test</div>`);
      setBar(1,1);
      const body=el(`<div class="done"><div class="tick">🎧</div><h2>${score} / ${items.length}</h2>
        <p>You need ${TEST_PASS} to pass. Let's practise the letters that tripped you up, then try again.</p>
        <div class="miss-l">${missed.map(ch=>`<span>${ch}</span>`).join('')}</div></div>`);
      screen(body,[button('Practise these letters',()=>practise(missed)), button('Back to home',home,true)]);
    };
    q();
  };
  const practise=letters=>{
    const cards=letters.map(letterOf).filter(Boolean);
    const own=shuffle(LISTEN_TEST.filter(x=>letters.includes(x[1])));
    const alike=shuffle(LISTEN_TEST.filter(x=>!letters.includes(x[1]) && letters.some(ch=>x[2].includes(ch))));
    const drills=own.concat(alike).slice(0,Math.min(8,Math.max(4,letters.length*2)));
    const total=cards.length+drills.length;
    const card=i=>{
      if(i>=cards.length) return drill(0);
      setBar(i,total);
      const c=letterCard(cards[i], `Practise · letter ${i+1} of ${cards.length}`);
      screen(c.body,[button(i<cards.length-1?'Next letter':'Now listen',()=>card(i+1))]);
      c.speak();
    };
    const drill=k=>{
      if(k>=drills.length) return ready();
      hearQuestion({it:drills[k], kicker:`Practise · listen ${k+1} of ${drills.length}`, at:cards.length+k, total,
        onAnswer:()=>{}, onNext:()=>drill(k+1)});
    };
    const ready=()=>{
      setBar(1,1);
      screen(el(`<div class="done"><div class="tick">💪</div><h2>Ready to try again?</h2>
        <p>A fresh set of ${TEST_LEN} words. You need ${TEST_PASS} to pass.</p></div>`),
        [button('Retake the test',test), button('Back to home',home,true)]);
    };
    card(0);
  };
  intro();
}

/* Conversation partner: the other speaker's lines are the unit's own
   conversation, read aloud; the learner answers in their own words and the
   judge says whether the reply fits and how the grammar looks. Nothing is
   generated — if it doesn't fit, a suggested reply from the conversation is
   one tap away. */
/* opts (scenes): {lines, title, done} — a real-life scene instead of the unit's conversation */
function runChat(p, step, opts){
  const lines=opts ? opts.lines : RafiqPath.unitData(p.n).dialogue;
  const situation=opts ? opts.situation : (()=>{ const u=RafiqPath.unitData(p.n); return u.en+': '+((u.convos&&u.convos[0].sub)||''); })();
  const done=opts ? opts.done : ()=>finish(p, step);
  const turns=[]; for(let i=0;i+1<lines.length;i+=2) turns.push([lines[i],lines[i+1]]);
  const judge=window.RafiqJudge&&RafiqJudge.on;
  // The conversation partner is part of Complete (everyone has Complete during the beta).
  if(judge && window.RafiqPlan && !RafiqPlan.isComplete()){
    const c=RafiqPlan.PRICES.complete;
    const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'}</p><div class="card">
      <div style="font-size:40px">💬</div><h3 style="margin:8px 0">Part of Rafiq Complete</h3>
      <p style="color:var(--ink-soft)">Reply to the other speaker in your own words and get feedback on every reply.
      ${c.yearly} a year or ${c.monthly} a month.</p></div></div>`);
    screen(body,[button('See Complete',()=>{location.href='plans.html'}),
      opts ? button('Back to practice',()=>{location.href='practise.html'},true) : button('Skip this step',done,true)]);
    return;
  }
  let t=0;
  /* How the learner replies (TypeSafe: tools/typesafe-exp/early_answers.py, #118): units 1–2 pick
     the right reply from three, unit 3 builds it from word tiles, and own-words typing from unit 4.
     "Type it in your own words" is always there. Settings' "always type" keeps typing; real-life
     scenes (opts) stay as they are. */
  const pref=RafiqPath.answerPref();
  const early = !opts && p && pref!=='type' ? (+p.n<=2 ? 'pick' : (+p.n===3 || pref==='tiles') ? 'tiles' : null) : null;
  let ownWords=false;
  const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'} · you reply</p><div class="chat" id="chat"></div>
    <div id="alt" style="margin-top:12px"></div>
    <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ رَدَّكَ هُنا" style="min-height:70px"></textarea></div>`);
  const chat=body.querySelector('#chat'), ta=body.querySelector('textarea'), alt=body.querySelector('#alt');
  const add=(cls,ar,en)=>{ const b=el(`<div class="bub ${cls}">${ar?`<div class="a">${esc(ar)}</div>`:''}${en?`<div class="e">${esc(en)}</div>`:''}</div>`);
    chat.appendChild(b); b.scrollIntoView({block:'nearest'}); return b; };
  const send=button(judge?'Send':'Show a suggested reply',()=>reply());
  // the Arabic for this turn's goal, if they want it
  const hint=button('Show the Arabic',()=>{ const s=add('them hintb',turns[t][1][1],''); s.onclick=()=>say(turns[t][1][1],s); },true);
  const earlier=[];   // what the learner has said so far (the partner's later lines may refer to it)
  const useSuggested=()=>button('Use this reply',()=>{ const s=turns[t][1]; add('me',s[1],''); earlier.push(s[1]); t++; turn(); },true);
  const next=button('Continue',()=>{ t++; turn(); });
  // units 1–3: the reply they give (picked or built), then say it aloud and carry on
  const replied=(ok)=>{
    const r=turns[t][1], m=add('me',r[1],r[2]); m.onclick=()=>say(r[1],m); earlier.push(r[1]);
    add('note '+(ok?'ok':'no'),'', ok?'✓ Now say it aloud.':'That’s the reply that fits. Say it aloud.');
    say(r[1],m); screen(body,[next]);
  };
  const ownBtn=()=> judge ? button('Type it in your own words',()=>{
    ownWords=true; alt.innerHTML='';
    add('note goal','','In your own words: “'+turns[t][1][2]+'”');
    ta.value=''; ta.classList.remove('hide'); screen(body,[send,hint]); ta.focus(); },true) : null;
  function pick(){
    const right=turns[t][1];
    const others=shuffle(turns.filter((x,j)=>j!==t).map(x=>x[1]).filter(x=>x[1]!==right[1])).slice(0,2);
    let chosen=false;
    shuffle([right].concat(others)).forEach(o=>{
      const bt=document.createElement('button'); bt.type='button'; bt.className='opt'; bt.dir='rtl';
      bt.style.cssText='display:block;width:100%;text-align:right;margin-top:8px;font-family:var(--ar);font-size:20px;line-height:1.7';
      bt.textContent=o[1]; bt._o=o;
      bt.onclick=()=>{ if(chosen) return; chosen=true;
        const ok=o===right; bt.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
        if(!ok) [...alt.querySelectorAll('.opt')].find(x=>x._o===right).classList.add('right');
        // a moment to see green/red, then the reply joins the conversation
        setTimeout(()=>{ if(!alt.isConnected) return; alt.innerHTML=''; replied(ok); }, ok ? 700 : 1400); };
      alt.appendChild(bt);
    });
    screen(body,[ownBtn()].filter(Boolean));
  }
  function build(){
    const right=turns[t][1], w=[];
    right[1].split(/\s+/).filter(Boolean).forEach(x=>{ if(!x.replace(/[؟?!.،,:]/g,'')&&w.length) w[w.length-1]+=x; else w.push(x); });
    const size=Math.ceil(w.length/7), parts=[]; for(let i=0;i<w.length;i+=size) parts.push(w.slice(i,i+size).join(' '));
    let done=false; const fin=ok=>{ if(done) return; done=true; setTimeout(()=>{ if(!alt.isConnected) return; alt.innerHTML=''; replied(ok); }, 900); };
    const tl=RafiqTiles.create({parts, en:right[2], say, onCorrect:r=>fin(r.firstTry)});
    alt.appendChild(tl.el);
    screen(body,[button('Show the answer',()=>{ tl.reveal(); fin(false); },true), ownBtn()].filter(Boolean));
  }
  function them(){
    const [a]=turns[t]; setBar(t,turns.length);
    const b=add('them',a[1],a[2]); b.onclick=()=>say(a[1],b); say(a[1],b);
    alt.innerHTML='';
    if(early && !ownWords){
      ta.classList.add('hide');
      add('note goal','','Your turn. Reply: “'+turns[t][1][2]+'”');
      return early==='pick' ? pick() : build();
    }
    // what to get across — the wording is theirs, so the partner's next line still makes sense
    if(judge) add('note goal','','Your turn — in your own words: “'+turns[t][1][2]+'”');
    ta.value=''; ta.classList.remove('hide');
    screen(body,[send,hint]);
  }
  function turn(){ ownWords=false; if(t>=turns.length) return done(); them(); }
  async function reply(){
    const [a,sug]=turns[t], said=ta.value.trim();
    if(!judge){ add('me',sug[1],'Suggested: '+sug[2]); say(sug[1],null); ta.classList.add('hide'); screen(body,[next]); return; }
    if(!said) return;
    add('me',said,'');
    ta.classList.add('hide');
    const wait=add('note','','Checking…');
    const nx=turns[t+1] ? turns[t+1][0] : null;
    const v=await RafiqJudge.reply(a[1],a[2],sug[1],said,situation, nx&&nx[1], nx&&nx[2], earlier);
    wait.remove();
    if(!v){ add('note','','Couldn\'t check just now. One way to reply: '+sug[1]+' — '+sug[2]); screen(body,[next]); return; }
    if(!v.fits){
      window.RafiqSound&&RafiqSound.answer(false);
      const n=add('note no','',"That doesn't quite answer what they said. Try again, or here's one way:");
      const s=add('them',sug[1],sug[2]); s.onclick=()=>say(sug[1],s);
      ta.classList.remove('hide'); ta.value='';
      screen(body,[send,useSuggested()]);
      return;
    }
    if(!v.follows){
      // a sensible reply, but the other speaker's next line was written for something else:
      // don't let the conversation stop making sense — ask for the missing part instead
      add('note','',"Good Arabic! But their next line assumes you said “"+sug[2]+"” — add that and send again, or use this reply:");
      const s=add('them',sug[1],''); s.onclick=()=>say(sug[1],s);
      ta.classList.remove('hide'); ta.value=said;
      screen(body,[send,useSuggested()]);
      return;
    }
    earlier.push(said);
    window.RafiqSound&&RafiqSound.answer(true);
    add('note '+(v.grammar==='slip'?'no':'ok'),'',
      v.grammar==='ok'?'✓ Good reply.' : v.grammar==='slip'?'✓ Good reply — but check this: '+v.why : '✓ That works.');
    screen(body,[next]);
  }
  turn();
}

/* ── recaps and the unit test (#158) ─────────────────────────
   One kind of question for both: a word's meaning, a word heard, or a gap in a
   sentence ({t:'mean'|'hear', id} or {t:'cloze', u, i}). A wrong answer brings
   the word or sentence back for review tomorrow. */
const clozeOf=q=>RafiqPath.unitData(q.u).cloze[q.i];
const skel=t=>t.replace(/[ً-ْٰـ؟?.]/g,'').trim();
function question(q, pool){
  if(q.t==='cloze'){ const d=clozeOf(q), full=d.q.replace('___',d.o[d.a]);
    return {kicker:'Fill the gap', id:'d:'+q.u+'|cloze|'+q.i, opts:d.o, right:d.o[d.a], ar:true, say:full,
      html:`<div class="card"><div class="mid" id="w" lang="ar" dir="rtl">${esc(d.q).replace('___','<span class="gap">___</span>')}</div></div>`,
      answer:`<div class="mid" lang="ar" dir="rtl">${esc(full)}</div>${d.w?`<div class="en">${esc(d.w)}</div>`:''}`}; }
  const w=RafiqPath.wordById(q.id), answer=`<div class="big" lang="ar">${esc(w.ar)}</div><div class="en">${esc(w.en)}</div>`;
  if(q.t==='hear'){ const used=new Set([skel(w.ar)]);
    const others=shuffle(pool).filter(x=>!used.has(skel(x.ar)) && used.add(skel(x.ar))).slice(0,3);
    return {kicker:'Hear it, pick the word', id:'v:'+w.id, opts:others.map(x=>x.ar).concat(w.ar), right:w.ar, ar:true, say:w.ar, answer,
      html:`<div class="card"><button class="hear big-hear" type="button" id="w" aria-label="Hear it again">🔊</button></div>`}; }
  const others=shuffle(pool.filter(x=>x!==w && !tooClose(x.en,w.en))).slice(0,3);
  return {kicker:'What does this mean?', id:'v:'+w.id, opts:others.map(x=>gloss(x.en)).concat(gloss(w.en)), right:gloss(w.en), say:w.ar, answer,
    html:`<div class="card"><div class="big" id="w">${esc(w.ar)}</div></div>`};
}
/* One question on screen. onAnswer(ok) as soon as it's answered; Next goes on. */
let asking=null;                         // the question on screen (for tests/review.py)
function askOne(x, head, onAnswer, onNext){
  asking=x;
  const body=el(`<div><p class="kicker">${esc(head||x.kicker)}</p>${x.html}<div class="opts${x.ar?' ar-opts':''}" id="o"></div></div>`);
  const a=body.querySelector('#w'), play=()=>say(x.say,a); a.onclick=play;
  const next=button('Next',onNext); next.disabled=true;
  shuffle(x.opts).forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=o; if(x.ar){ b.lang='ar'; b.dir='rtl'; }
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=o===x.right; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(e=>e.textContent===x.right).classList.add('right');
      if(!ok) Progress.grade(x.id,'again');
      next.disabled=false; onAnswer(ok);
      if(ok) autoNext(next, x.say, a); else say(x.say,a); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
  if(x.kicker.startsWith('Hear')) play();
}

/* Recap: before the next lesson, every two lessons (RafiqPath.recapDue), five
   words from earlier lessons: the ones due first, then the ones reviewed longest
   ago. Chosen with TypeSafe (tools/typesafe-exp/review_progress.py). */
const RECAP_N=5;
function recapWords(p){
  const now=new Set((p.words||[]));        // not the unit you're in: its words are fresh
  const met=[...RafiqPath.metWords()].filter(id=>!now.has(id)).map(RafiqPath.wordById).filter(Boolean);
  const at=w=>{ const r=Progress.get('v:'+w.id); return r&&r.at||''; };
  const due=shuffle(met.filter(w=>Progress.isDue('v:'+w.id)));
  const rest=met.filter(w=>!Progress.isDue('v:'+w.id)).sort((a,b)=>at(a)<at(b)?-1:1);
  return {pick:due.concat(rest).slice(0,RECAP_N), pool:met};
}
function runRecap(p, then){
  const {pick, pool}=recapWords(p);
  if(pick.length<RECAP_N) return then();
  let k=0, right=0;
  const show=()=>{
    if(k>=pick.length){ RafiqPath.recapDone(); RafiqPath.markDay(); setBar(1,1);
      const body=el(`<div class="done"><div class="tick">✓</div><h2>Recap — ${right} of ${pick.length}</h2>
        <p>${right===pick.length?'All still there. On to the next lesson.':'The ones you missed come back for review tomorrow.'}</p></div>`);
      return screen(body,[button('Start the lesson',then)]); }
    setBar(k,pick.length);
    askOne(question({t:k%2?'hear':'mean', id:pick[k].id}, pool), `Quick recap · ${k+1} of ${pick.length}`, ok=>{ if(ok) right++; }, ()=>{k++;show();});
  };
  show();
}

/* The unit test: 18 questions from the unit: 3 words heard, 5 sentence gaps, the rest meanings.
   Pass with 80%. Below that, the questions missed are reviewed (the answer, then
   the question again until it's right) before a retake; the next unit opens on a
   pass. Chosen with TypeSafe (tools/typesafe-exp/review_progress.py): 18 questions;
   it leaned slightly to 90%, but 80% leaves room for a slip on a sound. */
const PASS=0.8;
function testQuestions(p){
  const words=shuffle(RafiqPath.wordsOf(p)), u=RafiqPath.unitData(p.n);
  let cl=((u&&u.cloze)||[]).map((d,i)=>({t:'cloze',u:p.n,i,d}));
  if(RafiqPath.teaches(p.n) && window.RafiqTeach){ const k=RafiqTeach.taught(p.n);
    cl=cl.filter(x=>RafiqTeach.coverage(x.d.q.replace('___',' ')+' '+x.d.o.join(' '),k)>=0.8); }
  cl=shuffle(cl).slice(0,5);
  const m=15-cl.length;                   // fewer gaps (unit 1 has 4 from taught words): more meanings
  return words.slice(0,m).map(w=>({t:'mean',id:w.id})).concat(words.slice(m,m+3).map(w=>({t:'hear',id:w.id})),
    cl.map(({t,u,i})=>({t,u,i})));
}
function runTest(p, step){
  const pool=RafiqPath.wordsOf(p), missedBefore=RafiqPath.testReview(p.n);
  if(missedBefore) return reviewMistakes(p, step, missedBefore);
  const qs=testQuestions(p), missed=[];
  let k=0;
  const show=()=>{
    if(k>=qs.length) return result();
    setBar(k,qs.length);
    askOne(question(qs[k],pool), `Unit test · ${k+1} of ${qs.length}`, ok=>{ if(!ok) missed.push(qs[k]); }, ()=>{k++;show();});
  };
  const result=()=>{
    const right=qs.length-missed.length, pct=Math.round(100*right/qs.length);
    if(right>=Math.ceil(PASS*qs.length))
      return finish(p, step, `<div class="wnote up">🎓 <b>${right} of ${qs.length}</b> (${pct}%) — unit ${+p.n} passed</div>`);
    RafiqPath.testFailed(p.n, missed); setBar(1,1);
    const body=el(`<div class="done"><div class="tick">${right} / ${qs.length}</div><h2>Not quite yet</h2>
      <p>You need ${Math.ceil(PASS*qs.length)} to pass. Go over the ${missed.length} you missed, then try the test again.</p></div>`);
    screen(body,[button('Review my mistakes',()=>reviewMistakes(p, step, missed)), button('Complete',()=>{location.href='dashboard.html'},true)]);
  };
  show();
}
function reviewMistakes(p, step, missed){
  const pool=RafiqPath.wordsOf(p), left=missed.slice();
  const show=()=>{
    if(!left.length){ RafiqPath.testReviewed(p.n); setBar(1,1);
      const body=el(`<div class="done"><div class="tick">✓</div><h2>Mistakes reviewed</h2><p>Ready when you are.</p></div>`);
      return screen(body,[button('Try the test again',()=>runTest(p, step)), button('Complete',()=>{location.href='dashboard.html'},true)]); }
    setBar(missed.length-left.length, missed.length);
    const q=left[0], x=question(q,pool);
    // the right answer first, then the question
    const body=el(`<div><p class="kicker">Your mistakes · ${missed.length-left.length+1} of ${missed.length}</p>
      <div class="card" id="w">${x.answer}</div><p class="howto">Tap to hear it, then try it again</p></div>`);
    const a=body.querySelector('#w'); a.onclick=()=>say(x.say,a);
    screen(body,[button('Try it',()=>askOne(question(q,pool), 'Try it again', ok=>{ left.shift(); if(!ok) left.push(q); }, show))]);
    say(x.say,a);
  };
  show();
}

function runPractise(p){
  location.href='session.html?unit='+p.n+'&n=10';
}

function runSpeak(p, step){
  const u=RafiqPath.unitData(p.n), prompts=(u.prompts||[]).slice(0,2);
  let i=0;
  const judge=window.RafiqJudge&&RafiqJudge.on;
  const DONE=['Not the task yet — read the question again.','Partly there — the task asks for a bit more.','Task done ✓'];
  const show=()=>{
    if(i>=prompts.length) return finish(p, step);
    setBar(i,prompts.length);
    const [tAr,tEn,exAr,exEn]=prompts[i];
    const body=el(`<div><p class="kicker">Say it yourself · ${i+1} of ${prompts.length}</p>
      <div class="card" style="text-align:left"><div style="font-size:18px;font-weight:600">${esc(tEn)}</div>
      <div class="mid" style="text-align:right;font-size:18px;color:var(--rubric)">${esc(tAr)}</div>
      <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ جَوابَكَ هُنا"></textarea>
      <div id="out"></div>
      <div id="ex" class="hide" style="margin-top:14px;border-top:1px dashed var(--rule);padding-top:12px">
        <p class="kicker">One way to answer</p><div class="mid" id="exa" style="text-align:right">${esc(exAr)}</div>
        <div style="color:var(--ink-soft);font-size:14px">${esc(exEn)}</div></div></div>
      <p class="howto">Say it aloud first, then type it</p></div>`);
    const ta=body.querySelector('textarea'), out=body.querySelector('#out');
    const exa=body.querySelector('#exa'); exa.onclick=()=>say(exAr,exa);
    const btns=[];
    if(judge) btns.push(button('Check my answer',()=>{
      if(!ta.value.trim()) return;
      out.innerHTML='<div class="verdict">Checking…</div>';
      RafiqJudge.prompt(tEn,exAr,ta.value).then(v=>{
        if(!v){ out.innerHTML='<div class="verdict">Couldn\'t check just now — compare with the example.</div>'; return; }
        if(v.done!==1) window.RafiqSound&&RafiqSound.answer(v.done===2);
        out.innerHTML=`<div class="verdict ${v.done===2?'ok':v.done===0?'no':''}">${DONE[v.done]}</div>`+
          `<div class="verdict ${v.grammarOk?'ok':'no'}">${v.grammarOk?'Grammar: no mistakes spotted ✓':'Grammar: check this — '+esc(v.why)}</div>`;
      });
    }));
    btns.push(button('Show an example',()=>{body.querySelector('#ex').classList.remove('hide');say(exAr,exa)},true));
    btns.push(button(i<prompts.length-1?'Next task':'Finish',()=>{i++;show()},!judge));
    screen(body,btns);
  };
  show();
}

/* After a words step: today's new words, highlighted when it beats your
   usual day or your best. */
function wordsNote(step){
  if(!step || step.kind!=='words') return '';
  const r=RafiqPath.wordsReport(); if(!r.today) return '';
  const msg = r.record ? `🏆 <b>${r.today} new words today</b> — your best day yet (was ${r.best})`
    : r.aboveUsual ? `🌟 <b>${r.today} new words today</b> — more than your usual ${r.usual}`
    : `<b>${r.today}</b> new word${r.today===1?'':'s'} today`;
  return `<div class="wnote${r.record||r.aboveUsual?' up':''}">${msg}</div>`;
}
function finish(p, step, note){
  RafiqPath.complete(p.n, step.key);
  setBar(1,1);
  const n=RafiqPath.next();
  const sameUnit=n.step&&n.unit.n===p.n;
  const s=RafiqPath.streak(), today=RafiqPath.doneToday(), sg=RafiqPath.streakGoal(s);
  // the first step of the day that lands on a streak goal gets a celebration
  const hit = sg.reached && today===1;
  const body=el(`<div class="done"><div class="tick">${hit?'🎉':'✓'}</div><h2>${hit?`${s}-day streak!`:esc(step.title)+' — done'}</h2>
    <p>${hit?esc(sg.reached.why):today>=RafiqPath.GOAL?'Daily goal reached. Anything more is a bonus.':'One more step and today\'s goal is done.'}</p>
    ${note||''}${wordsNote(step)}
    <span class="streak">🔥 ${s}-day streak${sg.next?` · next goal ${sg.next.days} days`:''}</span></div>`);
  if(p.alpha && step.kind==='letters') body.appendChild(alphabetChart('Letters you can read so far', ALPHABET_GROUPS[step.group].letters.map(l=>l[0])));
  if(p.alpha && step.kind==='hearing') body.appendChild(alphabetChart('The whole alphabet', []));
  screen(body,doneButtons(n, sameUnit));
}
/* Every finished step: Complete (home) first, Continue learning (the next step,
   named underneath) second. cont=1 tells the next step it follows straight on. */
function doneButtons(n, sameUnit){
  const btns=[button('Complete',()=>{location.href='dashboard.html'})];
  if(n.step){
    const c=button('',()=>{location.href='learn.html?u='+n.unit.n+'&s='+n.step.key+'&cont=1'},true);
    const where=sameUnit?n.step.title:(n.unit.alpha?'':'Unit '+(+n.unit.n)+': ')+n.step.title;
    c.innerHTML=`Continue learning<small>${esc(where)}</small>`;
    btns.push(c);
  }
  return btns;
}

/* A real-life scene (?scene=id): Complete only, no path step. */
function runScene(sc){
  document.title=sc.en+' — Rafiq';
  runChat(null, null, {lines:sc.lines, title:sc.pic+' '+sc.en, situation:sc.en+' ('+sc.d+')', done:()=>{
    Progress.touch('x:'+sc.id); RafiqPath.markDay(); setBar(1,1);
    const body=el(`<div class="done"><div class="tick">${sc.pic}</div><h2>${esc(sc.en)} — done</h2>
      <p>Try it again another day with different replies — the more ways you can say it, the better.</p>
      <span class="streak">🔥 ${RafiqPath.streak()}-day streak</span></div>`);
    screen(body,[button('More scenes',()=>{location.href='practise.html#scenes'}),button('Back to home',()=>{location.href='dashboard.html'},true)]);
  }});
}

/* ── Your salah (salah.js, #38) ─────────────────────────────
   One part, words first: Listen · Word by word · Check · Put it together ·
   Follow along. Prayer phrases play the app's voice; Quran (Al-Fatiha, the
   surahs) plays only a licensed recitation, so until there is one it's a
   read-along. Its own progress: nothing here counts towards the daily goal. */
function salahSay(p, line, text, elx, after){
  const S=RafiqSalah;
  // prayer phrases in the app's voice, including one inside a Quran part (آمِين has no verse)
  if(!S.isQuran(p) || (line && !line.ref)){ if(window.RQ) RQ.speak(text, elx, after); else if(after) after(); return true; }
  if(line && S.recitation(line) && text===line.ar){ recite(line, null, after, elx); return true; }
  if(after) after();
  return false;
}
/* Why a Quran line has no recitation, for the note under it. */
function silentWhy(){
  const e=RafiqSalah.recitationError();
  return e==='signin' ? 'Sign in to hear the recitation. Read along for now.'
    : e==='not_configured' ? 'Recitation coming soon: read along for now.'
    : e ? 'The recitation couldn\'t load just now: read along, and try again later.'
    : 'Read along: this verse has no recitation yet.';
}
/* Light each word as it is heard, following the audio itself (so the pace always
   matches): the recitation's word timings when there are some, otherwise the clip
   shared out over the words by their length. onWord(k) for each new word. */
const wordWeights=ws=>ws.map(w=>w.ar.replace(/[\u064b-\u0652\u0670\u0640]/g,'').length+1);
function trackWords(a, onWord, weights, timings, onSpoken){
  const total=weights.reduce((x,y)=>x+y,0), src=a.src; let last=-2;
  const tick=()=>{
    if(a.paused||a.ended||a.src!==src) return;          // stopped, finished, or the player moved on (it's shared)
    const ms=a.currentTime*1000, d=a.duration*1000; let k=-1;
    if(timings) k=timings.findIndex(([s,e])=>ms>=s&&ms<e);
    else if(d>0){ let acc=0; for(let i=0;i<weights.length;i++){ acc+=weights[i]; if(ms<d*acc/total){ k=i; break; } } }
    if(k>=0 && k!==last){ last=k; onWord(k); }
    // the last word is over (a recitation's own pause may follow)
    if(onSpoken && timings && ms>=timings[timings.length-1][1]){ const f=onSpoken; onSpoken=null; f(); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
/* Say a line in the app's voice (not the Quran), lighting its words in step: from the
   recording's measured word timings, or shared out by length if it has none yet. */
function sayTracked(line, onWord, after, elx, slow, onPlay){
  onWord(0); let a0=null;
  RQ.speak(line.ar, elx||null, ()=>{ onWord(-1); if(after) after(a0); },
    { onStart:a=>{ a0=a; if(onPlay) onPlay(); if(slow) a.playbackRate=Math.min(a.playbackRate,0.8); trackWords(a, onWord, wordWeights(line.words), RafiqSalah.timings(line)); } });
}
/* Play a Quran line's licensed recitation through the app's player (so an iPhone
   that blocks it gets the "Tap anywhere to hear" cue), lighting words as they're said. */
function recite(line, onWord, after, elx, onSpoken, onPlay){
  const S=RafiqSalah, r=S.recitation(line);
  if(!r){ if(after) after(); return; }
  if(onWord) onWord(0);
  let spoken=false, started=false; const said=()=>{ if(!spoken){ spoken=true; if(onSpoken) onSpoken(); } };
  // after(started): false when the recitation couldn't play (no connection, blocked)
  RQ.speak(line.ar, elx||null, ()=>{ if(started) said(); if(onWord) onWord(-1); if(after) after(started); },
    { src:r.url, onStart:a=>{ started=true; if(onPlay) onPlay(); if(onWord) trackWords(a, onWord, wordWeights(line.words), S.timings(line), said); } });
}
/* The rest of Your salah is Complete (salah.js): say what it is, offer the plans. */
function salahUpsell(title){
  document.title='Your salah — Rafiq'; document.querySelector('.close').href='salah.html';
  const c=RafiqPlan.PRICES.complete;
  screen(el(`<div><p class="kicker">🕌 ${esc(title)}</p><div class="card"><div style="font-size:40px">🕌</div>
    <h3 style="margin:8px 0">Understand your whole salah with Complete</h3>
    <p style="color:var(--ink-soft)">You've got your most-said words. Complete takes you through every part of the prayer and the short surahs,
      word by word, with Pray along and the salah drills. ${c.yearly} a year or ${c.monthly} a month.</p></div></div>`),
    [button('See Complete',()=>{location.href='plans.html'}), button('Back to your salah',()=>{location.href='salah.html'},true)]);
}
function runSalah(id){
  const S=RafiqSalah, p=S.part(id);
  if(!p || !S.enabled()){ location.replace('dashboard.html'); return; }
  if(!S.open(p)) return salahUpsell(p.title);
  if(S.stateOf(p)==='locked'){ const n=S.next(); if(n) return runSalah(n.id); }
  if(S.isQuran(p) && S.needsRecitation(p.lines)) return S.loadRecitation(p.lines).then(()=>runSalah(id));
  document.title=p.title+' — Your salah — Rafiq';
  document.querySelector('.close').href='salah.html';
  const quran=S.isQuran(p), lines=p.lines, ws=S.words(p);
  const common=p.kind==='common';
  const steps=common?['words','check']:['listen','words','check','build','follow']; let si=0, li=0;
  const total=common?lines.length+3:lines.length*3+Math.min(6,ws.length)+Math.min(2,lines.length);
  let at=0; const tick=()=>setBar(at++,total);
  const head=(k)=>`<p class="kicker">🕌 ${esc(p.title)} · ${k}</p>`;
  const silent=!quran?'':!S.recitation(lines[0])?`<p class="taphint">${esc(silentWhy())}</p>`
    :`<p class="taphint credit">${esc(S.credit())}</p>`;
  function go(){ li=0; ({listen, words, check, build, follow})[steps[si]](); }
  const nextStep=()=>{ si++; if(si>=steps.length) return end(); go(); };

  // 1. Listen: the phrase with its meaning, and one line on what this part is
  function listen(){
    if(li>=lines.length) return nextStep();
    tick(); const l=lines[li];
    const body=el(`<div>${head('Listen')}
      ${li===0?`<p class="wnote x-note">${esc(p.what)}</p>`:''}
      <div class="card"><div class="mid salah-ar" id="a">${esc(l.ar)}</div>
      ${l.ref?`<div class="tr">${esc(p.title)} ${esc(l.ref)}</div>`:''}
      <div class="en">${esc(l.en)}</div>
      ${quran&&l.ref&&!S.recitation(l)?'':`<button class="hear" type="button" id="h">🔊 Hear it again</button>`}</div>${silent}</div>`);
    screen(body,[button(li<lines.length-1?'Next line':'Word by word',()=>{li++;listen();})]);
    const a=body.querySelector('#a'), h=body.querySelector('#h');
    const silentLine=quran&&l.ref&&!S.recitation(l);
    const play=silentLine?()=>{}:listenThen(body, done=>salahSay(p,l,l.ar,a,done), 'repeat'); if(h) h.onclick=play; a.onclick=play; play();
  }
  // 2. Word by word: meaning, root, and a word from the course with the same root
  function words(){
    if(li>=lines.length){ li=0; return nextStep(); }
    tick(); const l=lines[li];
    const rows=l.words.map((w,k)=>{
      const cw=S.courseWords(w.root).slice(0,2);
      const bridge=cw.length?`<div class="sw-br">${cw.map(v=>`${S.courseKnown(v)?'✓ You know ':'In your course: '}<b class="ar">${esc(v.ar)}</b> ${esc(v.en.split('/')[0])}`).join(' · ')}</div>`:'';
      const f=S.freq(w);
      return `<div class="sw-row" data-k="${k}"><div class="sw-ar">${esc(w.ar)}</div><div class="sw-en">${esc(w.en)}
        ${f?`<span class="sw-freq">You say this ${f===1?'once':f+' times'} in a four-rakah prayer</span>`:''}
        ${w.root?`<span class="sw-root">root <b class="ar">${esc(w.root.split('').join(' '))}</b></span>`:''}${bridge}</div></div>`; }).join('');
    // a word is voiced only where it isn't the Quran (prayer phrases; the opener's prayer words)
    const canHear=w=>(!quran||!l.ref) && S.voiced(w);
    const body=el(`<div>${head('Word by word')}
      ${common&&li===0?`<p class="wnote">${esc(p.what)}</p>`:''}<div class="card sw-list">${rows}</div>
      <p class="taphint">${l.words.some(canHear)?'🔊 Tap a word to hear it':'Read each word with its meaning.'}</p></div>`);
    body.querySelectorAll('.sw-row').forEach(r=>r.onclick=()=>{ const w=l.words[+r.dataset.k]; if(canHear(w)) RQ.speak(S.sayAr(w),r.querySelector('.sw-ar')); });
    screen(body,[button(li<lines.length-1?'Next line':'Check yourself',()=>{li++;words();})]);
  }
  // 3. Check: match words to their meanings (up to 6), marked by the app
  function check(){
    const pool=ws.filter(w=>w.en), picks=shuffle(pool.filter(w=>w.root)).slice(0,common?3:6);
    const order=picks.length?picks:shuffle(pool).slice(0,6);
    const q=k=>{
      if(k>=order.length) return nextStep();
      tick(); const w=order[k];
      const others=shuffle(S.words().filter(x=>x.en && x.en!==w.en && S.wid(x)!==S.wid(w))).slice(0,3);
      const body=el(`<div>${head('Check yourself')}<p class="kicker">What does this mean?</p>
        <div class="card"><div class="big" id="w">${esc(w.ar)}</div></div><div class="opts" id="o"></div></div>`);
      const nx=button('Next',()=>q(k+1)); nx.disabled=true;
      shuffle(others.concat([w])).forEach(x=>{ const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=x.en;
        b.onclick=()=>{ if(!nx.disabled) return; const ok=x===w; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
          if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===w.en).classList.add('right');
          Progress.grade(S.wid(w), ok?'good':'again'); nx.disabled=false;
          if(ok){ if(quran||!S.voiced(w)) autoNext(nx,null); else autoNext(nx,S.sayAr(w),body.querySelector('#w')); } };
        body.querySelector('#o').appendChild(b); });
      screen(body,[nx]);
    };
    q(0);
  }
  // 4. Put it together: rebuild the phrase in order (only the exact order counts)
  function build(){
    const pick=lines.length<=2?lines:[lines[0],lines[lines.length-1]];
    const b1=k=>{
      if(k>=pick.length) return nextStep();
      tick(); const l=pick[k], w=l.words.map(x=>x.ar), size=Math.ceil(w.length/7), parts=[];
      for(let i=0;i<w.length;i+=size) parts.push(w.slice(i,i+size).join(' '));
      const body=el(`<div>${head('Put it together')}<div class="card"><div class="en" style="margin:0">${esc(l.en)}</div></div><div id="t" style="margin-top:14px"></div></div>`);
      const nx=button(k<pick.length-1?'Next':'Follow along',()=>b1(k+1)); nx.disabled=true;
      const lq=quran&&!!l.ref;
      const tl=RafiqTiles.create({parts, en:l.en, strict:true, say:lq?null:((t,e)=>salahSay(p,l,t,e)), okText:'Right ✓',
        onCorrect:()=>{ nx.disabled=false; if(!lq) salahSay(p,l,l.ar,null); }});
      body.querySelector('#t').appendChild(tl.el);
      screen(body,[nx, button('Show the answer',()=>{ tl.reveal(); nx.disabled=false; },true)]);
    };
    b1(0);
  }
  // 5. Follow along: each word lit up in turn, with the audio where there is some
  function follow(){
    if(li>=lines.length) return nextStep();
    const l=lines[li];
    const body=el(`<div>${head('Follow along')}<div class="card"><div class="mid salah-ar follow" id="f">${l.words.map((w,k)=>`<span data-k="${k}">${esc(w.ar)}</span>`).join(' ')}</div>
      <div class="en">${esc(l.en)}</div></div>${silent}</div>`);
    const spans=[...body.querySelectorAll('#f span')];
    let timer=null;
    const lit=k=>spans.forEach((s,i)=>s.classList.toggle('on',i===k));
    const run=()=>{ clearInterval(timer);
      // words light up in step with what you hear: the reciter, or the app's voice
      const lq=quran&&!!l.ref;                              // آمِين: a prayer phrase inside a Quran part
      if(lq && S.recitation(l)) return recite(l, lit, null, body.querySelector('#f'));
      if(!lq) return sayTracked(l, lit, null, body.querySelector('#f'));
      let k=0; lit(k);                                      // silent read-along: a steady pace
      timer=setInterval(()=>{ k++; if(k>=spans.length){ clearInterval(timer); lit(-1); return; } lit(k); }, 900); };
    screen(body,[button(li<lines.length-1?'Next line':'Finish',()=>{ clearInterval(timer); RQ.stop(); li++; follow(); }), button('Again',run,true)]);
    run();
  }
  function end(){
    S.finishPart(p); setBar(1,1);
    const c=S.counts(), n=S.next();
    const body=el(`<div class="done"><div class="tick">🕌</div><h2>${esc(p.title)} — done</h2>
      <p>You now understand <b>${c.known} of ${c.total}</b> words of your salah. Its words join your salah review.</p></div>`);
    screen(body,[n?button('Next: '+n.title,()=>{location.href='learn.html?salah='+n.id}):button('Review',()=>{location.href='learn.html?salah=review'}),
      button('Back to your salah',()=>{location.href='salah.html'},true)]);
  }
  go();
}
/* Review: salah words that are due (spaced repetition), pick the meaning. */
function runSalahReview(){
  const S=RafiqSalah;
  if(!S.enabled()){ location.replace('dashboard.html'); return; }
  document.title='Salah review — Rafiq'; document.querySelector('.close').href='salah.html';
  let ids=S.due(); if(!ids.length) ids=S.words().filter(S.known).map(S.wid);
  // the words said most come first (TypeSafe, #124)
  const order=shuffle(ids.map(S.wordById).filter(Boolean).sort((a,b)=>S.freq(b)-S.freq(a)).slice(0,10));
  if(!order.length){ screen(el(`<div class="done"><div class="tick">🕌</div><h2>Nothing to review yet</h2><p>Finish a part of your salah and its words come back here to review.</p></div>`),
    [button('Back to your salah',()=>{location.href='salah.html'})]); return; }
  let right=0;
  const q=k=>{
    if(k>=order.length){ setBar(1,1); screen(el(`<div class="done"><div class="tick">✓</div><h2>Review done</h2><p>${right} of ${order.length} right first time.</p></div>`),
      [button('Back to your salah',()=>{location.href='salah.html'})]); return; }
    setBar(k,order.length); const w=order[k];
    const others=shuffle(S.words().filter(x=>x.en && x.en!==w.en && S.wid(x)!==S.wid(w))).slice(0,3);
    const body=el(`<div><p class="kicker">🕌 Salah review · ${k+1} of ${order.length}</p><p class="kicker">What does this mean?</p>
      <div class="card"><div class="big" id="w">${esc(w.ar)}</div></div><div class="opts" id="o"></div></div>`);
    const nx=button('Next',()=>q(k+1)); nx.disabled=true;
    shuffle(others.concat([w])).forEach(x=>{ const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=x.en;
      b.onclick=()=>{ if(!nx.disabled) return; const ok=x===w; if(ok) right++; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
        if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===w.en).classList.add('right');
        Progress.grade(S.wid(w), ok?'good':'again'); nx.disabled=false; if(ok) autoNext(nx,null); };
      body.querySelector('#o').appendChild(b); });
    screen(body,[nx]);
  };
  q(0);
}
/* Pray along (#124): the whole prayer in order at praying pace, each word lit with
   its meaning under it: something to open just before praying. Prayer phrases play
   the app's voice; the Quran is read along silently until there's a licensed recitation. */
function runPrayAlong(){
  const S=RafiqSalah;
  if(!S.enabled()){ location.replace('dashboard.html'); return; }
  if(!S.complete()) return salahUpsell('Pray along');
  document.title='Pray along — Rafiq'; document.querySelector('.close').href='salah.html';
  let surah=qs.get('surah'); if(!S.part(surah)||S.part(surah).group!=='surah') surah='ikhlas';
  const ORDER=['takbir','opening','refuge','fatiha1','fatiha2',surah,'ruku','rising','sujud','tashahhud','salawat','taslim'];
  const seq=[]; ORDER.forEach(id=>{ const p=S.part(id); if(p) p.lines.forEach(l=>seq.push({p,l})); });
  const qLines=seq.filter(x=>S.isQuran(x.p)).map(x=>x.l);
  if(S.needsRecitation(qLines)) return S.loadRecitation(qLines).then(runPrayAlong);
  let i=0, playing=true, timer=null, slow=false;
  try{ slow=localStorage.getItem('rafiq_prayalong_slow')==='1'; }catch(_){}
  function show(){
    clearTimeout(timer); if(window.RQ) RQ.stop();
    if(i>=seq.length){ setBar(1,1); screen(el(`<div class="done"><div class="tick">🕌</div><h2>That's the whole prayer</h2>
      <p>Open Pray along before you pray and the meanings will be with you.</p></div>`),[button('Back to your salah',()=>{location.href='salah.html'}),
      button('Again',()=>{i=0;playing=true;show();},true)]); return; }
    setBar(i,seq.length);
    const {p,l}=seq[i], quran=S.isQuran(p)&&!!l.ref, heard=!quran||!!S.recitation(l);   // آمِين: voiced, not recited
    // heading pinned to the top, credit to the bottom; only the line itself is centred between
    const body=el(`<div class="pa-screen"><p class="kicker">🕌 Pray along · ${esc(p.title)}</p>
      <div class="pa-mid">
      <div class="pa-cue" aria-live="polite"><span class="ic"></span><b></b></div>
      <div class="card pa${l.words.length>6?' long':''}">${l.words.map((w,k)=>`<span class="pw" data-k="${k}"><b>${esc(w.ar)}</b><i>${esc(w.en)}</i></span>`).join('')}</div>
      <p class="pa-en">${esc(l.en)}</p>
      ${quran&&!heard?`<p class="taphint">${esc(silentWhy())}</p>`:''}
      </div>
      ${quran&&heard?`<p class="taphint credit pa-credit">${esc(S.credit())}</p>`:''}
</div>`);
    // playback controls sit with Next, within thumb reach, so a long line never pushes them off screen
    const ctl=el(`<div class="pa-ctl"><button type="button" class="hear" id="pv">‹ Back</button><button type="button" class="hear" id="pp">${playing?'Pause':'Play'}</button>
      <button type="button" class="hear" id="sp">${slow?'Normal pace':'Slower'}</button></div>`);
    screen(body,[ctl, button(i<seq.length-1?'Next':'Finish',()=>{i++;show();})]);
    const words=[...body.querySelectorAll('.pw')];
    ctl.querySelector('#pv').onclick=()=>{ i=Math.max(0,i-1); show(); };
    ctl.querySelector('#pp').onclick=()=>{ playing=!playing; if(window.RQ) RQ.stop(); show(); };
    ctl.querySelector('#sp').onclick=()=>{ slow=!slow; try{ localStorage.setItem('rafiq_prayalong_slow',slow?'1':'0'); }catch(_){} show(); };
    /* What to do now, big and plain: Listen while it's said, Now repeat in the pause after it */
    const cue=body.querySelector('.pa-cue');
    const CUES={loading:['⏳','Loading…'], listen:['🔊','Listen'], repeat:['🗣','Now repeat'], read:['👀','Read along'], paused:['⏸','Paused']};
    const setCue=c=>{ cue.className='pa-cue '+c; cue.querySelector('.ic').textContent=CUES[c][0]; cue.querySelector('b').textContent=CUES[c][1]; };
    if(!playing){ setCue('paused'); words.forEach(w=>w.classList.add('on')); return; }
    const next=wait=>{ timer=setTimeout(()=>{ if(playing && body.isConnected){ i++; show(); } }, wait); };
    // while it's your turn to repeat, the whole line stays lit to read from
    const lit=k=>{ if(k<0 && cue.classList.contains('repeat')) return; words.forEach((w,n)=>w.classList.toggle('on',n===k)); };
    const repeat=()=>{ setCue('repeat'); words.forEach(w=>w.classList.add('on')); };
    const box=body.querySelector('.pa');
    // heard lines: Listen with words lit in step, then Now repeat. The Quran recitation has
    // its own pause to repeat in; a prayer phrase gets a pause about as long as itself.
    // the next verse's recitation downloads while this line plays, so it starts straight away
    const nx=seq[i+1], nr=nx && S.isQuran(nx.p) && S.recitation(nx.l);
    if(nr) fetch(nr.url, {mode:'no-cors'}).catch(()=>{});
    // "Listen" only once the audio is actually playing (a recitation can take a moment to arrive)
    const listening=()=>setCue('listen');
    // audio that couldn't play: read it instead, at a steady pace, rather than "repeat" what wasn't heard
    const unheard=()=>{ setCue('read'); words.forEach(w=>w.classList.add('on')); next((slow?1.6:1)*Math.max(2500, words.length*850)); };
    if(quran && heard){ setCue('loading'); return recite(l, lit, ok=>ok?next(slow?1600:800):unheard(), box, repeat, listening); }
    if(!quran){ setCue('loading');
      return sayTracked(l, lit, a=>{ if(!a) return unheard(); repeat(); const d=a&&a.duration>0?a.duration*1000:2000;
        next(Math.min(5000, Math.max(1500, d))*(slow?1.3:1)); }, box, slow, listening); }
    setCue('read');
    const per=(slow?1.6:1)*850;                           // silent read-along: a steady pace
    let k=0; lit(k);
    const step=()=>{ k++; if(k>=words.length){ lit(-1); next(slow?2400:1200); return; } lit(k); timer=setTimeout(step,per); };
    timer=setTimeout(step,per);
  }
  show();
}
/* Salah drills in Practise (#124): pick the meaning, hear it and pick the word,
   and "your 50 most-said words". Every answer feeds the salah review. */
function runSalahDrill(kind){
  const S=RafiqSalah;
  if(!S.enabled()){ location.replace('dashboard.html'); return; }
  if(!S.complete()) return salahUpsell('Salah practice');
  document.querySelector('.close').href='practise.html#salah';
  const all=S.words().filter(w=>w.en), top50=all.filter(w=>S.freq(w)).sort((a,b)=>S.freq(b)-S.freq(a)).slice(0,50);
  const knownW=all.filter(S.known);
  let items, title, n;
  if(kind==='listen'){ title='Hear it, pick the word'; const pool=(knownW.filter(S.voiced).length>=4?knownW:top50).filter(S.voiced); items=shuffle(pool).slice(0,10); }
  else if(kind==='top50'){ title='Your 50 most-said words'; items=shuffle(top50).slice(0,20); }
  else { title='Pick the meaning'; items=shuffle(knownW.length>=4?knownW:top50).slice(0,10); }
  document.title=title+' — Rafiq';
  let right=0;
  const q=k=>{
    if(k>=items.length){ setBar(1,1);
      let best=''; if(kind==='top50'){ try{ const b=+localStorage.getItem('rafiq_salah_top50')||0; if(right>b) localStorage.setItem('rafiq_salah_top50',right); best=right>b?' A new best!':` Your best: ${b} of 20.`; }catch(_){} }
      screen(el(`<div class="done"><div class="tick">🕌</div><h2>${right} of ${items.length}</h2><p>${esc(title)}.${best}</p></div>`),
        [button('Again',()=>runSalahDrill(kind)), button('Back to Practise',()=>{location.href='practise.html#salah'},true)]); return; }
    setBar(k,items.length); const w=items[k];
    const others=shuffle(all.filter(x=>x.en!==w.en && S.wid(x)!==S.wid(w) && (kind!=='listen'||S.voiced(x)))).slice(0,3);
    const listen=kind==='listen';
    const body=el(`<div><p class="kicker">🕌 ${esc(title)} · ${k+1} of ${items.length}</p>
      <div class="card">${listen?`<button type="button" class="hear-big" id="w" aria-label="Play again">🔊</button>`:`<div class="big" id="w">${esc(w.ar)}</div>`}
      ${S.freq(w)&&!listen?`<div class="tr">said ${S.freq(w)} times in a four-rakah prayer</div>`:''}</div><div class="opts" id="o"></div></div>`);
    const nx=button('Next',()=>q(k+1)); nx.disabled=true; const wEl=body.querySelector('#w');
    const hear=listen&&listenThen(body, done=>RQ.speak(S.sayAr(w),wEl,done), 'pick', 'Now pick the word');
    if(listen) wEl.onclick=hear;
    shuffle(others.concat([w])).forEach(x=>{ const b=document.createElement('button'); b.className='opt'; b.type='button';
      if(listen){ b.style.cssText='font-family:var(--ar);font-size:24px'; b.textContent=x.ar; } else b.textContent=x.en; b._w=x;
      b.onclick=()=>{ if(!nx.disabled) return; const ok=x===w; if(ok) right++; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
        if(!ok) [...body.querySelectorAll('.opt')].find(o=>o._w===w).classList.add('right');
        Progress.grade(S.wid(w), ok?'good':'again'); nx.disabled=false;
        if(ok) autoNext(nx, S.voiced(w)?S.sayAr(w):null, listen?null:wEl); };
      body.querySelector('#o').appendChild(b); });
    screen(body,[nx]);
    if(listen) hear();
  };
  q(0);
}
/* Bridge card after "Meet new words": a word you just met shares a root with
   something you say in salah. */
function salahBridge(words){
  const S=window.RafiqSalah; if(!S || !S.enabled()) return null;
  for(const w of words){ const b=S.bridgeFor(w.id); if(b) return Object.assign({w}, b); }
  return null;
}
function showBridge(b, then){
  const l=b.line, S=RafiqSalah;
  const phrase=l.words.map((x,k)=>k===b.index?`<mark>${esc(x.ar)}</mark>`:esc(x.ar)).join(' ');
  const body=el(`<div><p class="kicker">🕌 You'll hear this in your salah</p>
    <div class="card"><div class="mid salah-ar">${phrase}</div><div class="en">${esc(l.en)}</div>
    <p class="wnote" style="margin-top:14px"><b class="ar">${esc(b.w.ar)}</b> (${esc(b.w.en.split('/')[0])}) shares its root <b class="ar">${esc(b.root.split('').join(' '))}</b>
      with <b class="ar">${esc(b.word.ar)}</b>, “${esc(b.word.en)}”, in ${esc(b.part.title)}.</p></div></div>`);
  screen(body,[button('Continue',then), button('See your salah',()=>{location.href='salah.html'},true)]);
}

(async function(){
  if(typeof requireLogin==='function') requireLogin();
  await Progress.init();
  if(qs.get('salah') && window.RafiqSalah){ const k=qs.get('salah');
    // the Quran's official meanings and recitation first, so every screen uses the same ones
    if(RafiqSalah.enabled()){ screen(el(`<div class="done"><p>Loading your salah…</p></div>`),[]); await RafiqSalah.ready(); }
    return k==='review' ? runSalahReview() : k==='prayalong' ? runPrayAlong() : ['quiz','listen','top50'].includes(k) ? runSalahDrill(k) : runSalah(k); }
  const scene=qs.get('scene')&&typeof SCENES!=='undefined'&&SCENES.find(s=>s.id===qs.get('scene'));
  if(scene) return runScene(scene);
  let p=RafiqPath.units().find(x=>x.n===qs.get('u'))||RafiqPath.next().unit;
  // A locked unit or step (someone typed the address, or an old link) sends
  // you to where you actually are on the path.
  if(!RafiqPath.unitOpen(p.n)) p=RafiqPath.next().unit;
  const steps=RafiqPath.steps(p);
  let step=steps.find(s=>s.key===qs.get('s'))||steps.find(s=>!RafiqPath.stepDone(p.n,s.key))||steps[0];
  if(!RafiqPath.stepOpen(p.n,step.key)) step=steps.find(s=>RafiqPath.stepOpen(p.n,s.key)&&!RafiqPath.stepDone(p.n,s.key))||steps[0];
  document.title=step.title+' — Rafiq';
  const run=()=>({words:runWords,listen:runListen,grammar:runGrammar,practise:runPractise,speak:runSpeak,
    letters:runLetters,vowels:runVowels,hearing:runHearing,chat:runChat,test:runTest})[step.kind](p,step);
  // every two lessons, a short recap before the next new one (#158)
  if(!p.alpha && step.kind!=='test' && !RafiqPath.stepDone(p.n,step.key) && RafiqPath.recapDue()) runRecap(p, run); else run();
})();
</script>
