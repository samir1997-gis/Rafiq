<style>
.wnote{margin:10px auto 16px;max-width:380px;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--rule);font-size:1rem;line-height:1.5}
.wnote.up{background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);color:var(--ink)}
body{background:var(--paper)}
/* lessons have no tab bar, so none of the space site.css keeps for it (the page scrolled 68px) */
body{padding-bottom:0!important}
.lx{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.close{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:18px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.bar{flex:1;height:8px;background:var(--paper-deep);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verdigris);transition:width var(--settle) var(--ease-out)}
.kicker{font-family:var(--ut);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.stage{flex:1;display:flex;flex-direction:column}
/* the screen's content sits in the middle of the space above the buttons (a touch above centre), not in the top third;
   long content and chats just start at the top and scroll */
.stage>:first-child{margin:auto 0;padding-bottom:4vh}
.stage>:first-child:has(.chat){margin:0;padding-bottom:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:30px 22px;text-align:center}
.pic{font-size:64px;line-height:1.1;margin-bottom:6px}
.big{font-family:var(--ar);direction:rtl;font-size:clamp(2.5rem,11vw,3.5rem);line-height:1.6;font-weight:600;cursor:pointer;touch-action:manipulation}
.mid{font-family:var(--ar);direction:rtl;font-size:clamp(1.75rem,7.5vw,2.25rem);line-height:1.8;cursor:pointer;touch-action:manipulation}
.tr{font-family:var(--ut);font-size:.875rem;color:var(--ink-soft);margin-top:4px}
.en{font-size:1.25rem;line-height:1.4;margin-top:14px}
.hear{margin-top:16px;font-size:.95rem;min-height:44px;border:1px solid var(--rule);background:var(--paper);border-radius:22px;padding:9px 18px;color:var(--ink);cursor:pointer}
.speaking{opacity:.55}
.pa.speaking,.follow.speaking{opacity:1}
.who{font-family:var(--ar);color:var(--rubric);font-size:15px;margin-bottom:4px}
.note h3{font-size:18px;margin:0 0 10px}
.note .gh{font-size:20px;line-height:1.25;letter-spacing:-.01em;margin:0}
.note .gt{font-family:var(--ar);direction:rtl;text-align:center;font-size:14px;color:var(--ink-soft);margin:4px 0 10px}
.note .gtr{color:var(--ink);font-size:1.05rem;margin-top:2px}
/* paired examples (هَذا · هَذِهِ): one per row, English right under its Arabic */
.pairs{margin:6px 0 4px;border-top:1px solid var(--rule)}
.pair{padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer;touch-action:manipulation}
.pair .mid{font-size:clamp(21px,5.6vw,26px);line-height:1.6}
.pair .gtr{margin-top:0}
.gbad{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:10px;text-align:left;
  background:color-mix(in srgb,var(--rubric) 8%,var(--card));border:1px solid color-mix(in srgb,var(--rubric) 30%,transparent)}
.gbad .gx{color:var(--rubric);font-weight:700;font-size:1.1rem;line-height:1.6}
.gbad s{font-family:var(--ar);font-size:1.25rem;color:var(--rubric);text-decoration-thickness:2px;display:block;line-height:1.7}
.gbad p{margin:2px 0 0;font-size:.95rem;color:var(--ink)}
.wparts{display:flex;flex-direction:row-reverse;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin:12px 0 4px;padding-top:10px;border-top:1px dashed var(--rule)}
.wparts span{display:flex;flex-direction:column;align-items:center;gap:2px}
.wparts b{font-family:var(--ar);font-weight:500;font-size:1.3rem;line-height:1.6}
.wparts i{font-style:normal;font-size:.85rem;color:var(--verdigris);font-weight:600;max-width:9em;text-align:center;line-height:1.2}
.big-hear{font-size:2.4rem;padding:18px 26px;margin:6px auto;min-width:96px;min-height:96px;touch-action:manipulation;transition:transform 100ms ease-out}
.big-hear:active{transform:scale(.94)}
@media (prefers-contrast:more){.gbad{background:var(--card);border:2px solid var(--rubric)}.wparts{border-top-style:solid}}
.gap{color:var(--rubric);border-bottom:2px solid var(--rubric);padding:0 12px}
.ar-opts .opt{font-family:var(--ar);font-size:1.4rem}
/* Your salah */
.salah-ar{line-height:2.1}
.ar{font-family:var(--ar);font-weight:600}
.sw-list{padding:6px 16px;text-align:left}
.sw-row{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.sw-row:last-child{border-bottom:0}
.sw-ar{font-family:var(--ar);direction:rtl;font-size:1.85rem;line-height:1.5;min-width:100px;text-align:right}
.sw-en{flex:1;font-size:1.05rem;line-height:1.45}
.pa{display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;gap:14px 14px;padding:30px 16px}
.pw{display:flex;flex-direction:column;align-items:center;border-radius:14px;padding:6px 10px 8px;transition:background .2s}
.pw b{font-family:var(--ar);font-size:clamp(2rem,9vw,2.6rem);line-height:1.6;font-weight:600}
.pw i{font-style:normal;font-size:.95rem;color:var(--ink-soft);direction:ltr;max-width:9em;text-align:center;line-height:1.3}
.pw.on{background:color-mix(in srgb,var(--verdigris) 22%,transparent)}
/* long lines (the opening supplication, salawat) a size down, so a whole line fits a small phone */
.pa.long{gap:2px 4px;padding:16px 8px}
.pa.long .pw{padding:3px 7px 5px}
.pa.long .pw b{font-size:clamp(1.45rem,6.4vw,1.9rem);line-height:1.5}
.pa.long .pw i{font-size:.82rem}
.pa.long~.pa-en{font-size:1rem;margin-top:12px}
.pa.long~.taphint{margin-top:6px}
/* Exercise screens: heading at the top, the exercise centred, notes at the bottom (zones()) */
.stage>.x-screen{margin:0;padding:0;flex:1;display:flex;flex-direction:column}
.x-mid{margin:auto 0;padding:8px 0 3vh}
.x-screen:has(.chat)>.x-mid{margin:0}
.x-bottom{padding-top:10px}
.x-bottom>*{margin-top:0}
.x-bottom .taphint,.x-bottom .x-note{font-size:.85rem}
.howto{margin:16px 0 0;text-align:center;font-size:1.05rem;font-weight:600;color:var(--ink);line-height:1.4}
/* Pray along fills the space above the buttons: heading at the top, credit at the bottom */
.stage>.pa-screen{margin:0;padding:0;flex:1;display:flex;flex-direction:column}
.pa-mid{margin:auto 0;padding:12px 0}
.pa-credit{margin:0;padding-top:10px;font-size:.85rem}
.pa-cue{display:flex;align-items:center;justify-content:center;gap:10px;width:max-content;margin:4px auto 14px;padding:10px 24px;
  border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font-size:1.35rem;line-height:1.2;
  transition:background var(--settle) var(--ease-out),color var(--settle) var(--ease-out),transform var(--settle) var(--ease-out)}
.pa-cue b{font-weight:800;letter-spacing:-.01em}
.pa-cue .ic{font-size:1.25em;line-height:1}
.pa-cue.listen .ic{animation:cue-pulse 1.1s ease-in-out infinite}
.pa-cue.repeat{background:var(--ink);color:var(--paper);transform:scale(1.06)}
.pa-cue.paused,.pa-cue.read,.pa-cue.loading{border-style:dashed}
.pa-cue.loading{opacity:.7}
@keyframes cue-pulse{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.pa-cue.listen .ic{animation:none}.pa-cue.repeat{transform:none}}
.pa-en{font-size:1.2rem;line-height:1.4;text-align:center;margin:20px 8px 0}
.pa-ctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pa-ctl .hear{margin-top:0;flex:1;max-width:9em}
.sw-freq{display:block;font-size:.875rem;color:var(--gold);font-weight:700;margin-top:2px}
.sw-root{display:block;font-size:.875rem;color:var(--ink-soft);margin-top:2px}
.sw-br{font-size:.875rem;color:var(--verdigris);margin-top:3px}
.follow span{border-radius:6px;padding:0 3px;transition:background .15s}
.follow span.on{background:color-mix(in srgb,var(--verdigris) 26%,transparent)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:5px;padding:0 3px}
.taphint{font-size:.95rem;line-height:1.45;color:var(--ink-soft);text-align:center;margin:12px 0 0}
.endings{margin-top:14px;text-align:left;font-size:.95rem;line-height:1.55;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:10px}
.endings summary{color:var(--verdigris);cursor:pointer;font-weight:700;padding:6px 0;list-style:none}
.endings summary::-webkit-details-marker{display:none}
.endings summary::before{content:'ⓘ ';font-weight:400}
.endings p{margin:6px 0}
.endings ul{margin:4px 0 6px;padding-left:18px}
.endings li{margin:3px 0}

.note p{color:var(--ink-soft);font-size:1.05rem;line-height:1.55;text-align:left;margin-top:12px}
.foot{padding-top:20px;display:flex;flex-direction:column;gap:10px}
.go{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--verdigris);color:#fff;font-size:1.0625rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.go:disabled{opacity:.45}
.go.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.go:active{transform:scale(.98)}
.go small{display:block;font-size:.85rem;font-weight:400;color:var(--ink-soft);margin-top:2px}
/* Reading starter */
.hl{color:var(--rubric)} b.hl{font-weight:700}
.forms{display:flex;justify-content:center;gap:14px;margin-top:14px;direction:rtl}
.ex-k{margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--rule);text-align:center}
.exs{display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:12px;direction:rtl;width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:12px;
  padding:4px 14px;color:var(--ink);cursor:pointer;touch-action:manipulation;transition:transform var(--press) var(--ease-out)}
.ex:active{transform:scale(.98)}
.ex-ar{font-family:var(--ar);font-size:26px;line-height:1.9;flex:0 0 auto}
.ex-tx{direction:ltr;text-align:left;flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.ex-tr{font-family:var(--ut);font-size:.875rem;color:var(--ink-soft)}
.ex-en{font-size:1rem}
.ex-pos{font-family:var(--ut);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);flex:0 0 auto}
.mk{position:relative;display:inline-block;white-space:nowrap}
.mk-r{color:var(--rubric)}
.mk-i{position:absolute;inset:0;color:var(--ink);pointer-events:none}
.abc{margin:20px auto 0;max-width:420px}
.abc .kicker{text-align:center}
.abc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;direction:rtl}
.abc-l{font-family:var(--ar);font-size:1.75rem;line-height:1;height:54px;padding:0 0 4px;border-radius:10px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-soft);opacity:.5;cursor:pointer;touch-action:manipulation;transition:transform var(--press) var(--ease-out)}
.abc-l:active{transform:scale(.92)}
.abc.intro .abc-l{opacity:1;color:var(--ink);background:var(--paper)}
.abc-l.got{opacity:1;color:#fff;background:var(--verdigris);border-color:var(--verdigris)}
/* letters just learned turn green one after another (off with reduced motion, via site.css) */
.abc-l.new{animation:abc-in 380ms var(--ease-out) both}
@keyframes abc-in{from{opacity:.5;transform:scale(.84);background:var(--card);color:var(--ink-soft);border-color:var(--rule)}}
.abc-tip{font-size:.9rem;color:var(--ink-soft);text-align:center;margin-top:8px}
.abc-h{font-size:22px;margin:4px 0 8px}
.abc-p{color:var(--ink-soft);font-size:1.05rem;line-height:1.55;margin:0}
.hear-big{font-size:40px;width:96px;height:96px;border-radius:50%;border:1px solid var(--verdigris);background:var(--paper);cursor:pointer;
  touch-action:manipulation;transition:transform var(--press) var(--ease-out)}
.hear-big:active{transform:scale(.94)}
.rev{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}
.miss-l{display:flex;justify-content:center;gap:10px;margin-top:16px;direction:rtl}
.miss-l span{font-family:var(--ar);font-size:30px;line-height:1.6;width:58px;border-radius:12px;background:var(--card);border:1px solid var(--rubric);color:var(--rubric)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{min-height:56px;border:1px solid var(--rule);border-radius:14px;background:var(--card);font-size:1.0625rem;color:var(--ink);cursor:pointer;padding:8px 12px}
.opt.right{background:var(--verdigris);border-color:var(--verdigris);color:#fff}
.opt.wrong{background:var(--rubric);border-color:var(--rubric);color:#fff}
textarea.ar-in{width:100%;min-height:110px;font-family:var(--ar);font-size:21px;line-height:1.7;direction:rtl;text-align:right;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;color:var(--ink);resize:vertical;margin-top:14px}
.verdict{font-size:1rem;margin-top:10px;text-align:left}
.verdict.ok{color:var(--verdigris)} .verdict.no{color:var(--rubric)}
.row{display:flex;gap:10px}.row>*{flex:1}
.done{text-align:center;padding-top:8px}
.done .tick{font-size:64px}
.done h2{font-size:1.75rem;line-height:1.2;letter-spacing:-.01em;margin:12px 0 8px}
.done p{color:var(--ink-soft);font-size:1.05rem}
.streak{display:inline-block;margin-top:14px;font-family:var(--ut);font-size:12px;background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:6px 14px}
.hide{display:none}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.6}
.bub .a{font-family:var(--ar);direction:rtl;font-size:20px;line-height:1.8}
.bub .e{font-size:.9rem;color:var(--ink-soft)}
.bub.goal,.bub.note.goal{font-size:1rem;color:var(--ink-soft);border-style:solid}
.bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--rule);border-bottom-left-radius:4px;cursor:pointer}
.bub.me{align-self:flex-end;background:var(--verdigris);color:#fff;border-bottom-right-radius:4px}
.bub.me .e{color:rgba(255,255,255,.85)}
.bub.note{align-self:stretch;max-width:none;background:transparent;border:1px dashed var(--rule);font-size:14px}
.bub.note.ok{color:var(--verdigris)} .bub.note.no{color:var(--rubric)}
/* While the on-screen Arabic keyboard is open on a phone it covers the bottom
   of the screen, where this page keeps its buttons — make room above it. */
@media (max-width:860px){ body:has(.arkb.on) .lx{padding-bottom:calc(290px + env(safe-area-inset-bottom))} }
/* Arabic keyboard (arkb.js) */
.arkb{position:absolute;z-index:200;background:rgba(var(--paper-rgb,241,236,224),.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 28px -10px rgba(var(--ink-rgb),.4);padding:10px;display:none;max-width:360px}
.arkb.on{display:block}
.arkb-row{display:flex;gap:4px;margin-bottom:4px;justify-content:center}
.arkb-key{font-family:var(--ar);font-size:17px;line-height:1;min-width:30px;min-height:38px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);cursor:pointer;padding:0 2px}
.arkb-harakat{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap;justify-content:center;border-top:1px dashed var(--rule);padding-top:8px}
.arkb-hk{font-size:15px;color:var(--rubric);min-width:34px}
.arkb-bottom{display:flex;gap:6px;margin-top:4px}
.arkb-wide{flex:1;font-family:var(--la);font-size:12.5px;min-height:38px}
@media (max-width:860px){.arkb{position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;border-radius:14px 14px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.arkb-key{min-width:8.6vw;min-height:42px;font-size:18px}}
/* short screens (iPhone SE): a compact Pray along so the buttons stay in view */
@media (max-height:720px){
  .pa{padding:10px 6px;gap:0 6px}
  .pw{padding:2px 7px 4px}
  .pw b{font-size:clamp(1.45rem,6.8vw,1.8rem);line-height:1.35}
  .pw i{font-size:.8rem;line-height:1.2}
  .pa.long .pw b{font-size:1.2rem;line-height:1.35}
  .pa.long .pw i{font-size:.72rem}
  .pa-en,.pa.long~.pa-en{font-size:.95rem;line-height:1.35;margin-top:8px}
  .pa.long~.pa-en{display:none}                        /* long lines: each word's meaning is under it already */
  .pa~.taphint{margin-top:4px;font-size:.8rem}
  .pa~.taphint:not(.credit){display:none}                 /* "Listen and read along": the screen says it already */
  .stage>:first-child{padding-bottom:0}
  .lhead{margin-bottom:8px}
  .foot{padding-top:10px;gap:8px}
  .pa-ctl .hear{min-height:40px;padding:6px 12px}
  .pa-cue{font-size:1.1rem;padding:7px 18px;margin:0 auto 8px}
  .pa-mid{padding:6px 0}
  .pa-credit{font-size:.75rem;padding-top:6px}
}
</style>
