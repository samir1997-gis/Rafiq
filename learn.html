<script>
DATA.forEach(u=>Object.assign(u,(typeof EXTRA!=='undefined'&&EXTRA[u.n])||{}));
const qs=new URLSearchParams(location.search);
const stage=document.getElementById('stage'), bar=document.getElementById('bar');
const say=(t,el)=>{ if(window.RQ) RQ.speak(t.replace(/=/g,' '),el); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setBar(i,n){ bar.style.width=Math.round(100*i/Math.max(1,n))+'%'; }
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function screen(body, buttons){
  stage.innerHTML='';
  stage.appendChild(body);
  const f=document.createElement('div'); f.className='foot';
  buttons.forEach(b=>f.appendChild(b)); stage.appendChild(f);
  window.scrollTo(0,0);
}
function button(label, fn, ghost){ const b=document.createElement('button'); b.className='go'+(ghost?' ghost':''); b.type='button'; b.textContent=label; b.onclick=fn; return b; }

/* ── steps ─────────────────────────────────────────────── */
function runWords(p, step){
  const words=RafiqPath.wordsOf(p, step.batch);
  const total=words.length*2;            // meet each word, then a short check
  let i=0;
  const meet=()=>{
    if(i>=words.length) return check(0);
    const w=words[i]; setBar(i,total);
    const pic=PIC[w.id]?`<div class="pic" aria-hidden="true">${PIC[w.id]}</div>`:'';
    const body=el(`<div><p class="kicker">New word ${i+1} of ${words.length}</p>
      <div class="card">${pic}<div class="big" id="w">${esc(w.ar)}</div>
      <div class="tr">${esc(w.tr||'')}</div><div class="en">${esc(w.en)}</div>
      <button class="hear" type="button" id="h">🔊 Hear it again</button></div>
      <p class="kicker" style="margin-top:14px;text-align:center">Say it aloud once, then carry on</p></div>`);
    screen(body,[button(i<words.length-1?'Next word':'Check yourself',()=>{i++;meet()})]);
    const a=body.querySelector('#w'); a.onclick=()=>say(w.ar,a); body.querySelector('#h').onclick=()=>say(w.ar,a);
    say(w.ar,a);
  };
  // Light check straight after meeting: pick the meaning. Learning, not a test —
  // a miss just shows the answer and moves on.
  const order=shuffle(words);
  const check=k=>{
    if(k>=order.length){
      // into daily review; the first time through, every word counts as met today
      const first=!RafiqPath.stepDone(p.n, step.key);
      words.forEach(w=>{ if(Progress.isNew('v:'+w.id)) Progress.grade('v:'+w.id,'good'); if(first) RafiqPath.wordMet(); });
      return finish(p, step);
    }
    setBar(words.length+k,total);
    const w=order[k];
    const pool=shuffle(words.filter(x=>x!==w && x.en!==w.en)).slice(0,3).concat([w]);
    const body=el(`<div><p class="kicker">What does this mean?</p>
      <div class="card"><div class="big" id="w">${esc(w.ar)}</div></div><div class="opts" id="o"></div></div>`);
    const a=body.querySelector('#w'); a.onclick=()=>say(w.ar,a);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(pool).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=x.en.split('/')[0];
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===w?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(x===w);
        if(x!==w) [...body.querySelectorAll('.opt')].find(o=>o.textContent===w.en.split('/')[0]).classList.add('right');
        say(w.ar,a); next.disabled=false; };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet();
}

function runListen(p, step){
  const u=RafiqPath.unitData(p.n), lines=u.dialogue, c=u.convos&&u.convos[0];
  let i=0, showEn=true;
  const show=()=>{
    if(i>=lines.length) return finish(p, step);
    setBar(i,lines.length);
    const l=lines[i];
    const body=el(`<div><p class="kicker">${esc(c?c.sub:'Conversation')} · line ${i+1} of ${lines.length}</p>
      <div class="card"><div class="who">${esc(l[0])}</div><div class="mid" id="a">${esc(l[1])}</div>
      <div class="en${showEn?'':' hide'}" id="e">${esc(l[2])}</div>
      <button class="hear" type="button" id="h">🔊 Again</button></div>
      <p class="kicker" style="margin-top:14px;text-align:center">Listen, then say it after the voice</p></div>`);
    const a=body.querySelector('#a'); a.onclick=()=>say(l[1],a); body.querySelector('#h').onclick=()=>say(l[1],a);
    const tog=button(showEn?'Hide English':'Show English',()=>{showEn=!showEn;body.querySelector('#e').classList.toggle('hide',!showEn);tog.textContent=showEn?'Hide English':'Show English'},true);
    screen(body,[button(i<lines.length-1?'Next line':'Finish',()=>{i++;show()}),tog]);
    say(l[1],a);
  };
  show();
}

function runGrammar(p, step){
  const notes=RafiqPath.unitData(p.n).grammar||[];
  let i=0;
  const show=()=>{
    if(i>=notes.length) return finish(p, step);
    setBar(i,notes.length);
    const g=notes[i];
    const body=el(`<div><p class="kicker">How it works · ${i+1} of ${notes.length}</p>
      <div class="card note"><h3>${esc(g.t)}</h3><div class="mid" id="a">${esc(g.ar.replace(/=/g,' '))}</div><p>${esc(g.en)}</p></div></div>`);
    const a=body.querySelector('#a'); a.onclick=()=>say(g.ar,a);
    screen(body,[button(i<notes.length-1?'Next':'Finish',()=>{i++;show()})]);
  };
  show();
}

/* ── Reading starter ─────────────────────────────────────
   Meet each letter (shape, name, sound, joined forms, three words with it in
   red), then pick letters by sound. Before a new group, unless the learner came
   straight from the last one, a short warm-up on earlier letters. The unit ends
   with a listening test. Every answer about a letter is kept as 'l:<letter>'
   (box 1 = missed last time) so warm-ups and practice can aim at it. */
const ZWJ='\u200d';
const AR_LETTER=/[ء-ي]/, AR_MARK=/[ً-ْٰ]/;
const NO_JOIN=/[اأإآدذرزوؤةء]/;                 // never join to the letter after them
const POS=['start','middle','end'];
const ALL_LETTERS=ALPHABET_GROUPS.flatMap((g,gi)=>g.letters.map(l=>({ch:l[0], name:l[1], group:gi, l})));
const letterOf=ch=>(ALL_LETTERS.find(x=>x.ch===ch)||{}).l;
function forms(l, joins){
  return joins ? [l, l+ZWJ, ZWJ+l+ZWJ, ZWJ+l] : [l, ZWJ+l];
}
const gradeLetter=(ch,ok)=>Progress.grade('l:'+ch, ok?'good':'again');
const weakLetter=ch=>{ const r=Progress.get('l:'+ch); return !!(r && r.box===1); };
const lastSeen=ch=>{ const r=Progress.get('l:'+ch); return (r && r.at) || ''; };
const trHTML=t=>esc(t).replace(/\[(.+?)\]/g,'<b class="hl">$1</b>');

/* A word with one letter in red. Zero-width joiners either side of the colour
   change keep the letters joined in browsers that shape each span separately. */
function hlWord(word, ch, pos){
  const c=[...word], base=[]; c.forEach((x,i)=>{ if(AR_LETTER.test(x)) base.push(i); });
  const is=i=>ch==='ا' ? /[اأإآ]/.test(c[i]) : c[i]===ch;
  const hits=base.filter(is); if(!hits.length) return esc(word);
  const first=base[0], last=base[base.length-1];
  const at = pos==='start' ? (is(first)?first:hits[0])
           : pos==='end'   ? (is(last)?last:hits[hits.length-1])
           : (hits.find(i=>i!==first&&i!==last) ?? hits[0]);
  let end=at+1; while(end<c.length && AR_MARK.test(c[end])) end++;
  const prev=base.filter(i=>i<at).pop(), next=base.find(i=>i>=end);
  const joinIn = prev!=null && !NO_JOIN.test(c[prev]);
  const joinOut= next!=null && !NO_JOIN.test(c[at]) && c[next]!=='ء';
  return esc(c.slice(0,at).join(''))+(joinIn?ZWJ:'')+
    `<span class="hl">${joinIn?ZWJ:''}${esc(c.slice(at,end).join(''))}${joinOut?ZWJ:''}</span>`+
    (joinOut?ZWJ:'')+esc(c.slice(end).join(''));
}
/* A word with one vowel mark in red: the word in red underneath, and on top the
   same word in ink without that mark (removing a mark doesn't move the letters). */
function hlMark(word, mark){
  const i=word.indexOf(mark); if(i<0) return esc(word);
  return `<span class="mk"><span class="mk-r">${esc(word)}</span><span class="mk-i" aria-hidden="true">${esc(word.slice(0,i)+word.slice(i+mark.length))}</span></span>`;
}

/* The whole alphabet, right to left from the top right. intro: every letter
   plain. Otherwise letters from finished groups are green (the ones just learned
   settle in last) and the rest greyed. Tap any letter to hear its name. */
function learnedLetters(){
  return new Set(ALPHABET_GROUPS.flatMap((g,i)=>RafiqPath.stepDone('00','letters'+(i+1)) ? g.letters.map(l=>l[0]) : []));
}
function alphabetChart(title, fresh, intro){
  const got=intro?null:learnedLetters();
  const w=el(`<div class="abc${intro?' intro':''}"><p class="kicker">${esc(title)}${got?` · ${got.size} of ${ALL_LETTERS.length}`:''}</p>
    <div class="abc-grid"></div><p class="abc-tip">Tap a letter to hear its name</p></div>`);
  const grid=w.querySelector('.abc-grid');
  ALL_LETTERS.forEach(x=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=x.ch;
    const on=!!(got&&got.has(x.ch)), nu=on&&!!fresh&&fresh.includes(x.ch);
    b.className='abc-l'+(on?' got':'')+(nu?' new':'');
    if(nu) b.style.animationDelay=(150+70*fresh.indexOf(x.ch))+'ms';
    b.setAttribute('aria-label', x.name+(got?(on?', learned':', not learned yet'):''));
    b.onclick=()=>say(x.name,b);
    grid.appendChild(b);
  });
  return w;
}

/* One letter's card: big letter (tap for its name), sound, joined forms, and
   three words with the letter in red (tap to hear). */
function letterCard(l, kicker){
  const [ch,name,sound,,,exs]=l, joins=!sound.includes('*');
  const f=forms(ch,joins), labels=joins?['alone','start','middle','end']:['alone','end'];
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><div class="big" id="w" style="font-size:72px">${ch}</div>
    <div class="mid" style="font-size:20px">${esc(name)}</div>
    <div class="en" style="font-size:16px">${esc(sound.replace(' *',''))}</div>
    <div class="forms">${f.map((x,k)=>`<div><div class="mid" style="cursor:default">${x}</div><div class="tr">${labels[k]}</div></div>`).join('')}</div>
    ${joins?'':'<p class="tr">Doesn\'t join to the letter after it</p>'}
    <p class="kicker ex-k">In words · tap to hear</p>
    <div class="exs">${(exs||[]).map((e,k)=>`<button type="button" class="ex" data-k="${k}">
      <span class="ex-ar">${hlWord(e[0],ch,POS[k])}</span>
      <span class="ex-tx"><span class="ex-tr">${trHTML(e[1])}</span><span class="ex-en">${esc(e[2])}</span></span>
      <span class="ex-pos">${POS[k]}</span></button>`).join('')}</div></div></div>`);
  const a=body.querySelector('#w'); a.onclick=()=>say(name,a);
  body.querySelectorAll('.ex').forEach(b=>b.onclick=()=>say(exs[+b.dataset.k][0],b));
  return {body, speak:()=>say(name,a)};
}

/* "Which letter is this?": the sound, and the first sound of its example word. */
function letterQuestion({t, options, kicker, at, total, onNext}){
  setBar(at,total);
  const [ch,name,sound,,exEn]=t;
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><div class="en" style="margin:0">${esc(sound.replace(' *','').split(' — ')[0])}</div>
    <div class="tr">the first sound of the word for "${esc(exEn)}"</div></div><div class="opts" id="o"></div></div>`);
  const next=button('Next',onNext); next.disabled=true;
  shuffle(options).forEach(x=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=x[0];
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=x===t; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok); gradeLetter(ch,ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===ch).classList.add('right');
      say(name,null); next.disabled=false; };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
}

/* Up to 5 earlier letters: ones missed last time first, then the group just
   before this one, then whichever has gone longest without practice. */
function warmUpLetters(group){
  const earlier=ALPHABET_GROUPS.slice(0,group).flatMap(g=>g.letters);
  const pick=[], add=l=>{ if(pick.length<5 && !pick.includes(l)) pick.push(l); };
  shuffle(earlier.filter(l=>weakLetter(l[0]))).slice(0,2).forEach(add);
  shuffle(ALPHABET_GROUPS[group-1].letters).slice(0,2).forEach(add);
  earlier.slice().sort((a,b)=>lastSeen(a[0]).localeCompare(lastSeen(b[0]))).forEach(add);
  return shuffle(pick);
}

function runLetters(p, step){
  const g=ALPHABET_GROUPS[step.group], L=g.letters;
  const intro=step.group===0;
  // straight on from the last group (Continue learning) the earlier letters are fresh: no warm-up
  const warm=step.group>0 && !qs.get('cont') ? warmUpLetters(step.group) : [];
  const earlier=ALPHABET_GROUPS.slice(0,step.group).flatMap(x=>x.letters);
  const before=(intro?1:0)+warm.length, total=before+L.length*2;
  const start=()=>{
    if(!intro) return warmUp(0);
    setBar(0,total);
    const body=el(`<div><p class="kicker">Before you start</p><div class="card">
      <h2 class="abc-h">The Arabic alphabet</h2>
      <p class="abc-p">These are the 28 letters of Arabic. They're read from right to left, starting at the top right. You'll learn them in 7 small groups, beginning with the first four.</p></div></div>`);
    body.querySelector('.card').appendChild(alphabetChart('All 28 letters', null, true));
    screen(body,[button('Start with the first letters',()=>meet(0))]);
  };
  const warmUp=k=>{
    if(k>=warm.length) return meet(0);
    const t=warm[k], mates=ALPHABET_GROUPS.find(x=>x.letters.includes(t)).letters;
    const opts=[t].concat(shuffle(mates.filter(l=>l!==t)).slice(0,3));
    shuffle(earlier.filter(l=>!opts.includes(l))).slice(0,Math.max(0,4-opts.length)).forEach(l=>opts.push(l));
    letterQuestion({t, options:opts, kicker:`Warm-up before new letters · ${k+1} of ${warm.length}`,
      at:k+(intro?1:0), total, onNext:()=>warmUp(k+1)});
  };
  const meet=i=>{
    if(i>=L.length) return check(0);
    setBar(before+i,total);
    const c=letterCard(L[i], `${g.title} · ${i+1} of ${L.length}`);
    screen(c.body,[button(i<L.length-1?'Next letter':'Check yourself',()=>meet(i+1))]);
    c.speak();
  };
  const order=shuffle(L);
  const check=k=>{
    if(k>=order.length) return finish(p, step);
    letterQuestion({t:order[k], options:L, kicker:'Which letter is this?', at:before+L.length+k, total, onNext:()=>check(k+1)});
  };
  start();
}

function runVowels(p, step){
  const V=VOWEL_MARKS, total=V.length+5;
  // the mark after ب in red; for a long vowel, the letter after it
  const shown=(w,word,pos)=>{ const m=w.slice(1); return AR_MARK.test(m) ? hlMark(word,m) : hlWord(word,m,pos); };
  const meet=i=>{
    if(i>=V.length) return check(0);
    setBar(i,total);
    const [w,sound,what,ex]=V[i];
    const body=el(`<div><p class="kicker">The vowel marks · ${i+1} of ${V.length}</p>
      <div class="card"><div class="big" style="font-size:80px;cursor:default">${shown(w,w,'end')}</div>
      <div class="en">"${esc(sound)}"</div><p style="color:var(--ink-soft);margin-top:10px">${esc(what)}</p>
      ${ex?`<p class="kicker ex-k">In a word · tap to hear</p><div class="exs"><button type="button" class="ex" id="x">
        <span class="ex-ar">${shown(w,ex[0],'middle')}</span>
        <span class="ex-tx"><span class="ex-tr">${trHTML(ex[1])}</span><span class="ex-en">${esc(ex[2])}</span></span></button></div>`:''}</div>
      <p class="kicker" style="margin-top:14px;text-align:center">Most books for learners — and this app — show every vowel</p></div>`);
    const x=body.querySelector('#x'); if(x) x.onclick=()=>say(ex[0],x);
    screen(body,[button(i<V.length-1?'Next':'Check yourself',()=>meet(i+1))]);
  };
  const order=shuffle(V).slice(0,5);
  const check=k=>{
    if(k>=order.length) return finish(p, step);
    setBar(V.length+k,total);
    const t=order[k];
    const body=el(`<div><p class="kicker">Which one says "${esc(t[1])}"?</p><div class="opts" id="o"></div></div>`);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(V.filter(x=>x!==t)).slice(0,3).concat([t]).sort(()=>Math.random()-.5).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.style.fontFamily='var(--ar)'; b.style.fontSize='30px'; b.textContent=x[0];
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===t?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(x===t);
        if(x!==t) [...body.querySelectorAll('.opt')].find(o=>o.textContent===t[0]).classList.add('right');
        next.disabled=false; };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet(0);
}

/* Listening test: a word is played (not shown) and the learner picks the letter
   it starts with from letters that sound alike. 12 questions, 9 to pass. Below
   that: each missed letter's card again, listening practice on those letters and
   their look-alikes, then a retake with a fresh set of words. */
const TEST_LEN=12, TEST_PASS=9;
function testItems(){
  const sets=[...new Set(LISTEN_TEST.map(x=>x[2]))];
  const pick=sets.map(s=>shuffle(LISTEN_TEST.filter(x=>x[2]===s))[0]);        // every kind of look-alike at least once
  shuffle(LISTEN_TEST.filter(x=>!pick.includes(x))).slice(0,TEST_LEN-pick.length).forEach(x=>pick.push(x));
  return shuffle(pick);
}
function hearQuestion({it, kicker, at, total, onAnswer, onNext}){
  setBar(at,total);
  const [word,ch,opts,en]=it;
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><button type="button" class="hear-big" id="play" aria-label="Play the word again">🔊</button>
    <div class="tr" style="margin-top:10px">Which letter does this word start with?</div>
    <div id="rev" class="rev hide"></div></div><div class="opts" id="o"></div></div>`);
  const play=body.querySelector('#play'); play.onclick=()=>say(word,play);
  const next=button('Next',onNext); next.disabled=true;
  shuffle([...opts]).forEach(x=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=x;
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=x===ch; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok); gradeLetter(ch,ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===ch).classList.add('right');
      const rev=body.querySelector('#rev');
      rev.innerHTML=`<div class="mid" id="rw">${hlWord(word,ch,'start')}</div><div class="tr">${esc(en)}</div>`;
      rev.classList.remove('hide'); const rw=rev.querySelector('#rw'); rw.onclick=()=>say(word,rw);
      onAnswer(ok,ch); next.disabled=false; };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
  say(word,play);
}
function runHearing(p, step){
  const home=()=>{location.href='dashboard.html'};
  const intro=()=>{
    setBar(0,1);
    const body=el(`<div><p class="kicker">Listening test</p><div class="card">
      <div style="font-size:44px">🎧</div><h2 class="abc-h">Can you hear the difference?</h2>
      <p class="abc-p">You'll hear ${TEST_LEN} words without seeing them. For each one, pick the letter it starts with. The choices sound alike, so listen closely, and play a word as often as you like. ${TEST_PASS} right to pass.</p></div></div>`);
    screen(body,[button('Start the test',test)]);
  };
  const test=()=>{
    const items=testItems(), missed=[]; let k=0, score=0;
    const q=()=>{
      if(k>=items.length) return result();
      hearQuestion({it:items[k], kicker:`Listening test · ${k+1} of ${items.length}`, at:k, total:items.length,
        onAnswer:(ok,ch)=>{ if(ok) score++; else if(!missed.includes(ch)) missed.push(ch); }, onNext:()=>{k++;q();}});
    };
    const result=()=>{
      if(score>=TEST_PASS) return finish(p, step, `<div class="wnote up">🎧 <b>${score} / ${items.length}</b>: you passed the listening test</div>`);
      setBar(1,1);
      const body=el(`<div class="done"><div class="tick">🎧</div><h2>${score} / ${items.length}</h2>
        <p>You need ${TEST_PASS} to pass. Let's practise the letters that tripped you up, then try again.</p>
        <div class="miss-l">${missed.map(ch=>`<span>${ch}</span>`).join('')}</div></div>`);
      screen(body,[button('Practise these letters',()=>practise(missed)), button('Back to home',home,true)]);
    };
    q();
  };
  const practise=letters=>{
    const cards=letters.map(letterOf).filter(Boolean);
    const own=shuffle(LISTEN_TEST.filter(x=>letters.includes(x[1])));
    const alike=shuffle(LISTEN_TEST.filter(x=>!letters.includes(x[1]) && letters.some(ch=>x[2].includes(ch))));
    const drills=own.concat(alike).slice(0,Math.min(8,Math.max(4,letters.length*2)));
    const total=cards.length+drills.length;
    const card=i=>{
      if(i>=cards.length) return drill(0);
      setBar(i,total);
      const c=letterCard(cards[i], `Practise · letter ${i+1} of ${cards.length}`);
      screen(c.body,[button(i<cards.length-1?'Next letter':'Now listen',()=>card(i+1))]);
      c.speak();
    };
    const drill=k=>{
      if(k>=drills.length) return ready();
      hearQuestion({it:drills[k], kicker:`Practise · listen ${k+1} of ${drills.length}`, at:cards.length+k, total,
        onAnswer:()=>{}, onNext:()=>drill(k+1)});
    };
    const ready=()=>{
      setBar(1,1);
      screen(el(`<div class="done"><div class="tick">💪</div><h2>Ready to try again?</h2>
        <p>A fresh set of ${TEST_LEN} words. You need ${TEST_PASS} to pass.</p></div>`),
        [button('Retake the test',test), button('Back to home',home,true)]);
    };
    card(0);
  };
  intro();
}

/* Conversation partner: the other speaker's lines are the unit's own
   conversation, read aloud; the learner answers in their own words and the
   judge says whether the reply fits and how the grammar looks. Nothing is
   generated — if it doesn't fit, a suggested reply from the conversation is
   one tap away. */
/* opts (scenes): {lines, title, done} — a real-life scene instead of the unit's conversation */
function runChat(p, step, opts){
  const lines=opts ? opts.lines : RafiqPath.unitData(p.n).dialogue;
  const situation=opts ? opts.situation : (()=>{ const u=RafiqPath.unitData(p.n); return u.en+': '+((u.convos&&u.convos[0].sub)||''); })();
  const done=opts ? opts.done : ()=>finish(p, step);
  const turns=[]; for(let i=0;i+1<lines.length;i+=2) turns.push([lines[i],lines[i+1]]);
  const judge=window.RafiqJudge&&RafiqJudge.on;
  // The conversation partner is part of Complete (everyone has Complete during the beta).
  if(judge && window.RafiqPlan && !RafiqPlan.isComplete()){
    const c=RafiqPlan.PRICES.complete;
    const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'}</p><div class="card">
      <div style="font-size:40px">💬</div><h3 style="margin:8px 0">Part of Rafiq Complete</h3>
      <p style="color:var(--ink-soft)">Reply to the other speaker in your own words and get feedback on every reply.
      ${c.yearly} a year or ${c.monthly} a month.</p></div></div>`);
    screen(body,[button('See Complete',()=>{location.href='plans.html'}),
      opts ? button('Back to practice',()=>{location.href='practise.html'},true) : button('Skip this step',done,true)]);
    return;
  }
  let t=0;
  const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'} · you reply</p><div class="chat" id="chat"></div>
    <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ رَدَّكَ هُنا" style="min-height:70px"></textarea></div>`);
  const chat=body.querySelector('#chat'), ta=body.querySelector('textarea');
  const add=(cls,ar,en)=>{ const b=el(`<div class="bub ${cls}">${ar?`<div class="a">${esc(ar)}</div>`:''}${en?`<div class="e">${esc(en)}</div>`:''}</div>`);
    chat.appendChild(b); b.scrollIntoView({block:'nearest'}); return b; };
  const send=button(judge?'Send':'Show a suggested reply',()=>reply());
  // the Arabic for this turn's goal, if they want it
  const hint=button('Show the Arabic',()=>{ const s=add('them hintb',turns[t][1][1],''); s.onclick=()=>say(turns[t][1][1],s); },true);
  const earlier=[];   // what the learner has said so far (the partner's later lines may refer to it)
  const useSuggested=()=>button('Use this reply',()=>{ const s=turns[t][1]; add('me',s[1],''); earlier.push(s[1]); t++; turn(); },true);
  const next=button('Continue',()=>{ t++; turn(); });
  function them(){
    const [a]=turns[t]; setBar(t,turns.length);
    const b=add('them',a[1],a[2]); b.onclick=()=>say(a[1],b); say(a[1],b);
    // what to get across — the wording is theirs, so the partner's next line still makes sense
    if(judge) add('note goal','','Your turn — in your own words: “'+turns[t][1][2]+'”');
    ta.value=''; ta.classList.remove('hide');
    screen(body,[send,hint]);
  }
  function turn(){ if(t>=turns.length) return done(); them(); }
  async function reply(){
    const [a,sug]=turns[t], said=ta.value.trim();
    if(!judge){ add('me',sug[1],'Suggested: '+sug[2]); say(sug[1],null); ta.classList.add('hide'); screen(body,[next]); return; }
    if(!said) return;
    add('me',said,'');
    ta.classList.add('hide');
    const wait=add('note','','Checking…');
    const nx=turns[t+1] ? turns[t+1][0] : null;
    const v=await RafiqJudge.reply(a[1],a[2],sug[1],said,situation, nx&&nx[1], nx&&nx[2], earlier);
    wait.remove();
    if(!v){ add('note','','Couldn\'t check just now. One way to reply: '+sug[1]+' — '+sug[2]); screen(body,[next]); return; }
    if(!v.fits){
      window.RafiqSound&&RafiqSound.answer(false);
      const n=add('note no','',"That doesn't quite answer what they said. Try again, or here's one way:");
      const s=add('them',sug[1],sug[2]); s.onclick=()=>say(sug[1],s);
      ta.classList.remove('hide'); ta.value='';
      screen(body,[send,useSuggested()]);
      return;
    }
    if(!v.follows){
      // a sensible reply, but the other speaker's next line was written for something else:
      // don't let the conversation stop making sense — ask for the missing part instead
      add('note','',"Good Arabic! But their next line assumes you said “"+sug[2]+"” — add that and send again, or use this reply:");
      const s=add('them',sug[1],''); s.onclick=()=>say(sug[1],s);
      ta.classList.remove('hide'); ta.value=said;
      screen(body,[send,useSuggested()]);
      return;
    }
    earlier.push(said);
    window.RafiqSound&&RafiqSound.answer(true);
    add('note '+(v.grammar==='slip'?'no':'ok'),'',
      v.grammar==='ok'?'✓ Good reply.' : v.grammar==='slip'?'✓ Good reply — but check this: '+v.why : '✓ That works.');
    screen(body,[next]);
  }
  turn();
}

function runPractise(p){
  location.href='session.html?unit='+p.n+'&n=10';
}

function runSpeak(p, step){
  const u=RafiqPath.unitData(p.n), prompts=(u.prompts||[]).slice(0,2);
  let i=0;
  const judge=window.RafiqJudge&&RafiqJudge.on;
  const DONE=['Not the task yet — read the question again.','Partly there — the task asks for a bit more.','Task done ✓'];
  const show=()=>{
    if(i>=prompts.length) return finish(p, step);
    setBar(i,prompts.length);
    const [tAr,tEn,exAr,exEn]=prompts[i];
    const body=el(`<div><p class="kicker">Say it yourself · ${i+1} of ${prompts.length}</p>
      <div class="card" style="text-align:left"><div style="font-size:18px;font-weight:600">${esc(tEn)}</div>
      <div class="mid" style="text-align:right;font-size:18px;color:var(--rubric)">${esc(tAr)}</div>
      <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ جَوابَكَ هُنا"></textarea>
      <div id="out"></div>
      <div id="ex" class="hide" style="margin-top:14px;border-top:1px dashed var(--rule);padding-top:12px">
        <p class="kicker">One way to answer</p><div class="mid" id="exa" style="text-align:right">${esc(exAr)}</div>
        <div style="color:var(--ink-soft);font-size:14px">${esc(exEn)}</div></div></div>
      <p class="kicker" style="margin-top:14px;text-align:center">Say it aloud first, then type it</p></div>`);
    const ta=body.querySelector('textarea'), out=body.querySelector('#out');
    const exa=body.querySelector('#exa'); exa.onclick=()=>say(exAr,exa);
    const btns=[];
    if(judge) btns.push(button('Check my answer',()=>{
      if(!ta.value.trim()) return;
      out.innerHTML='<div class="verdict">Checking…</div>';
      RafiqJudge.prompt(tEn,exAr,ta.value).then(v=>{
        if(!v){ out.innerHTML='<div class="verdict">Couldn\'t check just now — compare with the example.</div>'; return; }
        if(v.done!==1) window.RafiqSound&&RafiqSound.answer(v.done===2);
        out.innerHTML=`<div class="verdict ${v.done===2?'ok':v.done===0?'no':''}">${DONE[v.done]}</div>`+
          `<div class="verdict ${v.grammarOk?'ok':'no'}">${v.grammarOk?'Grammar: no mistakes spotted ✓':'Grammar: check this — '+esc(v.why)}</div>`;
      });
    }));
    btns.push(button('Show an example',()=>{body.querySelector('#ex').classList.remove('hide');say(exAr,exa)},true));
    btns.push(button(i<prompts.length-1?'Next task':'Finish',()=>{i++;show()},!judge));
    screen(body,btns);
  };
  show();
}

/* After a words step: today's new words, highlighted when it beats your
   usual day or your best. */
function wordsNote(step){
  if(!step || step.kind!=='words') return '';
  const r=RafiqPath.wordsReport(); if(!r.today) return '';
  const msg = r.record ? `🏆 <b>${r.today} new words today</b> — your best day yet (was ${r.best})`
    : r.aboveUsual ? `🌟 <b>${r.today} new words today</b> — more than your usual ${r.usual}`
    : `<b>${r.today}</b> new word${r.today===1?'':'s'} today`;
  return `<div class="wnote${r.record||r.aboveUsual?' up':''}">${msg}</div>`;
}
function finish(p, step, note){
  RafiqPath.complete(p.n, step.key);
  setBar(1,1);
  const n=RafiqPath.next();
  const sameUnit=n.step&&n.unit.n===p.n;
  const s=RafiqPath.streak(), today=RafiqPath.doneToday(), sg=RafiqPath.streakGoal(s);
  // the first step of the day that lands on a streak goal gets a celebration
  const hit = sg.reached && today===1;
  const body=el(`<div class="done"><div class="tick">${hit?'🎉':'✓'}</div><h2>${hit?`${s}-day streak!`:esc(step.title)+' — done'}</h2>
    <p>${hit?esc(sg.reached.why):today>=RafiqPath.GOAL?'Daily goal reached. Anything more is a bonus.':'One more step and today\'s goal is done.'}</p>
    ${note||''}${wordsNote(step)}
    <span class="streak">🔥 ${s}-day streak${sg.next?` · next goal ${sg.next.days} days`:''}</span></div>`);
  if(p.alpha && step.kind==='letters') body.appendChild(alphabetChart('Letters you can read so far', ALPHABET_GROUPS[step.group].letters.map(l=>l[0])));
  if(p.alpha && step.kind==='hearing') body.appendChild(alphabetChart('The whole alphabet', []));
  screen(body,doneButtons(n, sameUnit));
}
/* Every finished step: Complete (home) first, Continue learning (the next step,
   named underneath) second. cont=1 tells the next step it follows straight on. */
function doneButtons(n, sameUnit){
  const btns=[button('Complete',()=>{location.href='dashboard.html'})];
  if(n.step){
    const c=button('',()=>{location.href='learn.html?u='+n.unit.n+'&s='+n.step.key+'&cont=1'},true);
    const where=sameUnit?n.step.title:(n.unit.alpha?'':'Unit '+(+n.unit.n)+': ')+n.step.title;
    c.innerHTML=`Continue learning<small>${esc(where)}</small>`;
    btns.push(c);
  }
  return btns;
}

/* A real-life scene (?scene=id): Complete only, no path step. */
function runScene(sc){
  document.title=sc.en+' — Rafiq';
  runChat(null, null, {lines:sc.lines, title:sc.pic+' '+sc.en, situation:sc.en+' ('+sc.d+')', done:()=>{
    Progress.touch('x:'+sc.id); RafiqPath.markDay(); setBar(1,1);
    const body=el(`<div class="done"><div class="tick">${sc.pic}</div><h2>${esc(sc.en)} — done</h2>
      <p>Try it again another day with different replies — the more ways you can say it, the better.</p>
      <span class="streak">🔥 ${RafiqPath.streak()}-day streak</span></div>`);
    screen(body,[button('More scenes',()=>{location.href='practise.html#scenes'}),button('Back to home',()=>{location.href='dashboard.html'},true)]);
  }});
}

(async function(){
  if(typeof requireLogin==='function') requireLogin();
  await Progress.init();
  const scene=qs.get('scene')&&typeof SCENES!=='undefined'&&SCENES.find(s=>s.id===qs.get('scene'));
  if(scene) return runScene(scene);
  let p=RafiqPath.units().find(x=>x.n===qs.get('u'))||RafiqPath.next().unit;
  // A locked unit or step (someone typed the address, or an old link) sends
  // you to where you actually are on the path.
  if(!RafiqPath.unitOpen(p.n)) p=RafiqPath.next().unit;
  const steps=RafiqPath.steps(p);
  let step=steps.find(s=>s.key===qs.get('s'))||steps.find(s=>!RafiqPath.stepDone(p.n,s.key))||steps[0];
  if(!RafiqPath.stepOpen(p.n,step.key)) step=steps.find(s=>RafiqPath.stepOpen(p.n,s.key)&&!RafiqPath.stepDone(p.n,s.key))||steps[0];
  document.title=step.title+' — Rafiq';
  ({words:runWords,listen:runListen,grammar:runGrammar,practise:runPractise,speak:runSpeak,
    letters:runLetters,vowels:runVowels,hearing:runHearing,chat:runChat})[step.kind](p,step);
})();
</script>
