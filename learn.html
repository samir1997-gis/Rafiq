<style>
.wnote{margin:10px auto 16px;max-width:380px;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--rule);font-size:1rem;line-height:1.5}

body{background:var(--paper)}
/* lessons have no tab bar, so none of the space site.css keeps for it (the page scrolled 68px) */
body{padding-bottom:0!important}
.lx{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:30px 22px;text-align:center}
.pic{font-size:64px;line-height:1.1;margin-bottom:6px}
.pic .wpic{display:block;width:132px;height:132px;margin:0 auto}
.big{font-family:var(--ar);direction:rtl;font-size:clamp(2.5rem,11vw,3.5rem);line-height:1.6;font-weight:600;cursor:pointer;touch-action:manipulation}
.mid{font-family:var(--ar);direction:rtl;font-size:clamp(1.75rem,7.5vw,2.25rem);line-height:1.8;cursor:pointer;touch-action:manipulation}
.tr{font-family:var(--ut);font-size:.875rem;color:var(--ink-soft);margin-top:4px}
.en{font-size:1.25rem;line-height:1.4;margin-top:14px}

.pa.speaking,.follow.speaking{opacity:1}
.who{font-family:var(--ar);color:var(--rubric);font-size:15px;margin-bottom:4px}

.note .gt{font-family:var(--ar);direction:rtl;text-align:center;font-size:14px;color:var(--ink-soft);margin:4px 0 10px}
.note .gtr{color:var(--ink);font-size:1.05rem;margin-top:2px}
/* paired examples (هَذا · هَذِهِ): one per row, English right under its Arabic */
.pairs{margin:6px 0 4px;border-top:1px solid var(--rule)}

.wparts{display:flex;flex-direction:row-reverse;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin:12px 0 4px;padding-top:10px;border-top:1px dashed var(--rule)}

.ar-opts .opt{font-family:var(--ar);font-size:1.4rem}

.salah-ar{line-height:2.1}
.ar{font-family:var(--ar);font-weight:600}
.sw-list{padding:6px 16px;text-align:left}

.pw b{font-family:var(--ar);font-size:clamp(2rem,9vw,2.6rem);line-height:1.6;font-weight:600}
.pw i{font-style:normal;font-size:.95rem;color:var(--ink-soft);direction:ltr;max-width:9em;text-align:center;line-height:1.3}

.stage>.x-screen{margin:0;padding:0;flex:1;display:flex;flex-direction:column}
.x-mid{margin:auto 0;padding:8px 0 3vh}
.x-screen:has(.chat)>.x-mid{margin:0}
.x-bottom{padding-top:10px}
.x-bottom>*{margin-top:0}
.x-bottom .taphint,.x-bottom .x-note{font-size:.85rem}
.howto{margin:16px 0 0;text-align:center;font-size:1.05rem;font-weight:600;color:var(--ink);line-height:1.4}
/* Pray along fills the space above the buttons: heading at the top, credit at the bottom */
.stage>.pa-screen{margin:0;padding:0;flex:1;display:flex;flex-direction:column}
.pa-mid{margin:auto 0;padding:12px 0}
.pa-credit{margin:0;padding-top:10px;font-size:.85rem}
.pa-cue{display:flex;align-items:center;justify-content:center;gap:10px;width:max-content;margin:4px auto 14px;padding:10px 24px;
  border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font-size:1.35rem;line-height:1.2;
  transition:background var(--settle) var(--ease-out),color var(--settle) var(--ease-out),transform var(--settle) var(--ease-out)}
.pa-cue b{font-weight:800;letter-spacing:-.01em}
.pa-cue .ic{font-size:1.25em;line-height:1}
.pa-cue.listen .ic{animation:cue-pulse 1.1s ease-in-out infinite}
.pa-cue.repeat{background:var(--ink);color:var(--paper);transform:scale(1.06)}
.pa-cue.paused,.pa-cue.read,.pa-cue.loading{border-style:dashed}
.pa-cue.loading{opacity:.7}
@keyframes cue-pulse{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.pa-cue.listen .ic{animation:none}.pa-cue.repeat{transform:none}}
.pa-en{font-size:1.2rem;line-height:1.4;text-align:center;margin:20px 8px 0}
.pa-ctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pa-ctl .hear{margin-top:0;flex:1;max-width:9em}
.sw-freq{display:block;font-size:.875rem;color:var(--gold);font-weight:700;margin-top:2px}
.sw-root{display:block;font-size:.875rem;color:var(--ink-soft);margin-top:2px}
.sw-br{font-size:.875rem;color:var(--verdigris);margin-top:3px}
.follow span{border-radius:6px;padding:0 3px;transition:background .15s}
.follow span.on{background:color-mix(in srgb,var(--verdigris) 26%,transparent)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:5px;padding:0 3px}
.taphint{font-size:.95rem;line-height:1.45;color:var(--ink-soft);text-align:center;margin:12px 0 0}
.endings{margin-top:14px;text-align:left;font-size:.95rem;line-height:1.55;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:10px}
.endings summary{color:var(--verdigris);cursor:pointer;font-weight:700;padding:6px 0;list-style:none}
.endings summary::-webkit-details-marker{display:none}
.endings summary::before{content:'ⓘ ';font-weight:400}
.endings p{margin:6px 0}
.endings ul{margin:4px 0 6px;padding-left:18px}
.endings li{margin:3px 0}

.note p{color:var(--ink-soft);font-size:1.05rem;line-height:1.55;text-align:left;margin-top:12px}
.foot{padding-top:20px;display:flex;flex-direction:column;gap:10px}
.go{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--verdigris);color:#fff;font-size:1.0625rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.go:disabled{opacity:.45}
.go.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.go:active{transform:scale(.98)}
.go small{display:block;font-size:.85rem;font-weight:400;color:var(--ink-soft);margin-top:2px}
/* Reading starter */
.hl{color:var(--rubric)} b.hl{font-weight:700}
.forms{display:flex;justify-content:center;gap:14px;margin-top:14px;direction:rtl}
.ex-k{margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--rule);text-align:center}
.exs{display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:12px;direction:rtl;width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:12px;
  padding:4px 14px;color:var(--ink);cursor:pointer;touch-action:manipulation;transition:transform var(--press) var(--ease-out)}
.ex:active{transform:scale(.98)}
.ex-ar{font-family:var(--ar);font-size:26px;line-height:1.9;flex:0 0 auto}
.ex-tx{direction:ltr;text-align:left;flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.ex-tr{font-family:var(--ut);font-size:.875rem;color:var(--ink-soft)}
.ex-en{font-size:1rem}
.ex-pos{font-family:var(--ut);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);flex:0 0 auto}
.mk{position:relative;display:inline-block;white-space:nowrap}
.mk-r{color:var(--rubric)}
.mk-i{position:absolute;inset:0;color:var(--ink);pointer-events:none}
.abc{margin:20px auto 0;max-width:420px}
.abc .kicker{text-align:center}
.abc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;direction:rtl}
.abc-l{font-family:var(--ar);font-size:1.75rem;line-height:1;height:54px;padding:0 0 4px;border-radius:10px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-soft);opacity:.5;cursor:pointer;touch-action:manipulation;transition:transform var(--press) var(--ease-out)}
.abc-l:active{transform:scale(.92)}
.abc.intro .abc-l{opacity:1;color:var(--ink);background:var(--paper)}
.abc-l.st-met{opacity:1;color:var(--ink);background:var(--card);border-color:var(--ink-soft)}
.abc-l.st-known{opacity:1;color:#fff;background:var(--verdigris);border-color:var(--verdigris)}
.abc-l.st-gold{opacity:1;color:var(--ink);background:color-mix(in srgb,var(--gold) 45%,var(--card));border-color:var(--gold)}
/* letters that just changed settle in one after another (off with reduced motion, via site.css) */
.abc-l.in{animation:abc-in 380ms var(--ease-out) both}
@keyframes abc-in{from{opacity:.5;transform:scale(.84);background:var(--card);color:var(--ink-soft);border-color:var(--rule)}}
.abc-tip{font-size:.9rem;color:var(--ink-soft);text-align:center;margin-top:8px}
/* the alphabet board's key (#276) */
.abc-key{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--ink-soft);margin:10px 0 0}
.abc-key span{display:inline-flex;align-items:center;gap:5px}
.abc-key i{width:12px;height:12px;border-radius:3px;border:1px solid var(--ink-soft);display:inline-block}
.abc-key i.k-known{background:var(--verdigris);border-color:var(--verdigris)}
.abc-key i.k-gold{background:color-mix(in srgb,var(--gold) 45%,var(--card));border-color:var(--gold)}
/* Play (#276): the stars at the end */
.stars{font-size:40px;letter-spacing:6px;color:var(--gold);margin:10px 0 0;line-height:1.2}
.stars .off{color:var(--rule)}
/* Sounding out (#276): a word in pieces, each tapped to see how it's said */
.sx{display:flex;justify-content:center;gap:10px;direction:rtl;margin:16px 0 4px;flex-wrap:wrap}
.sx button{font-family:var(--ar);font-size:30px;line-height:1.6;min-width:64px;padding:2px 10px 6px;border-radius:12px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink);cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center}
.sx button.on{border-color:var(--verdigris)}
.sx button i{font-style:normal;font-family:var(--ut);font-size:.9rem;color:var(--verdigris);min-height:1.3em;direction:ltr;line-height:1.3}
/* Read your first line (#276): tap a word to see how it's read; lit while it's recited */
.fl{display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;gap:8px 10px;margin:4px 0 8px}
.fl button{display:flex;flex-direction:column;align-items:center;border:0;background:transparent;border-radius:12px;padding:4px 8px;
  cursor:pointer;color:var(--ink);touch-action:manipulation;transition:background .2s}
.fl button b{font-family:var(--ar);font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.6;font-weight:600}
.fl button i{font-style:normal;font-size:.85rem;color:var(--ink-soft);direction:ltr;line-height:1.25;max-width:8em;text-align:center}
.fl button.on{background:color-mix(in srgb,var(--verdigris) 22%,transparent)}
/* Put it together (#277): record yourself saying your sentence */
.rec{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.rec .hear{margin-top:8px}
.abc-h{font-size:22px;margin:4px 0 8px}
.abc-p{color:var(--ink-soft);font-size:1.05rem;line-height:1.55;margin:0}
.hear-big{font-size:40px;width:96px;height:96px;border-radius:50%;border:1px solid var(--verdigris);background:var(--paper);cursor:pointer;
  touch-action:manipulation;transition:transform var(--press) var(--ease-out)}
.hear-big:active{transform:scale(.94)}
.rev{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}
.miss-l{display:flex;justify-content:center;gap:10px;margin-top:16px;direction:rtl}
.miss-l span{font-family:var(--ar);font-size:30px;line-height:1.6;width:58px;border-radius:12px;background:var(--card);border:1px solid var(--rubric);color:var(--rubric)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{min-height:56px;border:1px solid var(--rule);border-radius:14px;background:var(--card);font-size:1.0625rem;color:var(--ink);cursor:pointer;padding:8px 12px}
.opt.right{background:var(--verdigris);border-color:var(--verdigris);color:#fff}
.opt.wrong{background:var(--rubric);border-color:var(--rubric);color:#fff}
/* units 1 and 2 (#358): guess first, picture choices, Match-up, Beat the clock */
.guess{display:block;width:100%;margin-top:14px;min-height:52px;border:1px dashed var(--verdigris);border-radius:14px;background:color-mix(in srgb,var(--verdigris) 8%,var(--card));color:var(--ink);font-size:1rem;line-height:1.35;cursor:pointer;padding:8px 12px;touch-action:manipulation}
.guess b{display:block;color:var(--verdigris)}
.pic.sm{margin-bottom:2px}.pic.sm .wpic{width:92px;height:92px}
.pic-opts{grid-template-columns:1fr 1fr}
.pic-opts .opt{padding:8px;display:grid;place-items:center}
.pic-opts .wpic{display:block;width:min(30vw,116px);height:min(30vw,116px)}
.after{margin-top:12px}.after .big{font-size:clamp(1.8rem,8vw,2.4rem);cursor:default}.after .en{margin-top:2px;font-size:1.05rem}
.mt-clock,.sp-hud{font-family:var(--ut);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.mt-clock{text-align:center;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{min-height:60px;border:1px solid var(--rule);border-radius:14px;background:var(--card);color:var(--ink);font-size:1rem;line-height:1.25;padding:8px 10px;cursor:pointer;touch-action:manipulation;transition:transform .15s ease-out,opacity .2s ease-out}
.mt[lang=ar]{font-family:var(--ar);font-size:1.3rem;line-height:1.5}
.mt.on{border-color:var(--verdigris);background:color-mix(in srgb,var(--verdigris) 12%,var(--card));box-shadow:inset 0 0 0 2px var(--verdigris),0 6px 16px rgba(23,38,43,.12);transform:scale(1.04);transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease-out}
.mt.right{background:color-mix(in srgb,var(--verdigris) 14%,var(--card));border-color:color-mix(in srgb,var(--verdigris) 45%,transparent);color:var(--verdigris);cursor:default;animation:mt-yes .42s cubic-bezier(.34,1.56,.64,1)}
.mt.wrong{background:var(--rubric);border-color:var(--rubric);color:#fff;animation:mt-no .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes mt-no{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
@keyframes mt-yes{0%{transform:scale(1.06)}100%{transform:scale(1)}}
/* press feedback the moment a finger lands (#366, apple-design: respond on press, not on release) */
.opt,.mt,.guess{transition:transform .1s ease-out,background-color .2s ease-out,border-color .2s ease-out}
.opt:active:not(:disabled),.mt:active:not(:disabled),.guess:active{transform:scale(.97)}
/* tiles inside a lesson: the app's rounded buttons, and a clear verdict */
body .tl-bar .btn{border-radius:14px;min-height:48px}
body .tl-verdict{font-size:1rem;font-weight:600;margin-top:12px}
body .tl-verdict.ok{display:inline-block;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--verdigris) 14%,var(--card));animation:mt-yes .42s cubic-bezier(.34,1.56,.64,1)}
.sp-hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sp-hud .pen{color:var(--rubric)}
.sp-bar{flex:1;height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;border-radius:5px;background:var(--verdigris);transition:width .2s linear}
.sp-bar i.low{background:var(--rubric)}

<script>
DATA.forEach(u=>Object.assign(u,(typeof EXTRA!=='undefined'&&EXTRA[u.n])||{}));
const qs=new URLSearchParams(location.search);
const stage=document.getElementById('stage'), bar=document.getElementById('bar');
const say=(t,el,after)=>{ if(window.RQ) RQ.speak(t.replace(/=/g,' '),el,after); else if(after) after(); };
/* The Pray along cue on any exercise that plays something first: 🔊 Listen while it plays,
   then whose turn it is ("Now say it", "Now pick the word") once it has finished.
   Goes above the exercise's card; returns play(), for the "again" buttons too. */
const TURNS={say:['🗣','Now say it'], repeat:['🗣','Now repeat'], pick:['👆','Now pick'], type:['⌨️','Now type it']};
function listenThen(body, speak, turn, label){
  const c=el(`<div class="pa-cue listen" aria-live="polite"><span class="ic">🔊</span><b>Listen</b></div>`);
  const at=body.querySelector('.card'); (at?at.parentNode:body).insertBefore(c, at||body.firstChild);
  const set=(cls,ic,txt)=>{ c.className='pa-cue '+cls; c.firstChild.textContent=ic; c.lastChild.textContent=txt; };
  const [ic,txt]=TURNS[turn]||TURNS.say;
  return ()=>{ set('listen','🔊','Listen'); speak(()=>{ if(c.isConnected) set('repeat',ic,label||txt); }); };
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setBar(i,n){ bar.style.width=Math.round(100*i/Math.max(1,n))+'%'; }
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
/* Every exercise screen is laid out like Pray along: the heading(s) pinned to the top, the
   exercise itself in the middle, notes and credits (.credit, .x-note) at the bottom. */
function zones(body){
  if(!body || body.nodeType!==1 || body.matches('.pa-screen,.done,.x-screen')) return;
  const top=document.createElement('div'); top.className='x-top';
  while(body.firstElementChild && body.firstElementChild.matches('p.kicker')) top.appendChild(body.firstElementChild);
  const bottom=document.createElement('div'); bottom.className='x-bottom';
  [...body.querySelectorAll(':scope > .credit, :scope > .x-note')].forEach(n=>bottom.appendChild(n));
  const mid=document.createElement('div'); mid.className='x-mid';
  while(body.firstChild) mid.appendChild(body.firstChild);
  body.classList.add('x-screen');
  if(top.childElementCount) body.appendChild(top);
  body.appendChild(mid);
  if(bottom.childElementCount) body.appendChild(bottom);
}
function screen(body, buttons){
  stage.innerHTML='';
  zones(body);
  stage.appendChild(body);
  const f=document.createElement('div'); f.className='foot';
  buttons.forEach(b=>f.appendChild(b)); stage.appendChild(f);
  window.scrollTo(0,0);
}
/* A right answer on a simple pick moves on by itself once the word has been said
   (chosen with TypeSafe: tools/typesafe-exp/auto_advance.py). A wrong answer
   waits for Next, so the right one can be looked at. Next stays, to go sooner.
   Nothing moves while the report sheet is open or the app is in the background,
   and a screen that has already moved on is left alone. */
function autoNext(next, text, el){
  let gone=false;
  const go=()=>{
    if(gone || !next.isConnected) return;
    if(document.querySelector('.rp-sheet') || document.hidden) return setTimeout(go, 700);
    gone=true; next.click();
  };
  if(text && window.RQ) RQ.speak(text.replace(/=/g,' '), el, ()=>setTimeout(go, 500));
  else setTimeout(go, 900);
  setTimeout(go, 6000);                  // in case the audio never reports that it ended
}
function button(label, fn, ghost){ const b=document.createElement('button'); b.className='go'+(ghost?' ghost':''); b.type='button'; b.textContent=label; b.onclick=fn; return b; }

/* ── steps ─────────────────────────────────────────────── */
/* A phrase taken apart, word by word (teach.js), under its meaning. */
function partsHTML(ar){
  const ps=window.RafiqTeach && RafiqTeach.parts(ar);
  return ps ? `<div class="wparts" aria-label="Word by word">${ps.map(([a,e])=>`<span><b lang="ar">${esc(a)}</b><i>${esc(e)}</i></span>`).join('')}</div>` : '';
}
function runWords(p, step){
  const words=RafiqPath.wordsOf(p, step.batch);
  // teach first (#156): after the meaning check, hear a few and pick the word
  const HEAR=RafiqPath.teaches(p.n) ? Math.min(5, words.length) : 0, heard=shuffle(words).slice(0,HEAR);
  const total=words.length*2+HEAR;       // meet each word, then a short check
  let i=0;
  const meet=()=>{
    if(i>=words.length) return check(0);
    const w=words[i]; setBar(i,total);
    const pic=PICS.has(w.id)?`<div class="pic" aria-hidden="true">${wordPic(w.id)}</div>`:PIC[w.id]?`<div class="pic" aria-hidden="true">${PIC[w.id]}</div>`:'';   // the drawing (#332), else the emoji
    const body=el(`<div><p class="kicker">New word ${i+1} of ${words.length}</p>
      <div class="card">${pic}<div class="big" id="w">${esc(w.ar)}</div>
      <div class="tr">${esc(w.tr||'')}</div><div class="en">${esc(w.en)}</div>${partsHTML(w.ar)}
      <button class="hear" type="button" id="h">🔊 Hear it again</button></div>
      <p class="howto">Say it aloud once, then carry on</p></div>`);
    screen(body,[button(i<words.length-1?'Next word':'Check yourself',()=>{i++;meet()})]);
    const a=body.querySelector('#w'), play=listenThen(body, done=>say(w.ar,a,done), 'say');
    a.onclick=play; body.querySelector('#h').onclick=play; play();
  };
  // Light check straight after meeting: pick the meaning. Learning, not a test —
  // a miss just shows the answer and moves on.
  const order=shuffle(words);
  const check=k=>{
    if(k>=order.length) return hear(0);
    setBar(words.length+k,total);
    ask(k);
  };
  // hear it, then pick the word you heard, so sound and spelling go together
  const hear=k=>{
    if(k>=HEAR) return done();
    setBar(words.length*2+k,total);
    const w=heard[k];
    // no two choices with the same letters (ما اسْمُكَ / ما اسْمُكِ differ only in a vowel you can barely hear)
    const skel=t=>t.replace(/[\u064B-\u0652\u0670\u0640؟?.]/g,'').trim(), used=new Set([skel(w.ar)]);
    const pool=shuffle(words).filter(x=>!used.has(skel(x.ar)) && used.add(skel(x.ar))).slice(0,3).concat([w]);
    const body=el(`<div><p class="kicker">Hear it, pick the word</p>
      <div class="card"><button class="hear big-hear" type="button" id="h" aria-label="Hear it again">🔊</button></div><div class="opts ar-opts" id="o"></div></div>`);
    const h=body.querySelector('#h'), play=()=>say(w.ar,h); h.onclick=play;
    const next=button('Next',()=>hear(k+1)); next.disabled=true;
    shuffle(pool).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button'; b.lang='ar'; b.dir='rtl'; b.textContent=x.ar;
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===w?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(x===w);
        if(x!==w) [...body.querySelectorAll('.opt')].find(o=>o.textContent===w.ar).classList.add('right');
        next.disabled=false; if(x===w) autoNext(next, w.ar, h); };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]); play();
  };
  const done=()=>wordsDone(p, step, words);
  const ask=k=>{
    const w=order[k];
    const pool=shuffle(words.filter(x=>x!==w && !tooClose(x.en,w.en))).slice(0,3).concat([w]);
    const body=el(`<div><p class="kicker">What does this mean?</p>
      <div class="card"><div class="big" id="w">${esc(w.ar)}</div></div><div class="opts" id="o"></div></div>`);
    const a=body.querySelector('#w'); a.onclick=()=>say(w.ar,a);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(pool).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=gloss(x.en);
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===w?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(x===w);
        if(x!==w) [...body.querySelectorAll('.opt')].find(o=>o.textContent===gloss(w.en)).classList.add('right');
        next.disabled=false;
        if(x===w) autoNext(next, w.ar, a); else say(w.ar,a); };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet();
}
function wordsDone(p, step, words, note){
  // into daily review; the first time through, every word counts as met today
  const first=!RafiqPath.stepDone(p.n, step.key);
  // a new word comes back tomorrow, then FSRS spaces it out (7, 32, 118 days; #158)
  words.forEach(w=>{ if(Progress.isNew('v:'+w.id)) Progress.grade('v:'+w.id,'good',1); if(first) RafiqPath.wordMet(); });
  const br=salahBridge(words);
  return br ? showBridge(br, ()=>finish(p, step, note)) : finish(p, step, note);
}

/* ── units 1 and 2: lessons on tested methods, with games (#358) ──────────────
   Only these two units for now, so they can be compared with the rest.
   Meet: guess the meaning before it's shown (errorful generation: Potts & Shanks 2014) and say the word
   aloud (the production effect: MacLeod et al. 2010). Then every word is recalled four times, with a growing
   gap between its questions rather than all at the end (retrieval practice: Karpicke & Roediger 2008), each
   time a little harder: pick the meaning, hear it and tap its picture, the Match-up game, say it in Arabic.
   Anything missed comes back until it's right (practice to criterion: Rawson & Dunlosky). Nothing is scored
   into the review schedule during the lesson; the words go into review at the end, as before. */
const PLUS=new Set(['01','02']);
const isPhrase=w=>!w.ar.includes('/') && w.ar.trim().split(/\s+/).length>1;
function runWordsPlus(p, step){
  const words=RafiqPath.wordsOf(p, step.batch), n=words.length;
  // choices come from this lesson and the unit's earlier ones, so the earlier words keep turning up
  const pool=[...Array(step.batch+1).keys()].flatMap(j=>RafiqPath.wordsOf(p, j));
  const plan=[];
  words.forEach((w,i)=>{ plan.push({meet:w}); if(i>=1) plan.push({w:words[i-1], r:0}); if(i>=3) plan.push({w:words[i-3], r:1}); });
  const rest=words.slice(Math.max(0,n-3), n-1).map(w=>({w, r:1}));
  rest.splice(1, 0, {w:words[n-1], r:0}); rest.push({w:words[n-1], r:1});
  plan.push(...rest, {match:true}, ...shuffle(words).map(w=>({w, r:2})));
  const again=[];                         // missed: asked once more at the end, until right
  let k=0, missed=0, match=null;
  const miss=(w, r)=>{ missed++; if(!again.slice(Math.max(0, k+1-plan.length)).some(x=>x.w===w)) again.push({w, r, redo:true}); };
  const go=()=>{
    const it=k<plan.length ? plan[k] : again[k-plan.length];
    if(!it) return wordsDone(p, step, words, note());
    setBar(k, plan.length+again.length);
    const next=()=>{ k++; go(); };
    if(it.meet) return meet(it.meet, next);
    if(it.match) return matchGame(words, 'Match up · '+n+' pairs', id=>miss(words.find(w=>w.id===id), 0), r=>{ match=r; next(); });
    const t=['mean','pic','say'][it.r], onAnswer=ok=>{ if(!ok) miss(it.w, it.r); };
    if(t==='say' && isPhrase(it.w)) return buildOne(it.w, pool, it.redo?'One more try':'Build it in Arabic', false, onAnswer, next);
    const x=question({t, id:it.w.id}, pool); x.free=true;
    askOne(x, it.redo ? 'One more try · '+x.kicker : null, onAnswer, next);
  };
  const meet=(w, next)=>{
    const i=words.indexOf(w);
    const pic=PICS.has(w.id)?`<div class="pic" aria-hidden="true">${wordPic(w.id)}</div>`:PIC[w.id]?`<div class="pic" aria-hidden="true">${PIC[w.id]}</div>`:'';
    const body=el(`<div><p class="kicker">New word ${i+1} of ${n}</p>
      <div class="card">${pic}<div class="big" id="w">${esc(w.ar)}</div>
      <div class="tr">${esc(w.tr||'')}</div>
      <button class="guess" type="button" id="g">What do you think it means?<b>Tap to see</b></button>
      <div id="m" hidden><div class="en">${esc(w.en)}</div>${partsHTML(w.ar)}</div>
      <button class="hear" type="button" id="h">🔊 Hear it again</button></div>
      <p class="howto">Say it aloud once, then carry on</p></div>`);
    const nb=button('Next', next); nb.disabled=true;
    screen(body,[nb]);
    body.querySelector('#g').onclick=e=>{ e.currentTarget.remove(); body.querySelector('#m').hidden=false; nb.disabled=false; };
    const a=body.querySelector('#w'), play=listenThen(body, done=>say(w.ar,a,done), 'say');
    a.onclick=play; body.querySelector('#h').onclick=play; play();
  };
  const note=()=>`<div class="wnote">🧠 You recalled each word 4 times, in 4 different ways. Recalling a word, not rereading it, is what makes it stick.</div>`
    + (match ? `<p>Match-up in <b>${mmss(match.secs)}</b>${match.record?' · your best yet 🏆':''}${missed?` · ${missed} missed, and back until you had ${missed===1?'it':'them'}`:''}</p>` : '');
  go();
}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
/* Match-up: the lesson's words in one column, their meanings in the other; tap one of each. An Arabic tile
   says its word. Timed, with the best time kept on this device; a wrong pair shakes and is told to onMiss. */
function matchGame(words, head, onMiss, onDone){
  const t0=Date.now(), sel={a:null, e:null};
  let left=words.length, misses=0, res=null;
  const body=el(`<div><p class="kicker">${esc(head)}</p><div class="mt-clock" id="c">⏱ 0:00</div>
    <div class="match" id="g"></div><p class="howto" id="v">Tap a word, then its meaning</p></div>`);
  const next=button('Next',()=>onDone(res)); next.disabled=true;
  const secs=()=>Math.round((Date.now()-t0)/1000), clock=body.querySelector('#c');
  const timer=setInterval(()=>{ if(!body.isConnected || res) return clearInterval(timer); clock.textContent='⏱ '+mmss(secs()); }, 500);
  const end=()=>{
    const s=secs(); let best=0;
    const key='rafiq_match_best'+(words.length===5?'':words.length);         // a best time for each size of game (#361)
    try{ best=+localStorage.getItem(key)||0; if(!best || s<best) localStorage.setItem(key, s); }catch(_){}
    res={secs:s, misses, record:best>0 && s<best};
    clock.textContent='⏱ '+mmss(s);
    body.querySelector('#v').innerHTML=`All matched in <b>${mmss(s)}</b>`+(res.record?' · your best yet 🏆':best?` · your best: ${mmss(best)}`:'');
    next.disabled=false;
  };
  const tap=(b, side)=>{
    if(b.disabled) return;
    if(sel[side]) sel[side].classList.remove('on');
    sel[side]=sel[side]===b ? null : b;
    if(sel[side]){ b.classList.add('on'); if(side==='a') say(b.textContent, null); }
    const A=sel.a, E=sel.e; if(!A || !E) return;
    sel.a=sel.e=null; [A,E].forEach(x=>x.classList.remove('on'));
    const ok=A.dataset.id===E.dataset.id; window.RafiqSound&&RafiqSound.answer(ok);
    if(ok){ [A,E].forEach(x=>{ x.classList.add('right'); x.disabled=true; }); if(--left===0) end(); }
    else{ misses++; onMiss(+A.dataset.id); [A,E].forEach(x=>x.classList.add('wrong')); setTimeout(()=>[A,E].forEach(x=>x.classList.remove('wrong')), 500); }
  };
  const tile=(w, side)=>{ const b=document.createElement('button'); b.type='button'; b.className='mt'; b.dataset.id=w.id; b.dataset.side=side;
    if(side==='a'){ b.lang='ar'; b.dir='rtl'; b.textContent=w.ar; } else b.textContent=gloss(w.en);
    b.onclick=()=>tap(b, side); return b; };
  // one grid, a meaning and a word to a row, so a row's two tiles are the same height
  const en=shuffle(words), ar=shuffle(words), grid=body.querySelector('#g');
  en.forEach((w,i)=>grid.append(tile(w,'e'), tile(ar[i],'a')));
  screen(body,[next]);
}

function runListen(p, step){
  const u=RafiqPath.unitData(p.n), lines=u.dialogue, c=u.convos&&u.convos[0];
  let i=0, showEn=true;
  const show=()=>{
    if(i>=lines.length) return finish(p, step);
    setBar(i,lines.length);
    const l=lines[i];
    const body=el(`<div><p class="kicker">${esc(c?c.sub:'Conversation')} · line ${i+1} of ${lines.length}</p>
      <div class="card"><div class="who">${esc(l[0])}</div><div class="mid" id="a">${esc(l[1])}</div>
      <div class="en${showEn?'':' hide'}" id="e">${esc(l[2])}</div>
      <button class="hear" type="button" id="h">🔊 Again</button></div>
      <p class="howto">Listen, then say it after the voice</p></div>`);
    const a=body.querySelector('#a'), play=listenThen(body, done=>say(l[1],a,done), 'say');
    a.onclick=play; body.querySelector('#h').onclick=play;
    const tog=button(showEn?'Hide English':'Show English',()=>{showEn=!showEn;body.querySelector('#e').classList.toggle('hide',!showEn);tog.textContent=showEn?'Hide English':'Show English'},true);
    screen(body,[button(i<lines.length-1?'Next line':'Finish',()=>{i++;show()}),tog]);
    play();
  };
  show();
}

/* Word endings, explained once in plain English wherever a note mentions them. */
const ENDINGS_RE=/(^|[\s(‘'])-(u|a|i|un|an|in)\b|extra -n/;
const ENDINGS_HTML=`<details class="endings"><summary>What are these endings (-u, -a, -i)?</summary>
  <p>Arabic words change their last vowel to show their job in the sentence:</p>
  <ul><li><b>-u</b> (ـُ): the usual ending</li><li><b>-a</b> (ـَ): for the thing receiving an action, and after some words</li>
  <li><b>-i</b> (ـِ): after little words like فِي ‘in’ and بِـ ‘with’</li></ul>
  <p>Without ال, add an <b>n</b> sound: <b>-un</b> (ـٌ), <b>-an</b> (ـً), <b>-in</b> (ـٍ). You’ll pick these up as you go, and people often leave them off when speaking.</p></details>`;
/* The short meaning shown on an answer button: the part before the first '/'
   that isn't inside brackets, without wrapping brackets. */
/* An example like 'هَذا طالِبٌ · هَذِهِ طالِبَةٌ' with 'This is… (m) · This is… (f)': Arabic runs right to
   left, so on one line the pairs sit opposite their English. Split into [arabic, english] rows. */
function pairsOf(g){
  if(!g.tr) return null;
  const a=g.ar.split(' · '), e=g.tr.split(' · ');
  return a.length>1 && a.length===e.length ? a.map((x,i)=>[x.replace(/[.،]\s*$/,'').trim(), e[i].replace(/\.\s*$/,'').trim()]) : null;
}
function gloss(en){
  let d=0, s=String(en||'');
  for(let i=0;i<s.length;i++){ const c=s[i]; if(c==='(') d++; else if(c===')') d--; else if(c==='/' && d<=0){ s=s.slice(0,i); break; } }
  s=s.trim(); if(/^\(.*\)$/.test(s)) s=s.slice(1,-1).trim();
  return s;
}
/* Two meanings too close to both be offered (the same, or one inside the other: 'yes' / 'yes, of course'). */
const tooClose=(a,b)=>{ a=gloss(a).toLowerCase(); b=gloss(b).toLowerCase(); return a===b || (' '+a+' ').includes(' '+b+' ') || (' '+b+' ').includes(' '+a+' '); };
/* A card's quick check (#163): right after the card, one pick (check: [question, options, right one, why]),
   so a new idea is used straight away. A miss shows the right one and why; nothing is scored. */
// English with Arabic inside: each Arabic run kept together, in its own direction
const withAr=t=>esc(t).replace(/[\u0600-\u06FF][\u0600-\u06FF\s]*/g, m=>{ const w=m.trimEnd(); return `<bdi lang="ar" dir="rtl">${w}</bdi>`+m.slice(w.length); });
/* guess (#361): asked before the card that teaches it, so the word is heard only once it's answered and a miss
   makes no sound. onAnswer(ok), for a caller that brings a missed one back. */
function quickCheck(g, kicker, then, guess, onAnswer){
  const [q, opts, a, why, word, sayAs]=g.check, right=opts[a];   // word: Arabic to hear with the question (said from sayAs if given)
  const ar=/[\u0600-\u06FF]/.test(opts.join(''));
  const body=el(`<div><p class="kicker">${esc(kicker)}</p><div class="card">${word?`<div class="big" id="qw"${guess?' style="cursor:default"':''}>${esc(word)}</div>`:''}<div class="en" style="margin-top:${word?14:0}px">${withAr(q)}</div></div>
    <div class="opts${ar?' ar-opts':''}" id="o"></div><p class="why hide" id="w">${withAr(why||'')}</p>${guess?'<p class="taphint" id="gh">Not sure? Just guess. Getting it wrong is fine: the rule comes next.</p>':''}</div>`);
  const next=button('Next',then); next.disabled=true;
  const qw=body.querySelector('#qw'), hear=()=>say(sayAs||word,qw);
  shuffle(opts).forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=o; if(ar){ b.lang='ar'; b.dir='rtl'; }
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=o===right; b.classList.add(ok?'right':'wrong'); if(ok || !guess) window.RafiqSound&&RafiqSound.answer(ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(e=>e.textContent===right).classList.add('right');
      if(why) body.querySelector('#w').classList.remove('hide');
      next.disabled=false; if(onAnswer) onAnswer(ok);
      const r=[...body.querySelectorAll('.opt')].find(e=>e.textContent===right);
      if(guess){ body.querySelector('#gh').remove(); if(qw){ qw.style.cursor=''; qw.onclick=hear; hear(); } }
      else if(ok && !why) autoNext(next, ar?right:null, r); else if(ar) say(right, r); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
  if(qw && !guess){ qw.onclick=hear; hear(); }
}
function runGrammar(p, step){
  // part 2 (#163): the cards marked part 2 get their own step, after the later words
  const notes=(RafiqPath.unitData(p.n).grammar||[]).filter(g=>(g.part||1)===(step.part||1));
  let i=0;
  const show=()=>{
    if(i>=notes.length) return finish(p, step);
    setBar(i,notes.length);
    const g=notes[i];
    const body=el(`<div><p class="kicker">How it works · ${i+1} of ${notes.length}</p>
      <div class="card note">${g.h ? `<h3 class="gh">${withAr(g.h)}</h3><p class="gt">${esc(g.t)}</p>` : `<h3>${esc(g.t)}</h3>`}
        ${pairsOf(g) ? `<div class="pairs">${pairsOf(g).map(([ar,en])=>`<div class="pair" data-say="${esc(ar)}"><div class="mid">${esc(ar)}</div><div class="gtr">${esc(en)}</div></div>`).join('')}</div>`
          : `<div class="mid" id="a">${esc(g.ar.replace(/=/g,' '))}</div>${g.tr ? `<div class="gtr">${esc(g.tr)}</div>` : ''}`}
        <p class="taphint">🔊 Tap ${pairsOf(g) ? 'an example' : 'the Arabic'} to hear it again</p>
        <p>${withAr(g.en)}</p>${ENDINGS_RE.test(g.en) ? ENDINGS_HTML : ''}
        ${g.bad ? `<div class="gbad" role="note" aria-label="A common mistake, crossed out"><span class="gx" aria-hidden="true">✗</span><div><s lang="ar" dir="rtl">${esc(g.bad[0])}</s><p>${withAr(g.bad[1])}</p></div></div>` : ''}</div></div>`);
    const a=body.querySelector('#a'); if(a) a.onclick=()=>say(g.ar,a);
    const rows=[...body.querySelectorAll('.pair')];
    rows.forEach(r=>r.onclick=()=>say(r.dataset.say,r.querySelector('.mid')));
    const on=()=>{i++;show()};
    screen(body,[button(g.check?'Check yourself':i<notes.length-1?'Next':'Finish',()=>g.check?quickCheck(g,'Quick check',on):on())]);
    // play the example straight away; paired examples one row after another
    const playRow=k=>{ if(k>=rows.length || !rows[k].isConnected || !window.RQ) return;
      RQ.speak(rows[k].dataset.say, rows[k].querySelector('.mid'), ()=>setTimeout(()=>playRow(k+1), 350)); };
    if(rows.length) playRow(0); else if(a) say(g.ar,a);
  };
  show();
}

/* ── Reading starter ─────────────────────────────────────
   Meet each letter (shape, name, sound, joined forms, three words with it in
   red), then pick letters by sound. Before a new group, unless the learner came
   straight from the last one, a short warm-up on earlier letters. The unit ends
   with a listening test. Every answer about a letter is kept as 'l:<letter>'
   (box 1 = missed last time) so warm-ups and practice can aim at it. */
const ZWJ='\u200d';
const AR_LETTER=/[ء-ي]/, AR_MARK=/[ً-ْٰ]/;
const NO_JOIN=/[اأإآدذرزوؤةء]/;                 // never join to the letter after them
const POS=['start','middle','end'];
const ALL_LETTERS=ALPHABET_GROUPS.flatMap((g,gi)=>g.letters.map(l=>({ch:l[0], name:l[1], group:gi, l})));
const letterOf=ch=>(ALL_LETTERS.find(x=>x.ch===ch)||{}).l;
function forms(l, joins){
  return joins ? [l, l+ZWJ, ZWJ+l+ZWJ, ZWJ+l] : [l, ZWJ+l];
}
const gradeLetter=(ch,ok)=>RafiqPath.letterAnswer(ch,ok);
const weakLetter=ch=>{ const r=Progress.get('l:'+ch); return !!(r && r.box===1); };
const lastSeen=ch=>{ const r=Progress.get('l:'+ch); return (r && r.at) || ''; };
const trHTML=t=>esc(t).replace(/\[(.+?)\]/g,'<b class="hl">$1</b>');

/* A word with one letter in red. Zero-width joiners either side of the colour
   change keep the letters joined in browsers that shape each span separately. */
function hlWord(word, ch, pos){
  const c=[...word], base=[]; c.forEach((x,i)=>{ if(AR_LETTER.test(x)) base.push(i); });
  const is=i=>ch==='ا' ? /[اأإآ]/.test(c[i]) : c[i]===ch;
  const hits=base.filter(is); if(!hits.length) return esc(word);
  const first=base[0], last=base[base.length-1];
  const at = pos==='start' ? (is(first)?first:hits[0])
           : pos==='end'   ? (is(last)?last:hits[hits.length-1])
           : (hits.find(i=>i!==first&&i!==last) ?? hits[0]);
  let end=at+1; while(end<c.length && AR_MARK.test(c[end])) end++;
  const prev=base.filter(i=>i<at).pop(), next=base.find(i=>i>=end);
  const joinIn = prev!=null && !NO_JOIN.test(c[prev]);
  const joinOut= next!=null && !NO_JOIN.test(c[at]) && c[next]!=='ء';
  return esc(c.slice(0,at).join(''))+(joinIn?ZWJ:'')+
    `<span class="hl">${joinIn?ZWJ:''}${esc(c.slice(at,end).join(''))}${joinOut?ZWJ:''}</span>`+
    (joinOut?ZWJ:'')+esc(c.slice(end).join(''));
}
/* A word with one vowel mark in red: the word in red underneath, and on top the
   same word in ink without that mark (removing a mark doesn't move the letters). */
function hlMark(word, mark){
  const i=word.indexOf(mark); if(i<0) return esc(word);
  return `<span class="mk"><span class="mk-r">${esc(word)}</span><span class="mk-i" aria-hidden="true">${esc(word.slice(0,i)+word.slice(i+mark.length))}</span></span>`;
}

/* The alphabet board (#276): the whole alphabet, right to left from the top right. intro: every letter
   plain. Otherwise each letter shows how well it's known: greyed (not met yet), outlined (met), green
   (right on two different days) or gold (read inside words too), and the letters in `fresh` settle in
   one after another. Tap any letter to hear its name. */
const STATE_SAYS={new:'not met yet', met:'met', known:'known', gold:'known, and read inside words'};
function alphabetChart(title, fresh, intro){
  const st=ch=>intro?'new':RafiqPath.letterState(ch);
  const known=intro?0:ALL_LETTERS.filter(x=>/known|gold/.test(st(x.ch))).length;
  const w=el(`<div class="abc${intro?' intro':''}"><p class="kicker">${esc(title)}${intro?'':` · ${known} of ${ALL_LETTERS.length} known`}</p>
    <div class="abc-grid"></div>${intro?'':'<p class="abc-key"><span><i></i>met</span><span><i class="k-known"></i>right on 2 days</span><span><i class="k-gold"></i>read in words</span></p>'}
    <p class="abc-tip">Tap a letter to hear its name</p></div>`);
  const grid=w.querySelector('.abc-grid');
  ALL_LETTERS.forEach(x=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=x.ch;
    const s=st(x.ch), nu=!intro&&!!fresh&&fresh.includes(x.ch);
    b.className='abc-l'+(s!=='new'?' st-'+s:'')+(nu?' in':'');
    if(nu) b.style.animationDelay=(150+70*fresh.indexOf(x.ch))+'ms';
    b.setAttribute('aria-label', x.name+(intro?'':', '+STATE_SAYS[s]));
    b.onclick=()=>say(x.name,b);
    grid.appendChild(b);
  });
  return w;
}

/* One letter's card: big letter (tap for its name), sound, joined forms, and
   three words with the letter in red (tap to hear). */
function letterCard(l, kicker){
  const [ch,name,sound,,,exs]=l, joins=!sound.includes('*');
  const f=forms(ch,joins), labels=joins?['alone','start','middle','end']:['alone','end'];
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><div class="big" id="w" style="font-size:72px">${ch}</div>
    <div class="mid" style="font-size:20px">${esc(name)}</div>
    <div class="en" style="font-size:16px">${esc(sound.replace(' *',''))}</div>
    <div class="forms">${f.map((x,k)=>`<div><div class="mid" style="cursor:default">${x}</div><div class="tr">${labels[k]}</div></div>`).join('')}</div>
    ${joins?'':'<p class="tr">Doesn\'t join to the letter after it</p>'}
    <p class="kicker ex-k">In words · tap to hear</p>
    <div class="exs">${(exs||[]).map((e,k)=>`<button type="button" class="ex" data-k="${k}">
      <span class="ex-ar">${hlWord(e[0],ch,POS[k])}</span>
      <span class="ex-tx"><span class="ex-tr">${trHTML(e[1])}</span><span class="ex-en">${esc(e[2])}</span></span>
      <span class="ex-pos">${POS[k]}</span></button>`).join('')}</div></div></div>`);
  const a=body.querySelector('#w'); a.onclick=()=>say(name,a);
  body.querySelectorAll('.ex').forEach(b=>b.onclick=()=>say(exs[+b.dataset.k][0],b));
  return {body, speak:()=>say(name,a)};
}

/* "Which letter is this?": the sound, and the first sound of its example word.
   flip (#361): the other way round, the way reading goes: the letter is shown and its sound is picked. */
const soundOf=l=>l[2].replace(' *','').split(/ — |, /)[0];
function letterQuestion({t, options, kicker, at, total, onAnswer, onNext, flip}){
  setBar(at,total);
  const [ch,name,sound,,exEn]=t;
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card">${flip?`<div class="big" id="w" style="font-size:72px;cursor:default">${ch}</div><div class="tr">What sound does it make?</div>`
      :`<div class="en" style="margin:0">${esc(sound.replace(' *','').split(' — ')[0])}</div>
    <div class="tr">the first sound of the word for "${esc(exEn)}"</div>`}</div><div class="opts" id="o"></div></div>`);
  const next=button('Next',onNext); next.disabled=true;
  shuffle(options).forEach(x=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b._l=x;
    if(flip) b.textContent=soundOf(x); else{ b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=x[0]; }
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=x===t; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok); gradeLetter(ch,ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(o=>o._l===t).classList.add('right');
      if(onAnswer) onAnswer(ok);
      next.disabled=false;
      if(ok) autoNext(next, name, null); else say(name,null); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
}

/* Up to 5 earlier letters: ones missed last time first, then the group just
   before this one, then whichever has gone longest without practice. */
function warmUpLetters(group){
  const earlier=ALPHABET_GROUPS.slice(0,group).flatMap(g=>g.letters);
  const pick=[], add=l=>{ if(pick.length<5 && !pick.includes(l)) pick.push(l); };
  shuffle(earlier.filter(l=>weakLetter(l[0]))).slice(0,2).forEach(add);
  shuffle(ALPHABET_GROUPS[group-1].letters).slice(0,2).forEach(add);
  earlier.slice().sort((a,b)=>lastSeen(a[0]).localeCompare(lastSeen(b[0]))).forEach(add);
  return shuffle(pick);
}

/* Letters that are easy to mix up with ch: its own group and the letters that differ only by their
   dots, then any other letter met so far; n in all, ch first (options are shuffled where they're shown). */
const FAMILIES=['بتثني','جحخ','دذ','رز','سش','صض','طظ','عغ','فق'];
function alikeLetters(ch, n){
  const met=c=>RafiqPath.letterState(c)!=='new' || c===ch;
  const grp=(ALL_LETTERS.find(x=>x.ch===ch)||{}).group;
  const fam=[...(FAMILIES.find(f=>f.includes(ch))||'')], mates=shuffle(ALL_LETTERS.filter(x=>x.group===grp).map(x=>x.ch));
  const out=[ch];
  shuffle(fam).concat(mates).concat(shuffle(ALL_LETTERS.map(x=>x.ch))).forEach(c=>{ if(out.length<n && !out.includes(c) && met(c)) out.push(c); });
  return out;
}

/* The letter check-in (#276): letters met on an earlier day and not known yet come back, and one right
   again on a later day turns green on the board. It opens a reading-starter step (up to 5 letters,
   then = what comes next), and once every step is done it's a step of its own (then = null) until all
   28 letters are green. */
let checkedIn=false;
function runCheckIn(letters, then){
  const home=()=>{location.href='dashboard.html'};
  if(!letters.length){                     // nothing left to ask today: the letters still to go were answered today
    setBar(1,1);
    const left=RafiqPath.LETTERS.filter(ch=>RafiqPath.letterState(ch)==='met').length;
    const body=el(`<div class="done"><div class="tick">🌙</div><h2>Your last letters need a night’s sleep</h2>
      <p>A letter turns green when you get it right on two different days. Come back tomorrow for a quick check-in on ${left===1?'the last one':'the last '+left}, and the basics open.</p></div>`);
    body.appendChild(alphabetChart('Your alphabet'));
    return screen(body,[button('Back to home',home)]);
  }
  const L=letters.map(letterOf).filter(Boolean);
  let k=0;
  const q=()=>{
    if(k>=L.length) return done();
    const t=L[k];
    letterQuestion({t, options:alikeLetters(t[0],4).map(letterOf), kicker:`Check-in: letters from before · ${k+1} of ${L.length}`,
      at:k, total:L.length, onNext:()=>{k++;q();}});
  };
  const done=()=>{
    const green=letters.filter(ch=>/known|gold/.test(RafiqPath.letterState(ch)));
    if(then && !green.length) return then();
    if(!then) RafiqPath.markDay();
    setBar(1,1);
    const all=RafiqPath.lettersKnown();
    const body=el(`<div class="done"><div class="tick">${all?'🎉':green.length?'🌱':'💪'}</div>
      <h2>${all?'Every letter is green':green.length?`${green.length} ${green.length===1?'letter':'letters'} turned green`:'Not green yet'}</h2>
      <p>${all?'You know all 28 letters: the reading starter is done.':green.length?'Right on two different days: they’re yours now.':'They’ll come back tomorrow. Getting them right on a later day is what turns them green.'}</p></div>`);
    body.appendChild(alphabetChart('Your alphabet', green));
    screen(body, then ? [button('Continue',then)] : doneButtons(RafiqPath.next(), false));
  };
  q();
}
/* Two new letter groups in a day is plenty (#276): before a third, a nudge to stop, with a way on. */
function plenty(go){
  setBar(0,1);
  const body=el(`<div class="done"><div class="tick">🌙</div><h2>That’s plenty of new letters for today</h2>
    <p>You’ve met two new groups of letters today. They stick best after a night’s sleep: tomorrow starts with a quick check-in on today’s letters, and the ones you get right turn green.</p></div>`);
  body.appendChild(alphabetChart('Your alphabet'));
  screen(body,[button('Back to home',()=>{location.href='dashboard.html'}), button('Keep going anyway',go,true)]);
}

/* Write it (#361): the letter, faint, to trace with a finger. Adults learning Arabic letters by writing them learned
   them faster, and read with them better, than by typing or watching (Wiley & Rapp 2021). The letter is drawn
   off-screen to find its ink, in cells of 14px: it's written once nine cells in ten have been passed over and every
   separate piece of it (each dot: they're what tells ب from ت) has been touched. Ink well away from the letter
   counts as straying: more of that than the letter itself, and it has to be cleared. */
let traceTarget=null;                    // the middles of the cells to pass over, for tests/starter_depth.py
function tracePad(ch, onDone){
  const S=280, C=14, N=S/C, R=2;         // the pad, a cell, cells a side, canvas pixels to a CSS pixel
  const box=el(`<div class="trace"><canvas width="${S*R}" height="${S*R}" role="img" aria-label="The letter ${ch}, to trace"></canvas>
    <p class="tr" id="msg" aria-live="polite"></p><button type="button" class="hear" id="clr">↺ Clear</button></div>`);
  const cv=box.querySelector('canvas'), g=cv.getContext('2d'), msg=box.querySelector('#msg');
  const css=getComputedStyle(document.documentElement), col=v=>css.getPropertyValue(v).trim(), fam=col('--ar');
  let size=200, pos=[0,0], need=new Set(), near=new Set(), hit=new Set(), stray=new Set(), pieces=[], got=new Set(), last=null, done=false;
  const glyph=(c, colour)=>{ c.font=`600 ${size}px ${fam}`; c.textAlign='left'; c.textBaseline='alphabetic'; c.direction='ltr'; c.fillStyle=colour; c.fillText(ch, pos[0], pos[1]); };
  const guide=()=>{ g.setTransform(R,0,0,R,0,0); g.clearRect(0,0,S,S); g.globalAlpha=.22; glyph(g, col('--ink')); g.globalAlpha=1; };
  const box3=(k, fn)=>{ const cx=k%N, cy=(k-cx)/N; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const X=cx+dx, Y=cy+dy; if(X>=0&&X<N&&Y>=0&&Y<N) fn(Y*N+X); } };
  const build=()=>{
    const fit=()=>{ g.font=`600 ${size}px ${fam}`; const m=g.measureText(ch); return [m.actualBoundingBoxLeft, m.actualBoundingBoxRight, m.actualBoundingBoxAscent, m.actualBoundingBoxDescent]; };
    size=200; let [l,r,a,d]=fit();
    size*=Math.min(.66*S/(l+r), .66*S/(a+d)); [l,r,a,d]=fit();                 // the letter fills the middle two thirds
    pos=[(S-l-r)/2+l, (S-a-d)/2+a];
    const off=document.createElement('canvas'); off.width=off.height=S; const o=off.getContext('2d'); glyph(o,'#000');
    const px=o.getImageData(0,0,S,S).data, ink=new Map();
    for(let y=0;y<S;y++) for(let x=0;x<S;x++) if(px[(y*S+x)*4+3]>128){ const k=Math.floor(y/C)*N+Math.floor(x/C); ink.set(k,(ink.get(k)||0)+1); }
    need=new Set([...ink].filter(([,n])=>n>=C*C/10).map(([k])=>k)); near=new Set(ink.keys()); need.forEach(k=>box3(k, j=>near.add(j)));
    // its separate pieces of ink, each as the box around it [left, top, right, bottom]
    const seen=new Uint8Array(S*S), on=i=>px[i*4+3]>128; pieces=[];
    for(let i=0;i<S*S;i++){ if(seen[i] || !on(i)) continue;
      const bx=[S,S,0,0], todo=[i]; let count=0; seen[i]=1;
      while(todo.length){ const j=todo.pop(), x=j%S, y=(j-x)/S; count++;
        bx[0]=Math.min(bx[0],x); bx[1]=Math.min(bx[1],y); bx[2]=Math.max(bx[2],x); bx[3]=Math.max(bx[3],y);
        [x>0&&j-1, x<S-1&&j+1, j-S, j+S].forEach(q=>{ if(q!==false && q>=0 && q<S*S && !seen[q] && on(q)){ seen[q]=1; todo.push(q); } }); }
      if(count>20) pieces.push(bx); }
    traceTarget={S, pts:[...need].map(k=>[(k%N+.5)*C, (Math.floor(k/N)+.5)*C]).concat(pieces.map(b=>[(b[0]+b[2])/2, (b[1]+b[3])/2]))};
    hit=new Set(); stray=new Set(); got=new Set(); msg.textContent=''; guide();
  };
  const mark=(x,y)=>{ const k=Math.floor(y/C)*N+Math.floor(x/C); if(!near.has(k)) stray.add(k); box3(k, j=>{ if(need.has(j)) hit.add(j); });
    pieces.forEach((b,i)=>{ if(x>=b[0]-6 && x<=b[2]+6 && y>=b[1]-6 && y<=b[3]+6) got.add(i); }); };
  const stroke=(a,b)=>{
    g.strokeStyle=g.fillStyle=col('--verdigris'); g.lineWidth=20; g.lineCap=g.lineJoin='round'; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    g.beginPath(); g.arc(b[0],b[1],10,0,7); g.fill();                          // a tap (a dot) leaves its mark too
    const n=Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1])/6));
    for(let i=0;i<=n;i++) mark(a[0]+(b[0]-a[0])*i/n, a[1]+(b[1]-a[1])*i/n);
    if(stray.size>need.size) return void(msg.textContent='Off the lines a little. Tap Clear and have another go.');
    if(hit.size>=.9*need.size && got.size===pieces.length){ done=true; last=null; g.clearRect(0,0,S,S); glyph(g, col('--verdigris')); msg.textContent='✓ Written. Try it on paper too.'; onDone(); }
  };
  const at=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*S/r.width, (e.clientY-r.top)*S/r.height]; };
  cv.onpointerdown=e=>{ if(done) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} last=at(e); stroke(last,last); };
  cv.onpointermove=e=>{ if(!last) return; const q=at(e); stroke(last,q); last=q; };
  cv.onpointerup=cv.onpointercancel=()=>{ last=null; };
  box.querySelector('#clr').onclick=()=>{ if(!done) build(); };
  build();
  // the Arabic font may still be on its way: once it's here, draw the letter in it (unless tracing has begun)
  if(document.fonts && document.fonts.load) document.fonts.load(`600 ${size}px ${fam}`, ch).then(()=>{ if(!done && !hit.size && !stray.size && box.isConnected) build(); }, ()=>{});
  return box;
}

function runLetters(p, step){
  const g=ALPHABET_GROUPS[step.group], L=g.letters;
  const intro=step.group===0;
  // straight on from the last group (Continue learning) the earlier letters are fresh: no warm-up
  const warm=step.group>0 && !qs.get('cont') && !checkedIn ? warmUpLetters(step.group) : [];
  const earlier=ALPHABET_GROUPS.slice(0,step.group).flatMap(x=>x.letters);
  /* #361: each letter is met, written, then recalled twice with a growing gap: by ear (hear its name, tap it) and by
     eye (see it, pick its sound). A letter missed comes back once more at the end. */
  const n=L.length, plan=[], again=[];
  L.forEach((l,i)=>{ plan.push({meet:l, i}, {write:l}); if(i>=1) plan.push({l:L[i-1], r:0}); if(i>=3) plan.push({l:L[i-3], r:1}); });
  const rest=L.slice(Math.max(0,n-3), n-1).map(l=>({l, r:1}));
  rest.splice(1, 0, {l:L[n-1], r:0}); rest.push({l:L[n-1], r:1});
  plan.push(...rest);
  const before=(intro?1:0)+warm.length, total=before+plan.length;
  const start=()=>{
    if(!intro) return warmUp(0);
    setBar(0,total);
    const body=el(`<div><p class="kicker">Before you start</p><div class="card">
      <h2 class="abc-h">The Arabic alphabet</h2>
      <p class="abc-p">These are the 28 letters of Arabic. They're read from right to left, starting at the top right. You'll learn them in 7 small groups, beginning with the first four.</p></div></div>`);
    body.querySelector('.card').appendChild(alphabetChart('All 28 letters', null, true));
    screen(body,[button('Start with the first letters',go)]);
  };
  const warmUp=k=>{
    if(k>=warm.length) return go();
    const t=warm[k], mates=ALPHABET_GROUPS.find(x=>x.letters.includes(t)).letters;
    const opts=[t].concat(shuffle(mates.filter(l=>l!==t)).slice(0,3));
    shuffle(earlier.filter(l=>!opts.includes(l))).slice(0,Math.max(0,4-opts.length)).forEach(l=>opts.push(l));
    letterQuestion({t, options:opts, kicker:`Warm-up before new letters · ${k+1} of ${warm.length}`,
      at:k+(intro?1:0), total, onNext:()=>warmUp(k+1)});
  };
  let k=0;
  const go=()=>{
    const it=k<plan.length ? plan[k] : again[k-plan.length];
    if(!it) return finish(p, step, `<div class="wnote">🧠 You recalled each letter twice, by ear and by eye. Writing them on paper too helps them stick.</div>`);
    const at=before+k, all=total+again.length, next=()=>{ k++; go(); };
    setBar(at, all);
    if(it.meet){ const c=letterCard(it.meet, `${g.title} · ${it.i+1} of ${n}`);
      screen(c.body,[button('Now write it',next)]); return c.speak(); }
    if(it.write) return write(it.write, next);
    const l=it.l; playAnswer=l[0];
    const onAnswer=ok=>{ if(!ok && !again.some(x=>x.l===l)) again.push({l, r:it.r, redo:true}); };
    if(it.r) letterQuestion({t:l, options:L, flip:true, kicker:it.redo?'One more try':'See it, pick its sound', at, total:all, onAnswer, onNext:next});
    else hearQuestion({it:[l[1], l[0], L.map(x=>x[0]).join(''), soundOf(l)], ask:'Which letter is it?', kicker:it.redo?'One more try':'Hear it, tap the letter', at, total:all, onAnswer, onNext:next});
  };
  const write=(l, next)=>{
    const body=el(`<div><p class="kicker">${esc(g.title)} · write it</p><div class="card"><p class="howto" style="margin:0 0 12px">Trace the letter with your finger</p></div></div>`);
    const on=button('Next',next); on.disabled=true;
    body.querySelector('.card').appendChild(tracePad(l[0], ()=>{ on.disabled=false; window.RafiqSound&&RafiqSound.answer(true); say(l[1],null); }));
    screen(body,[on, button('Skip',next,true)]);
  };
  // two new letter groups a day is plenty (#276): a third waits for tomorrow, unless the learner insists
  if(!RafiqPath.stepDone(p.n, step.key) && RafiqPath.newGroupsToday()>=2) plenty(start); else start();
}

/* #361: the marks are met on ب, then read on other letters, so they aren't learned as part of ب: the letter's own
   sound in place of the b ("tu", "saa"). Letters whose sound is one English letter, and no ل (لا comes later). */
const MARK_ON={ت:'t',د:'d',ر:'r',ز:'z',س:'s',ك:'k',م:'m',ن:'n',ف:'f'};
const onLetter=(v,c)=>[v[0].replace('ب',c), v[1].replace(/b/g, MARK_ON[c])];
function runVowels(p, step){
  const V=VOWEL_MARKS;
  // the mark after ب in red; for a long vowel, the letter after it
  const shown=(w,word,pos)=>{ const m=w.slice(1); return AR_MARK.test(m) ? hlMark(word,m) : hlWord(word,m,pos); };
  /* Each mark is read on another letter one card after it's met (#361), then four "which one says" on ب close the
     lesson, and a mark missed either way comes back once more. */
  const plan=[], again=[];
  V.forEach((v,i)=>{ plan.push({meet:v, i}); if(i>=1) plan.push({v:V[i-1], read:true}); });
  plan.push({v:V[V.length-1], read:true}, ...shuffle(V).slice(0,4).map(v=>({v})));
  let k=0;
  const go=()=>{
    const it=k<plan.length ? plan[k] : again[k-plan.length];
    if(!it) return finish(p, step);
    setBar(k, plan.length+again.length);
    const next=()=>{ k++; go(); };
    if(it.meet) return meet(it.meet, it.i, next);
    const t=it.v, miss=ok=>{ if(!ok && !again.some(x=>x.v===t)) again.push({v:t, read:it.read, redo:true}); };
    // wrong choices: the marks whose sound is nearest in length (ta / ti / tu; taa / tii / tuu)
    const others=shuffle(V.filter(x=>x!==t)).sort((x,y)=>Math.abs(x[1].length-t[1].length)-Math.abs(y[1].length-t[1].length));
    if(it.read){ const c=shuffle(Object.keys(MARK_ON))[0], [w, sound]=onLetter(t,c);
      return pick(it.redo?'One more try':'Same mark, new letter: how does it sound?', w, [sound].concat(others.slice(0,2).map(x=>onLetter(x,c)[1])), sound, miss, next); }
    pick(it.redo?`One more try: which one says "${t[1]}"?`:`Which one says "${t[1]}"?`, '', [t[0]].concat(others.slice(0,3).map(x=>x[0])), t[0], miss, next);
  };
  const meet=(v, i, next)=>{
    const [w,sound,what,ex]=v;
    const body=el(`<div><p class="kicker">The vowel marks · ${i+1} of ${V.length}</p>
      <div class="card"><div class="big" style="font-size:80px;cursor:default">${shown(w,w,'end')}</div>
      <div class="en">"${esc(sound)}"</div><p style="color:var(--ink-soft);margin-top:10px">${esc(what)}</p>
      ${ex?`<p class="kicker ex-k">In a word · tap to hear</p><div class="exs"><button type="button" class="ex" id="x">
        <span class="ex-ar">${shown(w,ex[0],'middle')}</span>
        <span class="ex-tx"><span class="ex-tr">${trHTML(ex[1])}</span><span class="ex-en">${esc(ex[2])}</span></span></button></div>`:''}</div>
      <p class="x-note taphint">Most books for learners — and this app — show every vowel</p></div>`);
    const x=body.querySelector('#x'); if(x) x.onclick=()=>say(ex[0],x);
    screen(body,[button('Next',next)]);
  };
  // one pick: a mark on a letter to read (show), or the written forms to choose from
  const pick=(kicker, show, opts, right, onAnswer, onNext)=>{
    const body=el(`<div><p class="kicker">${esc(kicker)}</p>${show?`<div class="card"><div class="big" id="w" style="font-size:80px;cursor:default">${esc(show)}</div>
      <div class="tr">How is it said?</div></div>`:''}<div class="opts" id="o"></div></div>`);
    const next=button('Next',onNext); next.disabled=true;
    shuffle(opts).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=x;
      if(!show){ b.style.fontFamily='var(--ar)'; b.style.fontSize='30px'; }
      b.onclick=()=>{ if(!next.disabled) return;
        const ok=x===right; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
        if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===right).classList.add('right');
        next.disabled=false; onAnswer(ok);
        if(ok) autoNext(next, null); };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  go();
}

/* Play (#276): after each letter group, a round of quick questions on its letters, with three from
   earlier groups mixed in: which letter is red inside a word, which letter a joined form is, letters
   that differ only by their dots, and the first letter of a word you hear. Stars for answers right
   first time (no clock, so care beats speed); a missed question comes back once at the end. */
function pickLetter({kicker, show, sub, ch, at, total, inWord, sayAfter, reveal, onAnswer, onNext}){
  setBar(at,total);
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><div class="big" id="w" style="cursor:default">${show}</div><div class="tr">${esc(sub)}</div><div id="rev" class="rev hide"></div></div>
    <div class="opts" id="o"></div></div>`);
  const next=button('Next',onNext); next.disabled=true;
  shuffle(alikeLetters(ch,4)).forEach(c=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=c;
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=c===ch; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
      RafiqPath.letterAnswer(ch, ok, inWord);
      if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===ch).classList.add('right');
      if(reveal){ const rv=body.querySelector('#rev'); rv.innerHTML=reveal; rv.classList.remove('hide'); }
      onAnswer(ok); next.disabled=false;
      const w=body.querySelector('#w');
      if(ok) autoNext(next, sayAfter, w); else say(sayAfter, w); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
}
function playItems(group){
  const G=ALPHABET_GROUPS[group].letters, E=ALPHABET_GROUPS.slice(0,group).flatMap(g=>g.letters);
  const spot=l=>{ const k=Math.floor(Math.random()*3); return {type:'spot', l, k}; };
  const form=l=>({type:'form', l});
  const items=[];
  shuffle(G).slice(0,3).forEach(l=>items.push(spot(l)));
  shuffle(G).slice(0,3).forEach(l=>items.push(form(l)));
  shuffle(G.filter(l=>FAMILIES.some(f=>f.includes(l[0])))).slice(0,2).forEach(l=>items.push({type:'dots', l}));
  shuffle(G).slice(0,2).forEach(l=>items.push({type:'hear', l}));
  // keep it fresh: three from earlier groups
  shuffle(E).slice(0,3).forEach((l,i)=>items.push(i===0?spot(l):i===1?{type:'hear', l}:form(l)));
  return shuffle(items);
}
let playAnswer=null;                     // the letter the Play question on screen wants (for tests/starter_game.py)
function playQuestion(it, kicker, at, total, onAnswer, onNext){
  const l=it.l, [ch,name,sound,,exEn,exs]=l;
  playAnswer=ch;
  if(it.type==='spot'){ const [w,tr,en]=exs[it.k];
    return pickLetter({kicker, show:hlWord(w,ch,POS[it.k]), sub:'Which letter is in red?', ch, at, total, inWord:true, sayAfter:w,
      reveal:`<div class="tr">${trHTML(tr)} · ${esc(en)}</div>`, onAnswer, onNext}); }
  if(it.type==='form'){ const joins=!sound.includes('*'), f=forms(ch,joins), k=joins?1+Math.floor(Math.random()*3):1;
    const where=joins?['','at the start of a word','in the middle of a word','at the end of a word'][k]:'at the end of a word';
    return pickLetter({kicker, show:`<span style="font-size:72px">${f[k]}</span>`, sub:`Which letter is this? It’s its shape ${where}.`, ch, at, total, sayAfter:name, onAnswer, onNext}); }
  if(it.type==='dots')
    return letterQuestion({t:l, options:alikeLetters(ch,4).map(letterOf), kicker, at, total, onAnswer, onNext});
  hearQuestion({it:[exs[0][0], ch, alikeLetters(ch,3).join(''), exs[0][2]], kicker, at, total, onAnswer, onNext});
}
const starsHTML=n=>`<div class="stars" aria-label="${n} of 3 stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(3-n)}</span></div>`;
function runPlay(p, step){
  const items=playItems(step.group), total=items.length, again=[];
  let k=0, firstRight=0, combo=0;
  const streak=()=>combo>=2?` · 🔥 ${combo} in a row`:'';
  const q=()=>{
    if(k>=total) return retry(0);
    playQuestion(items[k], `Play · ${k+1} of ${total}`+streak(), k, total+again.length,
      ok=>{ if(ok){ firstRight++; combo++; } else { combo=0; again.push(items[k]); } }, ()=>{k++;q();});
  };
  // the ones missed come back once, for practice: they don't change the stars
  const retry=i=>{
    if(i>=again.length) return end();
    playQuestion(again[i], 'Play · one more try'+streak(), total+i, total+again.length,
      ok=>{ combo=ok?combo+1:0; }, ()=>retry(i+1));
  };
  const end=()=>{
    const n=firstRight/total>=0.9?3:firstRight/total>=0.7?2:1, best=Math.max(n, RafiqPath.stars(p.n, step.key));
    RafiqPath.saveStars(p.n, step.key, n);
    const more=n<3 ? [button('Play again for more stars',()=>{location.href='learn.html?u='+p.n+'&s='+step.key},true)] : [];
    // #361: reading needs letters known at a glance, so a timed bonus on every letter met so far (nothing scored)
    more.push(button(`⚡ Bonus game: how many in ${SPEED_SECS} seconds?`,()=>speedRound(p, {head:'tap its sound', key:'rafiq_letters_best',
      pool:ALPHABET_GROUPS.slice(0,step.group+1).flatMap(g=>g.letters).map(l=>({ar:l[0], en:soundOf(l)}))}),true));
    finish(p, step, `${starsHTML(n)}<p>${firstRight} of ${total} right first time${best>n?` · your best: ${best} stars`:''}</p>`
      + (step.group===ALPHABET_GROUPS.length-1 ? `<div class="wnote up">🔓 You’ve met all 28 letters. Next: the vowel marks, then your first words.</div>` : ''), more);
  };
  q();
}

/* Read a word, then pick how it's said: you hear it, with its meaning, once you've chosen (#276).
   Right first time: every letter in it counts as read inside a word (gold on the board). */
function readPick({kicker, word, right, wrong, en, at, total, onAnswer, onNext}){
  setBar(at,total);
  const v=VOCAB.find(x=>x.ar===word), pic=v && PICS.has(v.id) ? `<div class="pic sm" aria-hidden="true">${wordPic(v.id)}</div>` : '';   // #361: its drawing, with the meaning
  const body=el(`<div><p class="kicker">${esc(kicker)}</p><div class="card"><div class="big" id="w" style="cursor:default">${esc(word)}</div>
    <div class="hide" id="m">${pic}<div class="en">${esc(en)}</div></div></div><p class="howto">How is it said?</p><div class="opts" id="o"></div></div>`);
  const w=body.querySelector('#w');
  const next=button('Next',onNext); next.disabled=true;
  shuffle([right].concat(wrong)).forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=o;
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=o===right; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok);
      if(ok) RafiqPath.readWord(word); else [...body.querySelectorAll('.opt')].find(e=>e.textContent===right).classList.add('right');
      body.querySelector('#m').classList.remove('hide'); next.disabled=false; if(onAnswer) onAnswer(ok);
      w.style.cursor='pointer'; w.onclick=()=>say(word,w);       // heard only once you've read it
      if(ok) autoNext(next, word, w); else say(word, w); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
}
/* Sounding out (#276): a word in pieces, each a letter with its vowel. Tap each piece, from the right,
   to see how it's said and say it aloud, then pick how the whole word is said, and hear it. */
function runSound(p, step){
  const W=SOUNDING, total=W.length*2;
  let i=0;
  const pieces=()=>{
    if(i>=W.length) return finish(p, step);
    setBar(i*2,total);
    const [word, ps]=W[i];
    const body=el(`<div><p class="kicker">Sounding out · ${i+1} of ${W.length}</p><div class="card">
      <div class="big" style="cursor:default">${esc(word)}</div>
      <div class="sx">${ps.map(([a],k)=>`<button type="button" data-k="${k}"><span>${esc(a)}</span><i></i></button>`).join('')}</div>
      <p class="howto">Tap each piece, from the right, and say it aloud</p></div></div>`);
    const btns=[...body.querySelectorAll('.sx button')];
    const next=button('Now the whole word',whole); next.disabled=true;
    btns.forEach((b,k)=>b.onclick=()=>{ b.querySelector('i').textContent=ps[k][1]; b.classList.add('on');
      if(btns.every(x=>x.classList.contains('on'))) next.disabled=false; });
    screen(body,[next]);
  };
  const whole=()=>{
    const [word, ps, en, wrong]=W[i];
    readPick({kicker:`Sounding out · ${i+1} of ${W.length} · the whole word`, word, right:ps.map(x=>x[1]).join(''), wrong, en,
      at:i*2+1, total, onNext:()=>{i++;pieces();}});
  };
  pieces();
}
/* Your first words (#276): twelve words from the letter cards, easy to harder, each read before it's heard. */
function runFirstWords(p, step){
  const W=FIRST_WORDS, queue=W.slice();      // #361: a word read wrong comes back at the end, until it's read right
  let i=0, right=0;
  const q=()=>{
    if(!queue.length) return finish(p, step, `<div class="wnote up">📖 <b>${right} of ${W.length}</b> Arabic words read right first time</div>`);
    const it=queue.shift(), [word, reading, wrong, en]=it, first=i<W.length;
    readPick({kicker:first?`Your first words · ${i+1} of ${W.length}`:'Your first words · one more try', word, right:reading, wrong, en,
      at:Math.min(i,W.length), total:W.length+queue.length, onAnswer:ok=>{ if(!ok) queue.push(it); else if(first) right++; }, onNext:()=>{i++;q();}});
  };
  q();
}

/* Reading rules (#163): what the marks alone don't tell you (ة, ال, sun letters, the joining alif,
   stopping), one rule a screen with examples to tap, each followed by a quick check. */
const RULE_SETS={rules:()=>READING_RULES, rules2:()=>READING_RULES_2, rules3:()=>READING_RULES_3};   // #276: two more sets
function runRules(p, step){
  const R=RULE_SETS[step.key](), sayOf=e=>e[3]||e[0], total=R.length*3;
  /* #361: a guess before each rule (trying first, even wrongly, helps what's taught next to stick), and the checks
     together at the end of the set rather than straight after each card; one missed comes back. */
  const guess=i=>{
    if(i>=R.length) return checks(shuffle(R.map((_,k)=>k)), 0);
    setBar(i*2,total);
    quickCheck({check:R[i][3]}, `${step.title} · ${i+1} of ${R.length} · have a guess first`, ()=>show(i), true);
  };
  const show=i=>{
    setBar(i*2+1,total);
    const [title, what, exs]=R[i];
    const body=el(`<div><p class="kicker">${esc(step.title)} · ${i+1} of ${R.length}</p>
      <div class="card note"><h3 class="gh">${withAr(title)}</h3><p style="text-align:left">${withAr(what)}</p>
      <p class="kicker ex-k">Tap to hear</p><div class="exs">${exs.map((e,k)=>`<button type="button" class="ex" data-k="${k}">
        <span class="ex-ar">${esc(e[0])}</span><span class="ex-tx"><span class="ex-tr">${trHTML(e[1])}</span><span class="ex-en">${esc(e[2])}</span></span></button>`).join('')}</div></div></div>`);
    const btns=[...body.querySelectorAll('.ex')];
    btns.forEach(b=>b.onclick=()=>say(sayOf(exs[+b.dataset.k]),b));
    screen(body,[button(i<R.length-1?'Next rule':'Check yourself',()=>guess(i+1))]);
    const play=k=>{ if(k<btns.length && btns[k].isConnected) say(sayOf(exs[k]),btns[k],()=>setTimeout(()=>play(k+1),400)); };
    play(0);
  };
  const checks=(queue, n)=>{
    if(!queue.length) return finish(p, step);
    setBar(Math.min(R.length*2+n, total-1), total);
    let missed=false;
    quickCheck({check:R[queue[0]][3]}, n<R.length?`Check yourself · ${n+1} of ${R.length}`:'One more try',
      ()=>checks(queue.slice(1).concat(missed?[queue[0]]:[]), n+1), false, ok=>{ missed=!ok; });
  };
  guess(0);
}

/* Listening test: a word is played (not shown) and the learner picks the letter
   it starts with from letters that sound alike. 12 questions, 9 to pass. Below
   that: each missed letter's card again, listening practice on those letters and
   their look-alikes, then a retake with a fresh set of words. */
const TEST_LEN=12, TEST_PASS=9;
function testItems(){
  const sets=[...new Set(LISTEN_TEST.map(x=>x[2]))];
  const pick=sets.map(s=>shuffle(LISTEN_TEST.filter(x=>x[2]===s))[0]);        // every kind of look-alike at least once
  shuffle(LISTEN_TEST.filter(x=>!pick.includes(x))).slice(0,TEST_LEN-pick.length).forEach(x=>pick.push(x));
  return shuffle(pick);
}
function hearQuestion({it, kicker, at, total, onAnswer, onNext, ask}){            // ask (#361): a letter's name is played, not a word
  setBar(at,total);
  const [word,ch,opts,en]=it;
  const body=el(`<div><p class="kicker">${esc(kicker)}</p>
    <div class="card"><button type="button" class="hear-big" id="play" aria-label="Play ${ask?'it':'the word'} again">🔊</button>
    <div class="tr" style="margin-top:10px">${esc(ask||'Which letter does this word start with?')}</div>
    <div id="rev" class="rev hide"></div></div><div class="opts" id="o"></div></div>`);
  const play=body.querySelector('#play'), hear=listenThen(body, done=>say(word,play,done), 'pick', ask?'Now pick the letter':'Now pick the first letter');
  play.onclick=hear;
  const next=button('Next',onNext); next.disabled=true;
  shuffle([...opts]).forEach(x=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=x;
    b.onclick=()=>{ if(!next.disabled) return;
      const ok=x===ch; b.classList.add(ok?'right':'wrong'); window.RafiqSound&&RafiqSound.answer(ok); gradeLetter(ch,ok);
      if(!ok) [...body.querySelectorAll('.opt')].find(o=>o.textContent===ch).classList.add('right');
      const rev=body.querySelector('#rev');
      rev.innerHTML=`<div class="mid" id="rw">${hlWord(word,ch,'start')}</div><div class="tr">${esc(en)}</div>`;
      rev.classList.remove('hide'); const rw=rev.querySelector('#rw'); rw.onclick=()=>say(word,rw);
      onAnswer(ok,ch); next.disabled=false;
      if(ok) autoNext(next, word, rw); };
    body.querySelector('#o').appendChild(b);
  });
  screen(body,[next]);
  hear();
}
function runHearing(p, step){
  const home=()=>{location.href='dashboard.html'};
  const intro=()=>{
    setBar(0,1);
    const body=el(`<div><p class="kicker">Listening test</p><div class="card">
      <div style="font-size:44px">🎧</div><h2 class="abc-h">Can you hear the difference?</h2>
      <p class="abc-p">You'll hear ${TEST_LEN} words without seeing them. For each one, pick the letter it starts with. The choices sound alike, so listen closely, and play a word as often as you like. ${TEST_PASS} right to pass.</p></div></div>`);
    screen(body,[button('Start the test',test)]);
  };
  const test=()=>{
    const items=testItems(), missed=[]; let k=0, score=0;
    const q=()=>{
      if(k>=items.length) return result();
      hearQuestion({it:items[k], kicker:`Listening test · ${k+1} of ${items.length}`, at:k, total:items.length,
        onAnswer:(ok,ch)=>{ if(ok) score++; else if(!missed.includes(ch)) missed.push(ch); }, onNext:()=>{k++;q();}});
    };
    const result=()=>{
      if(score>=TEST_PASS) return finish(p, step, `<div class="wnote up">🎧 <b>${score} / ${items.length}</b>: you passed the listening test</div>`);
      setBar(1,1);
      const body=el(`<div class="done"><div class="tick">🎧</div><h2>${score} / ${items.length}</h2>
        <p>You need ${TEST_PASS} to pass. Let's practise the letters that tripped you up, then try again.</p>
        <div class="miss-l">${missed.map(ch=>`<span>${ch}</span>`).join('')}</div></div>`);
      screen(body,[button('Practise these letters',()=>practise(missed)), button('Back to home',home,true)]);
    };
    q();
  };
  const practise=letters=>{
    const cards=letters.map(letterOf).filter(Boolean);
    const own=shuffle(LISTEN_TEST.filter(x=>letters.includes(x[1])));
    const alike=shuffle(LISTEN_TEST.filter(x=>!letters.includes(x[1]) && letters.some(ch=>x[2].includes(ch))));
    const drills=own.concat(alike).slice(0,Math.min(8,Math.max(4,letters.length*2)));
    const total=cards.length+drills.length;
    const card=i=>{
      if(i>=cards.length) return drill(0);
      setBar(i,total);
      const c=letterCard(cards[i], `Practise · letter ${i+1} of ${cards.length}`);
      screen(c.body,[button(i<cards.length-1?'Next letter':'Now listen',()=>card(i+1))]);
      c.speak();
    };
    const drill=k=>{
      if(k>=drills.length) return ready();
      hearQuestion({it:drills[k], kicker:`Practise · listen ${k+1} of ${drills.length}`, at:cards.length+k, total,
        onAnswer:()=>{}, onNext:()=>drill(k+1)});
    };
    const ready=()=>{
      setBar(1,1);
      screen(el(`<div class="done"><div class="tick">💪</div><h2>Ready to try again?</h2>
        <p>A fresh set of ${TEST_LEN} words. You need ${TEST_PASS} to pass.</p></div>`),
        [button('Retake the test',test), button('Back to home',home,true)]);
    };
    card(0);
  };
  intro();
}

/* Read your first line (#276): the first two verses of al-Fātiḥah. Read each verse yourself first (tap
   a word to see how it's read and what it means), then hear al-Husary recite it, each word lighting up
   as he says it. Only ever his licensed recitation (salah.js), never a generated voice: without it,
   a read-along. */
function runLine(p, step){
  const S=window.RafiqSalah, part=S && S.part && S.part('fatiha1');
  const lines=FIRST_LINE.map(f=>({tr:f.tr, line:part && part.lines.find(l=>l.ref===f.ref)})).filter(x=>x.line);
  const total=lines.length*2;
  let i=0;
  const read=()=>{
    if(i>=lines.length) return end();
    setBar(i*2,total);
    const {tr, line}=lines[i];
    const body=el(`<div><p class="kicker">Read your first line · al-Fātiḥah ${esc(line.ref)}</p><div class="card">
      <div class="fl">${line.words.map((w,k)=>`<button type="button" data-k="${k}"><b>${esc(w.ar)}</b><i></i></button>`).join('')}</div>
      <p class="howto">Read it yourself first, from the right. Tap a word to check how it’s read.</p></div></div>`);
    body.querySelectorAll('.fl button').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; b.classList.add('on');
      b.querySelector('i').innerHTML=`${esc(tr[k])}<br>${esc(line.words[k].en)}`; });
    screen(body,[button('Now hear al-Husary',hear)]);
  };
  const hear=()=>{
