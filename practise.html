<style>
.hero{padding:40px 0 6px;text-align:center}
.hero .greet{font-family:var(--ar);direction:rtl;font-size:clamp(26px,6vw,36px);font-weight:600;color:var(--ink);
  line-height:1.7;margin:0 0 10px;padding:4px 0}
.hero .greet .nm{color:var(--rubric);cursor:pointer;border-bottom:1px dotted rgba(180,50,42,.4);transition:opacity .12s}
.hero .greet .nm:active{opacity:.6}
.hero h1{font-size:clamp(21px,4.4vw,26px);font-weight:700;margin:0 auto}
.hero p{color:var(--ink-soft);font-size:14.5px;margin:8px auto 0;max-width:52ch}
.today{font-family:var(--ut);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-top:14px}
.today b{color:var(--rubric)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:28px 0 48px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:28px;min-height:210px;position:relative;display:flex;flex-direction:column;transition:transform .18s,border-color .18s;touch-action:manipulation}
.tile:active{transform:scale(.985)}
.tilehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px}
.tile .ar{font-family:var(--ar);direction:rtl;font-size:25px;font-weight:600;color:var(--ink);line-height:1.65;padding:2px 0}
.tile h2{font-size:20px;margin-top:14px}
.tile p{color:var(--ink-soft);font-size:13px;margin-top:8px;flex:1}
.tile .go{font-size:13px;color:var(--verdigris);font-weight:500;margin-top:12px}
.tile.drills .ar{color:var(--rubric)}
.corner{flex:0 0 auto}
.acctbar{max-width:1000px;margin:34px auto 0;padding:16px 30px 0;border-top:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:860px){ .acctbar{padding:14px 16px 0;margin-top:26px} .acctbar .btn{min-height:44px} }
@media (min-width:861px){ .acctbar{display:none} }   /* desktop already has Log out in the top nav */

.cx{font-family:var(--ut);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--verdigris);border:1px solid var(--verdigris);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.pickhead{font-size:16px;font-weight:700;margin:26px 0 4px}
.picksub{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.qcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);
  border-radius:8px;padding:16px 17px;transition:border-color .15s,transform .12s;touch-action:manipulation}
.qcard:active{transform:scale(.98)}
.qcard .qa{font-family:var(--ar);font-size:20px;direction:rtl;line-height:1.7;color:var(--rubric)}
.qcard .qt{font-size:15.5px;font-weight:600;margin-top:2px}
.qcard .qd{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.qcard .qm{font-family:var(--ut);font-size:10.5px;color:var(--ink-soft);margin-top:9px;padding-top:8px;border-top:1px solid var(--rule)}
.qcard .qm b{color:var(--rubric)}
/* Was background:var(--ink);color:var(--paper) — an intentional light/dark
   inversion in light mode, but --ink and --paper swap meaning under dark mode
   too, so the "inverted" card re-inverted itself back to a bright cream block
   sitting oddly on the dark page instead of popping the way it should.
   var(--card)/var(--ink) stays in the same surface family as the rest of the
   page in both themes; the verdigris border plus the accent-colored button
   below are what make this one read as the primary action. */
.bigcta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--card);color:var(--ink);border:1px solid var(--verdigris);border-radius:8px;padding:18px 20px;margin:22px 0 4px;text-decoration:none;
  transition:transform var(--press,120ms) var(--ease-out,ease-out);touch-action:manipulation}
.bigcta:active{transform:scale(.98)}
.bigcta .bc-t{font-size:17px;font-weight:600}
.bigcta .bc-d{font-size:13px;opacity:.72;margin-top:3px}
.bigcta .bc-go{background:var(--verdigris);color:#fff;border-radius:5px;padding:11px 20px;font-size:14.5px;white-space:nowrap}
.plist{display:grid;gap:12px;margin-top:22px}
.prow{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);
  border-radius:12px;padding:16px 16px 16px 14px;transition:transform var(--press,120ms) var(--ease-out,ease-out),border-color .15s;touch-action:manipulation}
.prow:active{transform:scale(.985)}
.prow .pi{font-size:26px;width:40px;text-align:center;flex:0 0 auto}
.prow .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .pt>b{font-size:16.5px}
.prow .pd{font-size:13px;color:var(--ink-soft);line-height:1.4}
.prow .pm{font-family:var(--ut);font-size:10.5px;color:var(--ink-soft);margin-top:4px}
.prow .pm b{color:var(--rubric)}
.prow .pgo{font-size:26px;color:var(--verdigris);flex:0 0 auto}
.prow:first-child{border-color:var(--verdigris)}
.pback{display:inline-block;margin:26px 0 6px;color:var(--verdigris);text-decoration:none;font-size:15px;padding:6px 0}
.ph1{font-size:clamp(21px,4.4vw,26px);font-weight:700;margin:4px 0 6px}
.pintro{color:var(--ink-soft);font-size:14.5px;margin:0 0 18px;max-width:60ch}
@media (max-width:860px){ .qgrid{grid-template-columns:minmax(0,1fr)} .bigcta{flex-direction:column;align-items:stretch}
  .bigcta .bc-go{text-align:center} }
.stat{font-family:var(--ut);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.stat b{color:var(--rubric);font-weight:600}
.stat.none{color:var(--ink-soft)}
@media (max-width:640px){.tiles{grid-template-columns:minmax(0,1fr)}}

/* Spelling bee (spelling.js) */
.sb-top{display:flex;justify-content:space-between;font-family:var(--ut);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin:4px 0 8px}
.sb-top b{color:var(--rubric);font-variant-numeric:tabular-nums}
/* one segment per word: fills green/red as each is answered; the current one is outlined */
.sb-bar{display:flex;gap:4px;margin:0 0 12px}
.sb-bar span{flex:1;height:6px;border-radius:3px;background:var(--rule);transition:background var(--settle) var(--ease-out),box-shadow var(--settle) var(--ease-out)}
.sb-bar span.ok{background:var(--verdigris)}
.sb-bar span.no{background:var(--rubric)}
.sb-bar span.cur{box-shadow:0 0 0 1.5px var(--ink)}
/* a new word or verdict settles in rather than cutting (site.css turns this off for reduced motion) */
@keyframes sb-in{from{opacity:0;transform:translateY(6px)}}
.sb-in{animation:sb-in var(--settle) var(--ease-out)}
@keyframes sb-shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.sb-card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:22px 20px 20px}
.sb-prompt{text-align:center;margin-bottom:6px}
.sb-pic{font-size:44px;line-height:1.2}
.sb-en{font-size:20px;font-weight:600;margin-top:4px}
.sb-how{font-size:13px;color:var(--ink-soft);margin-top:6px}
.sb-listen{font-size:34px;width:76px;height:76px;border-radius:50%;border:1px solid var(--verdigris);background:var(--paper);cursor:pointer;touch-action:manipulation}
.sb-listen.speaking{background:var(--verdigris)}
.sb-hint{display:inline-block;margin-top:8px;font-size:13px;color:var(--verdigris);text-decoration:underline;cursor:pointer}
/* respond the instant a finger lands, like every .btn */
.sb-listen,.sb-word,.sb-hint{transition:transform var(--press) var(--ease-out),opacity var(--press) var(--ease-out);user-select:none;-webkit-user-select:none}
.sb-listen:active{transform:scale(.94)}
.sb-word:active{transform:scale(.97)}
.sb-hint:active{opacity:.55}
.sb-links{margin-top:8px;font-size:13px;color:var(--ink-soft)}
.sb-links .sb-hint{margin-top:0}
.sb-card .ansrow{display:flex;gap:8px;margin-top:12px;position:relative}
.sb-card .ansrow .btn{flex:0 0 auto;min-height:44px}
.sb-card input.ar-in{flex:1;min-width:0;font-family:var(--ar);font-size:24px;line-height:1.7;direction:rtl;text-align:right;
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;color:var(--ink)}
.sb-card input.ar-in:focus{border-color:var(--verdigris);outline:none}
.sb-card input.ar-in:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.sb-card input.ar-in{transition:border-color var(--settle) var(--ease-out),background var(--settle) var(--ease-out)}
.sb-card input.ar-in.is-ok{border-color:var(--verdigris);background:rgba(46,114,99,.09)}
.sb-card input.ar-in.is-no{border-color:var(--rubric);background:rgba(180,50,42,.07);animation:sb-shake 320ms var(--ease-out)}
.sb-card input.ar-in.is-near{border-color:var(--gold)}
.sb-out{min-height:8px}
.sb-msg{font-size:14px;color:var(--ink-soft);margin:12px 0 0}
.sb-near{color:var(--gold,#9a7b1c)}
.sb-verdict{font-size:16px;font-weight:600;margin:14px 0 6px}
.sb-verdict.ok{color:var(--verdigris)} .sb-verdict.no{color:var(--rubric)}
.sb-full{font-family:var(--ut);font-size:10.5px;letter-spacing:.06em;color:var(--verdigris);border:1px solid var(--verdigris);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.sb-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.sb-lab{font-family:var(--ut);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);min-width:84px}
.sb-ar{font-family:var(--ar);font-size:24px;direction:rtl;line-height:1.8}
.sb-ar .ok{color:var(--verdigris)} .sb-ar .no{color:var(--rubric);text-decoration:underline}
.sb-word{font-family:var(--ar);font-size:22px;line-height:1.7;direction:rtl;background:none;border:none;color:var(--ink);cursor:pointer;padding:0}
.sb-gloss{font-size:13px;color:var(--ink-soft)}
.sb-note{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0}
.sb-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sb-actions .btn{flex:1;min-height:44px;text-align:center}
.sb-empty{font-size:14.5px;line-height:1.55;margin:0 0 14px}
.sb-end{text-align:center}
.sb-big{font-size:40px;font-weight:700;color:var(--verdigris);line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sb-best{font-size:14.5px;margin:10px 0 0}
.sb-miss{text-align:left;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
/* Arabic keyboard (arkb.js) */
.arkb{position:absolute;z-index:200;background:rgba(var(--paper-rgb,241,236,224),.85);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 28px -10px rgba(var(--ink-rgb,23,38,43),.4);padding:10px;display:none;max-width:360px}
.arkb.on{display:block}
.arkb-row{display:flex;gap:4px;margin-bottom:4px;justify-content:center}
.arkb-key{font-family:var(--ar);font-size:17px;line-height:1;min-width:30px;min-height:38px;
  border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);cursor:pointer;padding:0 2px}
.arkb-key:active{background:var(--verdigris);color:#fff;border-color:var(--verdigris)}
.arkb-harakat{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap;justify-content:center;border-top:1px dashed var(--rule);padding-top:8px}
.arkb-hk{font-size:15px;color:var(--rubric);min-width:34px}
.arkb-bottom{display:flex;gap:6px;margin-top:4px}
.arkb-wide{flex:1;font-family:var(--la);font-size:12.5px;min-height:38px}
@media (max-width:860px){
  .arkb{position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;border-radius:14px 14px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .arkb-key{min-width:8.6vw;min-height:42px;font-size:18px}
}

/* Pointer devices only — :hover sticks after a tap on touchscreens. */
@media (hover:hover) and (pointer:fine){

.tile:hover{transform:translateY(-2px);border-color:var(--verdigris)}
.qcard:hover{border-color:var(--verdigris);transform:translateY(-1px)}
.prow:hover{border-color:var(--verdigris)}
}
</style>

    <h1>Practise</h1>
    <p>Extra practice alongside your lessons. Your lessons and daily review are on Home.</p>

</main>
<script src="vocab-data.js?v=20260928"></script>

<script>
/* Both apps keep their own schedule; the dashboard just reports on each. */
const DAY=86400000, dayNow=Math.floor(Date.now()/DAY), iso=new Date().toISOString().slice(0,10);
function read(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(_){return null}}


(async function whoAmI(){
  const el=document.getElementById('whoami'); if(!el) return;
  let name=''; try{name=localStorage.getItem('bay_name')||''}catch(e){}
  if(typeof sb!=='undefined' && sb){
    try{const {data}=await sb.auth.getUser(); if(data&&data.user) name=name||data.user.email||''}catch(e){}
  }
  el.textContent = name? ('Signed in as '+name) : 'Account';
})();

const seen=id=>typeof Progress!=='undefined'&&Progress.hasSeen(id);
(async function picker(){
  // progress.js loads further down the page; wait for it before marking scenes done
  if(document.readyState!=='complete') await new Promise(r=>addEventListener('load',r,{once:true}));
  if(typeof Progress!=='undefined') await Progress.init();
  const el=document.getElementById('picker');
  if(!el) return;
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const met=window.RafiqPath?RafiqPath.metWords():new Set();
  const wDue=[...met].filter(id=>Progress.isDue('v:'+id)).length;
  const cards=[
    {href:'verbs.html?tab=drill', ar:'أَفْعال', t:'Verbs',
     d:'Past, present and future of 21 common verbs \u2014 table, drill, then in a sentence.',
     m:'21 verbs \u00b7 18 forms each'},
    {href:'connectors.html?tab=ex', ar:'رَوابِط', t:'Joining words',
     d:'\u062B\u064F\u0645\u0651 \u00b7 \u0644\u0623\u0646\u0651 \u00b7 \u0644\u0643\u0646\u0651 \u2014 link ideas, ask questions, give opinions.',
     m:'53 joining words \u00b7 24 exercises'},
    {href:'vocab.html', ar:'مُفْرَدات', t:'Your words',
     d:'Flashcards and a quick test on the words you\u2019ve met in your lessons, plus the full word list.',
     m: met.size ? (wDue?`<b>${wDue}</b> due \u00b7 `:'')+`${met.size} words met` : 'Words from your lessons show up here'}
  ];
  const done=window.RafiqPath?RafiqPath.units().filter(p=>!p.alpha && RafiqPath.unitDone(p)):[];
  const redo = done.length
    ? `<div class="qgrid">${done.map(p=>`<a class="qcard" href="session.html?unit=${p.n}&redo=1">
        <div class="qa">${esc(p.ar)}</div><div class="qt">Unit ${+p.n}: ${esc(p.en)}</div>
        <div class="qm">${RafiqPath.placed(p.n)?'Skipped at sign-up \u2014 check yourself':'Words and sentences \u00b7 about 8 minutes'}</div></a>`).join('')}</div>`
    : `<p class="picksub">Units you finish on your path will appear here for extra rounds.</p>`;
  const scDone=SCENES.filter(x=>seen('x:'+x.id)).length;
  /* One button per kind of practice; each opens its own view (#beyond,
     #scenes, #redo) so the page stays short. */
  const SECTIONS={
    beyond:{icon:'📚', t:'Beyond the lessons', cx:'',
      d:'Verbs, joining words and flashcards of your words',
      m: met.size&&wDue ? `3 areas · <b>${wDue}</b> words due` : '3 areas',
      intro:'Practise the building blocks the lessons only touch on: verb forms, the words that join ideas together, and flashcards of every word you’ve met.',
      body:()=>`<div class="qgrid">`+cards.map(c=>`<a class="qcard" href="${c.href}">
        <div class="qa">${c.ar}</div><div class="qt">${c.t}</div>
        <div class="qd">${c.d}</div><div class="qm">${c.m}</div></a>`).join('')+`</div>`},
    scenes:{icon:'🌍', t:'Real-life scenes', cx:'Complete',
      d:'The airport, the doctor, the masjid, a restaurant, a taxi and a family visit',
      m:`${SCENES.length} scenes`+(scDone?` · <b>${scDone}</b> done`:'')+' · about 5 minutes each',
      intro:'Short conversations for situations you’ll really meet. The other person speaks first and you reply in your own words — any reply that fits is fine, and you’ll get feedback on the Arabic.',
      body:()=>`<div class="qgrid">${SCENES.map(x=>`<a class="qcard" href="learn.html?scene=${x.id}">
        <div class="qa">${x.pic} ${x.ar}</div><div class="qt">${x.en}</div><div class="qd">${x.d}</div>
        <div class="qm">${seen('x:'+x.id)?'<b>✓</b> done — try it again':'5 replies · about 5 minutes'}</div></a>`).join('')}</div>`},
    redo:{icon:'🔁', t:'Redo a unit', cx:'',
      d:'Extra rounds on units you’ve finished',
      m: done.length ? `${done.length} unit${done.length===1?'':'s'} ready` : 'Finish a unit to unlock it',
      intro:'A fresh mix of a finished unit’s words and sentences each time — good before moving on, or to refresh an older unit.',
      body:()=>redo},
    spelling:{icon:'🐝', t:'Spelling bee', cx:'',
      d:'Hear a word or see its meaning, then type it in Arabic',
      get m(){ const n=RafiqSpelling.pool().length, b=RafiqSpelling.best();   // a getter, so a new best shows on return
        return n<4 ? 'Unlocks after a few lessons' : `${n} words ready`+(b?` · best <b>${b.score}/${b.total}</b>`:''); },
      intro:'Spell words from your lessons. Right letters pass; vowel marks earn a bonus.',
      body:()=>`<div id="spelling"></div>`,
      mount:()=>RafiqSpelling.mount(document.getElementById('spelling'))},
    salah:{icon:'🕌', t:'Your salah', cx:'',
      d:'Practise the words of your prayer',
      get m(){ const S=RafiqSalah, n=S.next(), c=S.counts(); return n ? `Next: ${n.title} · <b>${c.known}</b> of ${c.total} words understood` : `Every part done · <b>${c.known}</b> of ${c.total} words`; },
      intro:'Keep the words of your prayer fresh. Each answer feeds your salah review.',
      body:()=>{ const S=RafiqSalah, n=S.next(), b=(()=>{ try{ return +localStorage.getItem('rafiq_salah_top50')||0; }catch(_){ return 0; } })();
        const cards=[
          {href:'salah.html', ar:'🕌 صَلاتُكَ', t:n?'Continue your salah':'Your salah', d:n?`Next: ${n.title}`:'Every part done: reopen any part', m:'The track, the map and review'},
          {href:'learn.html?salah=prayalong', ar:'🤲 مَعَ الصَّلاةِ', t:'Pray along', d:'The whole prayer at praying pace, each word lit with its meaning', m:'Open it just before you pray'},
          {href:'learn.html?salah=top50', ar:'⭐ ٥٠', t:'Your 50 most-said words', d:'They make up three-quarters of what you say', m:b?`Best: <b>${b}</b> of 20`:'20 questions'},
          {href:'learn.html?salah=quiz', ar:'💬 الْمَعْنى', t:'Pick the meaning', d:'Words from the parts you’ve done', m:'10 questions'},
          {href:'learn.html?salah=listen', ar:'👂 اسْمَعْ', t:'Hear it, pick the word', d:'Listen and choose the word you heard', m:'10 questions'}];
        // everything but the track itself is Complete (salah.js); Essentials sees what it would get
        if(!S.complete()) cards.slice(1).forEach(c=>{ c.href='plans.html'; c.m='Complete'; });
        return `<div class="qgrid">`+cards.map(c=>`<a class="qcard" href="${c.href}"><div class="qa">${c.ar}</div><div class="qt">${c.t}</div>
          <div class="qd">${c.d}</div><div class="qm">${c.m}</div></a>`).join('')+`</div>`; }},
    essentials:{icon:'📅', t:'Everyday essentials', cx:'',
      d:'Numbers, days, months, colours and telling the time',
      get m(){ const n=ESSENTIALS.reduce((a,s)=>a+RafiqEssentials.known(s),0);
        return `${ESSENTIALS.length} sets · tap to hear`+(n?` · <b>${n}</b> known`:''); },
      intro:'The everyday basics in one place: a table to look things up in, and a short drill for each.',
      body:()=>`<div id="essentials"></div>`,
      mount:()=>RafiqEssentials.mount(document.getElementById('essentials'))}
  };
  const row=(href,x)=>`<a class="prow" href="${href}"><span class="pi">${x.icon}</span>
      <span class="pt"><b>${x.t}${x.cx?` <span class="cx">${x.cx}</span>`:''}</b><span class="pd">${x.d}</span><span class="pm">${x.m}</span></span>
      <span class="pgo">›</span></a>`;
  const hero=document.querySelector('.hero');
  let fromMenu=false;
  function paint(){
    const k=location.hash.slice(1), sec=SECTIONS[k];
    if(hero) hero.style.display = sec ? 'none' : '';
    if(sec){
      el.innerHTML=`<a class="pback" href="#">‹ Practise</a>
        <h1 class="ph1">${sec.icon} ${sec.t}${sec.cx?` <span class="cx">${sec.cx}</span>`:''}</h1>
        <p class="pintro">${sec.intro}</p>`+sec.body();
      // back to the menu: undo the step we took from it, or replace this view if we landed here directly
      el.querySelector('.pback').onclick=e=>{ e.preventDefault();
        if(fromMenu){ history.back(); } else { history.replaceState(null,'',location.pathname); paint(); } };
      if(sec.mount) sec.mount();
      scrollTo(0,0); return;
    }
    const S=window.RafiqSalah, salah = S && S.enabled() ? row('#salah',SECTIONS.salah) : '';
    el.innerHTML=`<div class="plist">`+salah+
      row('session.html?focus=weak',{icon:'🎯', t:'Weak-spots review', cx:'Complete',
        d:'Exercises picked for the mistakes you keep making', m:'About 5 minutes'})+
      row('#spelling',SECTIONS.spelling)+row('#essentials',SECTIONS.essentials)+row('#beyond',SECTIONS.beyond)+row('#scenes',SECTIONS.scenes)+row('#redo',SECTIONS.redo)+`</div>`;
    el.querySelectorAll('.prow[href^="#"]').forEach(a=>a.addEventListener('click',()=>{ fromMenu=true; }));
  }
  addEventListener('hashchange',paint);
  paint();
})();


</script>
