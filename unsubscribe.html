<style>
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:32px 36px;width:min(420px,100%)}
.card .label{margin-bottom:14px}
.card p{margin:0 0 18px;line-height:1.6}
.card .btn{display:inline-block}
</style>
</head>
<body>
<main class="screen">
  <div class="card">
    <div class="label">Reminder emails</div>
    <p id="msg">Turning off reminder emails…</p>
    <a class="btn" href="settings.html">Open Settings</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=9"></script>
<script>
/* The link at the bottom of every reminder email: unsubscribe.html?t=<token>.
   No sign-in needed; the token stops reminder emails for that account only
   (notifications stay on if they were on). */
(async () => {
  const msg = document.getElementById('msg');
  const t = new URLSearchParams(location.search).get('t') || '';
  if (!/^[0-9a-f-]{36}$/i.test(t)) { msg.textContent = "This link isn't complete. You can turn reminders off in Settings."; return; }
  try {
    const { data, error } = await sb.rpc('reminders_unsubscribe', { token: t });
    if (error) throw error;
    msg.textContent = data ? "Done. You won't get reminder emails any more. You can turn them back on in Settings at any time."
                           : "This link has already been used or has expired. You can turn reminders off in Settings.";
  } catch (_) {
    msg.textContent = "Something went wrong. Please try again, or turn reminders off in Settings.";
  }
})();
</script>
</body>
