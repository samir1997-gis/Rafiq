name: Supabase users

on:
  workflow_dispatch:
    inputs:
      command:
        description: "list (read only) | active (read only) | billing-test (read only) | billing-clear-test | delete | reset-preview (read only) | reset | signout"
        required: true
        default: "list"
      arg:
        description: "list: days to look back (default 3) · active: days (default 14) · billing-clear-test: type CLEAR-TEST-BILLING · delete: account ids, comma-separated (max 5) · reset: type RESET-BETA · signout: type SIGN-OUT-ALL"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CMD: ${{ inputs.command }}
          ARG: ${{ inputs.arg }}
        run: node tools/supabase-users.js "$CMD" "$ARG"
