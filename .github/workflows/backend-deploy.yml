name: Backend deploy

# The server side in Supabase: database setup (supabase/sql/backend.sql), function
# secrets, and the Edge Functions in supabase/functions. Runs when they change on
# main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/sql/**', 'supabase/config.toml', 'tools/backend-deploy.js']

permissions:
  contents: read

concurrency: backend-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Database and secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_RECITATION_ID: ${{ vars.QF_RECITATION_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/backend-deploy.js
      - name: Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2 functions deploy account admin-stats billing emails quran stripe-webhook support tutor --project-ref gaajfahtrbdybjuunfhe --use-api
