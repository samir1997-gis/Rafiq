name: App build
# The Android app (#35): builds it from app/ so every change is checked to compile; a debug APK to install on a phone
# (Actions → this run → Artifacts). The iPhone app builds on Codemagic (codemagic.yaml): GitHub never gave this repo a Mac.
on:
  workflow_dispatch:
  push:
    branches: [wip]
    paths: ['app/**', '.github/workflows/app-build.yml']   # or run it by hand after website changes

concurrency:            # a newer push replaces a build still waiting or running
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the web part and sync
        working-directory: app
        run: npm ci && node build-web.js && npx cap sync android
      - name: Gradle debug build
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

