name: App build
# The iPhone and Android app (#35): builds both from app/ so every change is checked to compile.
# Android: a debug APK to install on a phone (Actions → this run → Artifacts). iPhone: a simulator build, no signing yet
# (TestFlight needs the Apple Developer account, then signing keys as secrets).
on:
  workflow_dispatch:
  push:
    branches: [wip]
    paths: ['app/**', '.github/workflows/app-build.yml']   # or run it by hand after website changes

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the web part and sync
        working-directory: app
        run: npm ci && node build-web.js && npx cap sync android
      - name: Gradle debug build
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the web part and sync
        working-directory: app
        run: npm ci && node build-web.js && npx cap sync ios
      - name: Simulator build (no signing)
        working-directory: app/ios/App
        run: set -o pipefail; xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
