name: Render audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "ElevenLabs voice ID"
        required: true
      buckets:
        description: "What to render: dialogue,vocab  (blank = everything)"
        required: false
        default: "dialogue,vocab"
      limit:
        description: "Max clips this run (5 to test, 0 = no limit)"
        required: false
        default: "5"
      strip:
        description: "Remove vowel marks before sending? (yes/no)"
        required: false
        default: "no"
      ids:
        description: "Only the clips listed in this file (one id per line), e.g. tools/rerecord-path-words.txt"
        required: false
        default: ""
      rerecord:
        description: "Re-record clips that already exist, e.g. for a new voice? (yes/no)"
        required: false
        default: "no"
      pausal:
        description: "Say the last word of each phrase without its case ending, as Arabic is said at a stop (yes/no)"
        required: false
        default: "yes"
      model:
        description: "ElevenLabs model"
        required: false
        default: "eleven_multilingual_v2"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the manifest
        run: node tools/build-manifest.js

      - name: Render clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          ARGS="--voice ${{ inputs.voice }} --model ${{ inputs.model }}"
          if [ -n "${{ inputs.buckets }}" ]; then ARGS="$ARGS --only ${{ inputs.buckets }}"; fi
          if [ "${{ inputs.limit }}" != "0" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.strip }}" = "yes" ]; then ARGS="$ARGS --strip"; fi
          if [ -n "${{ inputs.ids }}" ]; then ARGS="$ARGS --ids ${{ inputs.ids }}"; fi
          if [ "${{ inputs.rerecord }}" = "yes" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.pausal }}" != "no" ]; then ARGS="$ARGS --pausal"; fi
          node tools/render-elevenlabs.js $ARGS

      - name: Commit the audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio audio-manifest.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Render audio clips"
            git pull --rebase --autostash
            git push
          fi
