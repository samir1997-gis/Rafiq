<script>
DATA.forEach(u=>Object.assign(u,EXTRA[u.n]||{}));
const glue=(a,s)=>a+(s.startsWith('،')?'':' ')+s, joinAr=a=>a.reduce(glue);
const say=(t,el)=>RQ.speak(t,el);

/* ── progress: one Supabase-backed store for all four sections ── */
const ID={ word: w=>'v:'+w.id, drill: x=>'d:'+x.id };
// Verbs and joining words are self-service practice, not scheduled review —
// so they are not tracked in the shared store at all.

/* ── build a mixed queue across all four sections ── */
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const FIELD={transform:'transforms',cloze:'cloze',fix:'fix',build:'builds'};
function drillPool(){
  const out=[];
  DATA.forEach(u=>Object.keys(FIELD).forEach(m=>(u[FIELD[m]]||[]).forEach((d,i)=>
    out.push({kind:'sentences',mode:m,id:u.n+'|'+m+'|'+i,unit:u,d}))));
  DATA.forEach(u=>u.dialogue.forEach((line,i)=>
    out.push({kind:'sentences',mode:'produce',id:u.n+'|produce|'+i,unit:u,d:{ar:line[1],en:line[2]}})));
  return out;
}
// a sentence exercise done: schedule it and count it for today
function gradeDrill(id,q){ Progress.grade(id,q); RafiqPath.sentenceDone(); }
function build(n){
  return UNIT ? buildUnit(n) : buildReview(n);
}

/* A lesson's Practise step (?unit=NN): that unit's words and exercises. */
function buildUnit(n){
  const share = k => Math.max(1, Math.round(n*k));
  const unitWords = new Set((PATH.find(p=>p.n===UNIT)||{words:[]}).words);
  const met  = VOCAB.filter(w=>!Progress.isNew(ID.word(w)) && unitWords.has(w.id));
  const wDue = met.filter(w=>Progress.isDue(ID.word(w)));
  const words = shuffle(wDue).slice(0, share(0.35))
    .concat(shuffle(met.filter(w=>!Progress.isDue(ID.word(w)))).slice(0, Math.max(0, share(0.35)-wDue.length)))
    .map(w=>({kind:'words', mode:'word', w}));
  let dp     = drillPool().filter(x=>x.unit.n===UNIT);
  // teach first (#156): in the early units, only exercises made (almost) entirely of words already taught
  if(RafiqPath.teaches(UNIT) && window.RafiqTeach){
    const k=RafiqTeach.taught(UNIT), d=x=>x.d;
    const text=x=>x.mode==='cloze'?d(x).q.replace('___',' ')+' '+(d(x).o||[]).join(' ')
      :x.mode==='fix'?d(x).bad+' '+d(x).good:x.mode==='transform'?d(x).src+' '+d(x).ans
      :x.mode==='build'?d(x).parts.join(' '):(d(x).ar||'');
    dp=dp.filter(x=>RafiqTeach.coverage(text(x),k)>=0.8);
  }
  const dDue = dp.filter(x=>Progress.isDue(ID.drill(x)));
  // a normal Practise step tops up with new exercises; redoing a finished
  // unit (?redo=1, from Practise) draws on all of the unit's exercises
  const dMore = REDO ? dp.filter(x=>!Progress.isDue(ID.drill(x))) : dp.filter(x=>Progress.isNew(ID.drill(x)));
  const sentences = shuffle(dDue).slice(0, share(0.35))
    .concat(shuffle(dMore).slice(0, Math.max(0, n-words.length-Math.min(dDue.length, share(0.35)))));
  return shuffle(words.concat(sentences)).slice(0,n);
}

/* Review (Home's "Review" and Practise's "Mixed review"): a random mix of
   only what the learner has done on their path — words met in lessons and
   sentence exercises already practised, from units reached. Nothing new,
   and nothing from the Practise area. Due items come first, then the rest
   of what's been learned tops it up. */
function buildReview(n){
  const sc = RafiqPath.reviewScope();
  const words = VOCAB.filter(w=>sc.wordIds.has(w.id) && !Progress.isNew(ID.word(w)))
    .map(w=>({kind:'words', mode:'word', w}));
  const sentences = drillPool().filter(x=>sc.units.has(x.unit.n) && Progress.get(ID.drill(x)));
  const idOf = it => it.w ? ID.word(it.w) : ID.drill(it);
  // each kind: due first, then the rest, both in random order
  const line = list => shuffle(list.filter(it=>Progress.isDue(idOf(it))))
                        .concat(shuffle(list.filter(it=>!Progress.isDue(idOf(it)))));
  const a = line(words), b = line(sentences), out = [];
  // alternate so it's a real mix of words and sentences, not one then the other
  while(out.length < n && (a.length || b.length)){
    if(a.length) out.push(a.shift());
    if(out.length < n && b.length) out.push(b.shift());
  }
  return shuffle(out);
}

/* ── shared bits ── */
function norm(s){return (s||'').replace(/[\u064B-\u0652\u0670\u0640\u0653-\u0656]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه')
  .replace(/[^\u0621-\u064A\s]/g,' ').replace(/\s+/g,' ').trim()}
function lcs(t,s){const n=t.length,m=s.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=t[i-1]===s[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const mk=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(t[i-1]===s[j-1]){mk[i-1]=true;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}return mk}
function diffHTML(target,said){
  const orig=target.split(/\s+/).filter(Boolean), pairs=orig.map(w=>[w,norm(w)]).filter(p=>p[1]);
  const mk=lcs(pairs.map(p=>p[1]),norm(said).split(' ').filter(Boolean));
  return{html:pairs.map((p,i)=>`<span class="${mk[i]?'ok':'no'}">${p[0]}</span>`).join(' '),
         score:pairs.length?Math.round(100*mk.filter(Boolean).length/pairs.length):0}}
function tappable(el,t){el.style.cursor='pointer';el.onclick=()=>say(t,el);return el}
function taskBar(en,ar){const d=document.createElement('div');d.className='taskbar';
  d.innerHTML=`<span class="t-en">${en}</span>`+(ar?`<span class="t-ar">${ar}</span>`:'');return d}
/* check(typed) → Promise<{verdict,why}|null>: a judge.js call that decides on
   meaning. Verb forms pass none, since there the exact form is being tested. */
function answerRow(target,check){
  const w=document.createElement('div'), row=document.createElement('div');row.className='ansrow';
  const inp=document.createElement('input');inp.className='ar-in';inp.dir='rtl';inp.placeholder='اكْتُبْ هُنا';
  const b=document.createElement('button');b.className='btn';b.textContent='Check';
  const out=document.createElement('div');
  let seq=0;
  const run=t=>{const{html,score}=diffHTML(target,t);
    out.innerHTML=`<div class="diff">${html}</div><div class="score">${score}% matched</div>`;
    if(!check||!t.trim()||!window.RafiqJudge||!RafiqJudge.on)return;
    const line=out.querySelector('.score'),mine=++seq;
    line.textContent='Checking…';
    check(t).then(v=>{
      if(mine!==seq)return;
      if(!v){line.textContent=score+'% matched';return}
      line.className='score '+(v.verdict==='right'?'v-ok':v.verdict==='wrong'?'v-no':'');if(v.verdict!=='close')window.RafiqSound&&RafiqSound.answer(v.verdict==='right');

    })};
  b.onclick=()=>run(inp.value); inp.onkeydown=e=>{if(e.key==='Enter')run(inp.value)};
  row.appendChild(inp);row.appendChild(b);w.appendChild(row);w.appendChild(out);return w}

   repeat mistake types (tags in item-tags.js) plus items they recently missed. */

function buildWeak(n){
  const counts=RafiqMistakes.counts();
  const top=Object.entries(counts).filter(([k,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>k);
  const units=new Set(RafiqPath.reached().map(p=>p.n));
  const dp=drillPool().filter(x=>units.has(x.unit.n));
  const tagged=shuffle(dp.filter(x=>top.includes(ITEM_TAGS[x.id])));
  const missed=shuffle(dp.filter(x=>{const r=Progress.get(ID.drill(x));return r&&r.box===1;}));
  const seen=new Set(), items=[];
  missed.concat(tagged).forEach(x=>{ if(!seen.has(x.id)&&items.length<n){ seen.add(x.id); items.push(x); } });
  if(!items.length) return [];
  const intro=top.length?[{kind:'weak',mode:'intro',help:RafiqMistakes.HELP[top[0]]}]:[];
  return intro.concat(shuffle(items));
}

/* Units 1–3 (the "tiles" and "mixed" answer styles): "Find the mistake" and the
   rewrite exercises are built from word tiles, with the word that has to change
   among them as a decoy. Chosen with TypeSafe (tools/typesafe-exp/early_answers.py,

function wordsOf(ar){ const w=[]; ar.split(/\s+/).filter(Boolean).forEach(t=>{ if(!t.replace(PUNCT,'')&&w.length) w[w.length-1]+=t; else w.push(t); }); return w; }

function changedWords(from,to){ const bare=s=>s.replace(PUNCT,''), keep=new Set(wordsOf(to).map(bare));
  return [...new Set(wordsOf(from).filter(x=>bare(x)&&!keep.has(bare(x))))]; }

function tileDrill(c, it, target, decoys, why){
  const n=it.unit.n, style=RafiqPath.answerStyle(n);

  if(why){ const w=document.createElement('div'); w.className='why'; w.textContent=why; box.appendChild(w); }
  if(tr){ const t=document.createElement('div'); t.className='tr'; t.textContent=tr; box.appendChild(t); }
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='Show the answer'; btn.style.cssText='width:100%;margin-top:12px';
  const swap=document.createElement('button'); swap.type='button'; swap.className='swap'; swap.textContent='Type it instead';
  let answered=false;
  const settle=ok=>{ if(answered) return; answered=true;
    const q=ok?'good':'again'; tally[q]++; if(!ok) kindWrong[it.kind]++;
    gradeDrill(ID.drill(it),q); RafiqPath.answered(n,style,ok);
    btn.remove(); swap.remove(); box.style.display='block'; c.appendChild(nextRow()); };
  const tl=RafiqTiles.create({parts:wordsOf(target), extra:decoys, en:tr, say, onCorrect:r=>settle(r.firstTry)});
  c.appendChild(tl.el);
  btn.onclick=()=>{ tl.reveal(); say(target,tl.el.querySelector('.tl-line')); settle(false); };
  swap.onclick=()=>{ it.typed=true; vDrill(it,c); };

/* "Say this in Arabic" (build and produce items). Word tiles in the early
   units, typing later (RafiqPath.answerStyle); either card can switch to the
   other for this one sentence. A tile answer is graded for you and never
   counts as "easy": right first time is "good", anything else "again". */
const PUNCT=/[؟?!.،,:]/g, lettersOf=s=>norm(s).replace(/\s/g,'');
function sayParts(it){
  if(it.mode==='build') return it.d.parts;
  // a conversation line: its words, punctuation kept with the word before, long lines in about 7 pieces
  const w=[]; it.d.ar.split(/\s+/).filter(Boolean).forEach(t=>{ if(!t.replace(PUNCT,'') && w.length) w[w.length-1]+=t; else w.push(t); });
  const size=Math.ceil(w.length/7), out=[];
  for(let i=0;i<w.length;i+=size) out.push(w.slice(i,i+size).join(' '));
  return out;
}
function edits(a,b){
  const d=Array.from({length:a.length+1},(_,i)=>[i].concat(new Array(b.length).fill(0)));
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
/* Pieces that don't belong: other words from the same unit that look a bit
   like words in this sentence. Never a word one letter away from one of them
   (طالِب/طالِبَة, أَنْتَ/أَنْتِ), which could be right too. */
function decoys(it, parts){
  const u=it.unit, pool=new Set();
  (u.builds||[]).forEach(b=>b.parts.forEach(p=>p.split(/\s+/).forEach(t=>pool.add(t.replace(PUNCT,'')))));
  (u.dialogue||[]).forEach(l=>l[1].split(/\s+/).forEach(t=>pool.add(t.replace(PUNCT,''))));
  const mine=parts.join(' ').split(/\s+/).map(lettersOf).filter(Boolean);
  const seen=new Set(), cands=[];
  pool.forEach(t=>{ const l=lettersOf(t);
    if(l.length<2 || seen.has(l)) return; seen.add(l);
    const near=Math.min(...mine.map(m=>edits(l,m)));
    if(near<=1 || mine.some(m=>m.includes(l)||l.includes(m))) return;
    cands.push({t, near}); });
  cands.sort((a,b)=>a.near-b.near);
  return shuffle(cands.slice(0,6)).slice(0, parts.length<=3 ? 1 : 2).map(x=>x.t);
}
function vSay(it, forced, old){
  const d=it.d, n=it.unit.n, style=forced||RafiqPath.answerStyle(n);
  const parts=sayParts(it), model=it.mode==='build' ? joinAr(parts) : d.ar;
  const c=document.createElement('div'); c.className='card';
  c.appendChild(taskBar('Say this in Arabic','قُلْها بِالْعَرَبِيَّةِ'));
  c.insertAdjacentHTML('beforeend',`<div class="qen">${d.en}</div>`);
  const swap=document.createElement('button'); swap.type='button'; swap.className='swap';
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='Show the answer'; btn.style.cssText='width:100%;margin-top:12px';
  const box=document.createElement('div'); box.style.display='none';
  const g=document.createElement('div'); g.className='good'; g.textContent=model; box.appendChild(tappable(g,model));
  let answered=false;
  if(style==='type'){
    c.appendChild(answerRow(model,t=>RafiqJudge.produce(d.en,model,t)));
    swap.textContent='Use word tiles';
    swap.onclick=()=>vSay(it,'tiles',c);
    btn.onclick=()=>{ box.style.display='block'; btn.style.display='none'; swap.remove(); say(model,g);
      c.appendChild(rateRow(q=>{ gradeDrill(ID.drill(it),q); RafiqPath.answered(n,'type',q!=='again'); },it.kind)); };
  } else {
    // tiles first time right: graded for you, then on
    const settle=ok=>{
      if(answered) return; answered=true;
      const q=ok?'good':'again'; tally[q]++; if(!ok) kindWrong[it.kind]++;
      gradeDrill(ID.drill(it),q);
      const moved=RafiqPath.answered(n,style,ok);
      btn.remove(); swap.remove();
      if(moved==='up') c.insertAdjacentHTML('beforeend',`<div class="stage-note">${style==='tiles'
        ?'Five in a row! From now on this unit adds a piece or two that don\'t belong.'
        :'Five in a row! You\'ll type your answers in this unit from now on.'}</div>`);
      c.appendChild(nextRow());
    };
    const tl=RafiqTiles.create({parts, extra: style==='mixed' ? decoys(it,parts) : [], en:d.en, say,
      onCorrect:r=>settle(r.firstTry)});
    c.appendChild(tl.el);
    swap.textContent='Type it instead';
    swap.onclick=()=>vSay(it,'type',c);
    btn.onclick=()=>{ tl.reveal(); say(model,tl.el.querySelector('.tl-line')); settle(false); };
  }
  c.appendChild(btn); c.appendChild(box); c.appendChild(swap);
  if(old) old.replaceWith(c); else panel.appendChild(c);
}
Progress.init().then(()=>{
  if(REDO && !RafiqPath.unitDone(RafiqPath.units().find(p=>p.n===UNIT)||{n:'',words:[]})){ location.href='practise.html'; return; }
  if(UNIT && !RafiqPath.unitOpen(UNIT)){ location.href='dashboard.html'; return; }   // locked unit
  if(WEAK && !RafiqPlan.isComplete()){
    panel.innerHTML=`<div class="done"><div class="big">🎯</div><h2>Weak-spots review</h2>
      <p>A session built from your own repeat mistakes is part of Rafiq Complete.</p>
      <div class="nextrow"><a class="primary" href="plans.html">See Complete</a><a href="dashboard.html">Back to home</a></div></div>`;
    document.getElementById('count').textContent=''; return;
  }
  Q=WEAK ? buildWeak(10) : build(UNIT?10:LEN);
  if(!Q.length && WEAK){
    panel.innerHTML=`<div class="done"><div class="big">🎯</div><h2>No weak spots yet</h2>
      <p>Keep going with your lessons — when the same kind of mistake comes up, it'll be waiting here.</p>
      <div class="nextrow"><a class="primary" href="dashboard.html">Back to home</a></div></div>`;
    document.getElementById('count').textContent=''; return;
  }
  if(!Q.length){
    panel.innerHTML=`<div class="done"><div class="big">لا شَيْءَ بَعْدُ</div><h2>Nothing to review yet</h2>
      <p>Review only uses what you've learned on your path. Do your first lesson and it'll be waiting here.</p>
      <div class="nextrow"><a class="primary" href="dashboard.html">Go to your lessons</a></div></div>`;
    document.getElementById('count').textContent='';
    return;
  }
  render();
});
</script>
