<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="theme.js?v=2"></script>
<script src="pwa.js?v=2"></script>
<title>Rafiq — set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=901">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317262B'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23F1ECE0' font-family='serif'%3E%D8%B1%3C/text%3E%3Ccircle cx='46' cy='19' r='4' fill='%23B4322A'/%3E%3C/svg%3E">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1ECE0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1815">
<meta name="color-scheme" content="light dark">
<style>
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:32px 36px;width:min(380px,100%);text-align:left}
.card .label{margin-bottom:20px;text-align:center}
.field{margin-bottom:16px}
.field label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:5px}
.field input{width:100%;border:1px solid var(--rule);border-radius:3px;background:var(--paper);height:40px;padding:0 12px;font-family:var(--la);font-size:16px;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--verdigris)}
.card .btn{width:100%;margin-top:6px}
.btn[disabled]{opacity:.6;cursor:default}
.msg{margin-top:14px;font-size:13px;text-align:center;line-height:1.5;display:none}
.msg.show{display:block}
.msg.err{color:var(--rubric)}
.msg.ok{color:var(--verdigris)}
.msg a{color:var(--verdigris);text-decoration:underline}
#resetForm{display:none}
</style>
</head>
<body>
<main class="screen">
  <form class="card" id="resetForm" method="post" action="#">
    <!-- lets iPhone/Chrome save the new password against the right account -->
    <input id="rUser" name="username" type="email" autocomplete="username" tabindex="-1" aria-hidden="true" readonly style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <div class="label">Choose a new password</div>
    <div class="field"><label for="pw">New password</label><input id="pw" name="new-password" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label for="pw2">Type it again</label><input id="pw2" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required></div>
    <button class="btn" type="submit" id="saveBtn">Save new password</button>
  </form>
  <div class="msg show" id="msg">Checking your link…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=6"></script>
<script>
const form  = document.getElementById('resetForm');
const btn   = document.getElementById('saveBtn');
const msgEl = document.getElementById('msg');

function showMsg(html, kind){
  msgEl.innerHTML = html || '';
  msgEl.className = 'msg' + (html ? ' show '+(kind||'err') : '');
}
const NEW_LINK = 'That reset link has expired or was already used. <a href="login.html?mode=reset">Send a new one</a>.';

(async () => {
  // Supabase reports a bad link in the hash (implicit flow) or the query (PKCE)
  const p = new URLSearchParams(location.hash.slice(1));
  const q = new URLSearchParams(location.search);
  if (p.get('error') || q.get('error') || p.get('error_code') || q.get('error_code')) {
    history.replaceState(null, '', location.pathname);
    showMsg(NEW_LINK); return;
  }
  if (!sb) { showMsg('Couldn’t load the sign-in service. Please refresh the page.'); return; }
  // getSession waits for the client to read the recovery token from the link
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { showMsg(NEW_LINK); return; }
  document.getElementById('rUser').value = (data.session.user && data.session.user.email) || '';
  form.style.display = 'block';
  showMsg('');
  document.getElementById('pw').focus();
})();

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) { showMsg('Use at least 8 characters.'); return; }
  if (pw !== pw2)    { showMsg('The two passwords don’t match.'); return; }

  btn.disabled = true; btn.textContent = 'Saving…'; showMsg('');
  const { data, error } = await sb.auth.updateUser({ password: pw });
  if (error) {
    const m = (error.message||'').toLowerCase();
    if (m.includes('different from the old')) showMsg('That’s your current password — choose a different one.');
    else if (m.includes('session') || m.includes('jwt')) showMsg(NEW_LINK);
    else showMsg(error.message || 'Something went wrong. Please try again.');
    btn.disabled = false; btn.textContent = 'Save new password';
    return;
  }
  markActive();
  const nm = (data.user && data.user.user_metadata && data.user.user_metadata.name) || '';
  try { if (nm) localStorage.setItem('bay_name', nm); } catch(_) {}
  form.style.display = 'none';
  showMsg('Password changed — taking you to Rafiq…', 'ok');
  setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 1500);
});
</script>
</body>
</html>
