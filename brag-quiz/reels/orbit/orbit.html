<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AR;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2)}
@font-face{font-family:FR;src:url(fonts/fredoka-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:FR;src:url(fonts/fredoka-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.tile{position:absolute;width:210px;height:150px;margin:-75px 0 0 -105px;border-radius:30px;background:#FBF6EA;border:5px solid #E9B949;
  box-shadow:0 18px 40px rgba(23,38,43,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;will-change:transform}
.tile .ar{font-family:AR;font-size:66px;line-height:1.1;color:#17262B;direction:rtl}.tile .en{font-family:FR;font-weight:600;font-size:27px;color:#2E7263;margin-top:2px}
.tile.held{border-color:#C8372D;box-shadow:0 0 0 8px rgba(233,185,73,.55),0 22px 50px rgba(23,38,43,.45)}
#card{position:absolute;left:70px;right:70px;top:230px;height:300px;border-radius:44px;background:rgba(251,246,234,.96);box-shadow:0 24px 60px rgba(23,38,43,.35);display:none}
#card .n{position:absolute;left:34px;top:22px;font-family:FR;font-weight:700;font-size:34px;color:#C8372D}
#card .s{position:absolute;left:0;right:0;top:40px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:26px;direction:rtl}
#card .s .w{font-family:AR;font-size:100px;color:#17262B;line-height:1.35}
#card .slot{min-width:220px;height:130px;border:6px dashed #C8372D;border-radius:26px;display:flex;align-items:center;justify-content:center;font-family:AR;font-size:96px;color:#17262B}
#card .slot.full{border:6px solid #E9B949;background:#E9B949}
#card .e{position:absolute;left:0;right:0;top:212px;text-align:center;font-family:FR;font-weight:700;font-size:56px;color:#2E7263}
#card .e b{color:#C8372D}
#ring{position:absolute;left:880px;top:560px;width:150px;height:150px;display:none}
#ring svg{position:absolute;inset:0;transform:rotate(-90deg)}#ring circle{fill:none;stroke-width:14}#ring .bg{stroke:rgba(251,246,234,.5)}#ring .fg{stroke:#C8372D;stroke-dasharray:408}
#ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:FR;font-size:84px;color:#FBF6EA;text-shadow:0 4px 14px rgba(0,0,0,.4)}
#hook{position:absolute;left:50px;right:50px;top:250px;text-align:center;font-family:FR;font-weight:700;font-size:104px;line-height:1.04;color:#FBF6EA;
  text-shadow:0 6px 24px rgba(23,38,43,.55),0 2px 0 rgba(23,38,43,.4)}
#hook span{display:inline-block;margin:0 12px}#hook .loud{color:#E9B949;font-size:1.45em}
#lab{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:FR;font-weight:700;font-size:78px;color:#FBF6EA;text-shadow:0 6px 24px rgba(23,38,43,.55)}
#ask{position:absolute;left:60px;right:60px;top:1610px;text-align:center;font-family:FR;font-weight:700;font-size:70px;line-height:1.1;color:#FBF6EA;
  text-shadow:0 6px 24px rgba(23,38,43,.6)}#ask b{color:#E9B949}
#flash{position:absolute;inset:0;background:#fff8e6;opacity:0}
</style></head><body><div id="L"></div>
<div id="card"><div class="n"></div><div class="s"></div><div class="e"></div></div>
<div id="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="65"/><circle class="fg" cx="75" cy="75" r="65"/></svg><b></b></div>
<div id="hook"></div><div id="lab"></div><div id="ask"></div><div id="flash"></div>
<script>
let C = null, PH = null;
const handAt = f => C.hand[Math.min(C.N - 1, Math.max(0, f))];
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), eo = x => 1 - Math.pow(1 - cl(x), 3), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = cl(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function init() {
  // the orbit's angle, integrated from its speed: slow, then the swipe flings it (C.fling) and it settles back
  PH = [0]; const dt = 1 / 30;
  for (let i = 1; i <= C.N + 60; i++) { const t = i * dt, [f0, f1] = C.fling;
    const w = C.w0 + C.w1 * (t > f0 ? Math.exp(-(t - f0) * 1.1) * cl((t - f0) / .25) : 0);
    PH.push(PH[i - 1] + w * dt); }
  document.getElementById('L').innerHTML = C.words.map(([a, e], i) => `<div class="tile" id="t${i}"><span class="ar">${a}</span><span class="en">${e}</span></div>`).join('');
}
function slotPos(r) { return r.slot; }
function update(t, layer) {
  if (!PH) init();
  const fi = Math.min(C.N - 1, Math.round(t * 30));
  if (layer === 'front') {
  // the sentence card for this round
    const cd = document.getElementById('card'), R = C.rounds.find(r => t >= r.c0 && t < r.c1);
    if (R) { cd.style.display = 'block';
      if (cd.dataset.k !== String(R.c0)) { cd.dataset.k = String(R.c0); cd.querySelector('.n').textContent = R.n;
        cd.querySelector('.s').innerHTML = `<div class="slot"></div>` + R.rest.map(w => `<span class="w">${w}</span>`).join(''); }
      const k = back((t - R.c0) / .45); cd.style.transform = `translateY(${(1 - eo((t - R.c0) / .35)) * -300}px) scale(${.9 + .1 * k})`;
      const out = eo((t - (R.c1 - .3)) / .3); cd.style.opacity = 1 - (R.last ? 0 : out);
      const full = t >= R.land, sl = cd.querySelector('.slot');
      sl.classList.toggle('full', full); sl.textContent = full ? C.words[R.k][0] : '';
      sl.style.transform = full ? `scale(${1 + .25 * Math.exp(-(t - R.land) * 7)})` : 'none';
      cd.querySelector('.e').innerHTML = full ? R.en.replace('___', `<b>${R.ans}</b>`) : R.en.replace('___', '<b>___</b>');
      cd.style.marginLeft = (t >= R.land && t < R.land + .25 ? Math.sin((t - R.land) * 80) * 14 : 0) + 'px';
      const sr = sl.getBoundingClientRect(); R.slot = [sr.left + sr.width / 2, sr.top + sr.height / 2];
    } else cd.style.display = 'none';
  }
  const n = C.words.length, cx = C.cx, cy = C.cy;
  const front = layer === 'front';
  // rounds: which tile is held / flying / placed
  const st = {};
  C.rounds.forEach(r => { st[r.k] = r; r.slot = r.slot || [700, 335]; });
  C.words.forEach((w, i) => {
    const el = document.getElementById('t' + i), th = PH[fi] + 2 * Math.PI * i / n;
    let x = cx + C.rx * Math.cos(th), y = cy + C.ry * Math.sin(th), d = Math.sin(th), s = .74 + .26 * (d + 1) / 2, rot = -6 * Math.cos(th), o = 1, inFront = d >= 0, held = false;
    const pop = 1;                                   // on screen from frame 0 (the cover)
    const r = st[i];
    if (r) {
      const hx = handAt(fi)[0], hy = handAt(fi)[1] - 70;
      if (t >= r.g0 && t < r.rel) { const k = eio((t - r.g0) / (r.g1 - r.g0)); x += (hx - x) * k; y += (hy - y) * k; s += (1.08 - s) * k; rot *= 1 - k; inFront = true; held = t >= r.g1 - .05; }
      else if (t >= r.rel && t < r.land) { const k = eio((t - r.rel) / (r.land - r.rel)), [hx0, hy0] = handAt(Math.round(r.rel * 30)), sx = r.slot[0], sy = r.slot[1];
        x = hx0 + (sx - hx0) * k; y = hy0 - 70 + (sy - hy0 + 70) * k - Math.sin(k * Math.PI) * 120; s = 1.08 + .25 * Math.sin(k * Math.PI); rot = 12 * Math.sin(k * Math.PI * 2); inFront = true; }
      else if (t >= r.land) o = 0;       // it's in the sentence now
    }
    const show = front ? inFront : !inFront;
    el.style.display = show && o > 0 ? 'flex' : 'none';
    el.classList.toggle('held', held);
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = Math.round(1000 + y);
    el.style.opacity = (inFront ? 1 : .9) * pop; el.style.transform = `scale(${s * (.6 + .4 * pop)}) rotate(${rot}deg)`;
    el.style.filter = inFront ? 'none' : `brightness(${.82 + .18 * (d + 1)})`;
  });
  ['card', 'ring', 'hook', 'lab', 'ask', 'flash'].forEach(id => document.getElementById(id).style.visibility = front ? 'visible' : 'hidden');
  if (!front) return;
  // the hook: each word as Callum says it, the loud one slams down from huge
  const hk = document.getElementById('hook');
  if (t < C.hookEnd) { hk.style.display = 'block';
    if (!hk.dataset.k) { hk.dataset.k = 1; hk.innerHTML = C.hook.map(([w, s, l], i) => `<span id="h${i}" class="${l ? 'loud' : ''}">${w}</span>`).join(' '); }
    C.hook.forEach(([w, s, l], i) => { const el = document.getElementById('h' + i);
      if (l) { const k = cl((t - 0) / Math.max(.15, s + .1)); el.style.opacity = 1; el.style.transform = `scale(${2.2 - 1.2 * Math.pow(k, 3) + (t > s + .1 ? .18 * Math.exp(-(t - s - .1) * 10) : 0)}) rotate(${-7 * (1 - Math.pow(k, 3))}deg)`; }
      else { const k = eo((t - s + .06) / .25); el.style.opacity = i === 0 ? 1 : k; el.style.transform = `translateX(${(1 - k) * (i % 2 ? -260 : 260)}px)`; el.style.filter = `blur(${(1 - k) * 12}px)`; } });
    const sh = C.hook.find(h => h[2]), ht = sh ? sh[1] + .1 : -9, a = t - ht;
    hk.style.transform = a > 0 && a < .3 ? `translate(${Math.sin(a * 90) * 26 * (1 - a / .3)}px,${Math.cos(a * 70) * 16 * (1 - a / .3)}px)` : 'none';
    const out = eo((t - (C.hookEnd - .3)) / .3); hk.style.opacity = 1 - out;
  } else hk.style.display = 'none';
  const fl = document.getElementById('flash'); const fs = C.flashes.map(f => t - f).filter(a => a >= 0 && a < .3);
  fl.style.opacity = fs.length ? .75 * (1 - fs[0] / .3) : 0;
  // the label between the hook and the first sentence
  const lb = document.getElementById('lab'), [l0, l1, ltxt] = C.lab;
  if (t >= l0 && t < l1) { lb.style.display = 'block'; lb.textContent = ltxt; const k = eo((t - l0) / .25), o = eo((t - (l1 - .25)) / .25); lb.style.opacity = k * (1 - o); lb.style.transform = `scale(${1.3 - .3 * k})`; }
  else lb.style.display = 'none';
  // the 3-2-1
  const rg = document.getElementById('ring'), Q = C.rounds.find(r => t >= r.cd - .3 && t < r.cd + 3);
  if (Q) { rg.style.display = 'block'; const a = t - Q.cd, k = Math.floor(cl(a, 0, 2.999)), e = eo((a + .3) / .3);
    rg.querySelector('b').textContent = 3 - k; rg.querySelector('.fg').style.strokeDashoffset = 408 * cl(a / 3);
    rg.style.opacity = e * (1 - eo((a - 2.75) / .25)); rg.querySelector('b').style.transform = `scale(${1 + .35 * Math.exp(-((a % 1) + 1) % 1 * 9)})`; }
  else rg.style.display = 'none';
  const ak = document.getElementById('ask'); if (t >= C.ask[0]) { ak.style.display = 'block'; ak.innerHTML = C.ask[1]; const k = eo((t - C.ask[0]) / .35); ak.style.opacity = k; ak.style.transform = `translateY(${(1 - k) * 60}px)`; } else ak.style.display = 'none';
}
</script></body></html>
