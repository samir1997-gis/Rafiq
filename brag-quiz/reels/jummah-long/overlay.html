<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AN;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:SE;src:url(fonts/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:AR;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
/* captions: the reel template's kinetic style (layers.html), on his chest under the face */
#cap{position:absolute;top:1680px;left:70px;right:70px;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:14px;
  font-family:AN,AR;font-size:58px;letter-spacing:1px;color:#fff;text-transform:uppercase;line-height:1.05;text-align:center;
  text-shadow:0 4px 18px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)}
#cap .w{display:inline-block;transform-origin:50% 80%}
#cap .em{color:#E9B949;font-size:104px;line-height:.95}
/* a hadith / reference card over the quiz area once the answer is out (the % rail on the left stays); tall enough to cover the answer pill */
.card{position:absolute;left:150px;right:44px;top:205px;min-height:545px;display:flex;flex-direction:column;justify-content:center;padding:34px 40px 30px;background:#F1ECE0;border:5px solid #2E7263;border-radius:40px;
  box-shadow:0 30px 70px -20px rgba(23,38,43,.55);text-align:center;opacity:0}
.card .k{font-family:AN;font-size:34px;letter-spacing:3px;color:#B4322A}
.card .ar{font-family:AR;font-size:58px;line-height:1.7;color:#17262B;direction:rtl;margin-top:6px}
.card .en{font-family:SE;font-style:italic;font-size:52px;line-height:1.15;color:#17262B;margin-top:10px}
.card .ref{font-family:AN;font-size:32px;letter-spacing:2px;color:#9a7826;margin-top:18px}
.card .root{font-family:AR;font-size:120px;color:#B4322A;line-height:1.3}
</style></head><body>
<div id="cards"></div><div id="cap"></div>
<script>
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), eo = x => 1 - Math.pow(1 - cl(x), 3);
let C = null;
function build() {
  document.getElementById('cards').innerHTML = C.cards.map((c, i) => `<div class="card" id="cd${i}"><div class="k">${c.k}</div>` +
    (c.root ? `<div class="root">${c.root}</div>` : '') + (c.ar ? `<div class="ar">${c.ar}</div>` : '') +
    `<div class="en">${c.en}</div><div class="ref">${c.ref}</div></div>`).join('');
}
function update(t) {
  C.cards.forEach((c, i) => {                 // slides up and in, settles; leaves upwards with a blur
    const el = document.getElementById('cd' + i), k = eo((t - c.a) / .45), o = eo((t - (c.b - .3)) / .3);
    if (t < c.a || t > c.b) { el.style.opacity = 0; return; }
    el.style.opacity = k * (1 - o); el.style.filter = `blur(${o * 10}px)`;
    el.style.transform = `translateY(${(1 - k) * 90 - o * 60}px) scale(${.94 + .06 * k})`;
  });
  const cap = document.getElementById('cap'); let cur = null;
  for (const c of C.caps) if (t >= c[0] && t < c[1]) cur = c;
  if (!cur) { cap.style.opacity = 0; return; }
  if (cap.dataset.k !== String(cur[0])) { cap.dataset.k = String(cur[0]);
    cap.innerHTML = cur[2].map(([w, s, e]) => `<span class="w${e ? ' em' : ''}" data-s="${s}">${w}</span>`).join(''); }
  const out = eo((t - (cur[1] - .16)) / .16);   // each word rises in as it's said, a key word lands big; the line leaves upwards
  cap.style.opacity = 1 - out; cap.style.transform = `translateY(${-50 * out}px)`; cap.style.filter = `blur(${8 * out}px)`;
  cap.querySelectorAll('.w').forEach(el => { const l = t - +el.dataset.s, k = eo(l / (el.classList.contains('em') ? .2 : .14));
    if (l < -.02) { el.style.opacity = 0; return; }
    el.style.opacity = k; el.style.filter = `blur(${(1 - k) * 10}px)`;
    el.style.transform = el.classList.contains('em') ? `scale(${1.7 - .7 * k})` : `translateY(${(1 - k) * 34}px)`; });
}
</script></body></html>
