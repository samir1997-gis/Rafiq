<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
#home{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);--ar:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif}
.zvc h1{font:700 30px/1.3 var(--ar);text-align:center;margin:18px 0 6px}.zvc h1 b{color:var(--rubric)}
.zvc .zringwrap{display:grid;place-items:center;margin:8px 0 4px;position:relative}
.zvc svg{width:190px;height:190px;transform:rotate(-90deg)}
.zvc .zmid{position:absolute;text-align:center}.zvc .zmid b{font-size:40px;font-weight:800;display:block;line-height:1}.zvc .zmid span{font-size:14px;color:var(--ink-soft);font-weight:600}
.zvc .zchips{display:flex;justify-content:center;gap:8px;margin:10px 0 18px}
.zvc .zchip{white-space:nowrap;padding:7px 12px !important;background:var(--card);border:1px solid var(--rule);border-radius:30px;padding:7px 14px;font-weight:700;font-size:14.5px}
.zvc .zchip span{color:var(--ink-soft);font-weight:600}
.zvc .znext{background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:18px 18px 16px;display:flex;gap:14px;align-items:center}
.zvc .znext .zar{font:700 30px var(--ar);color:var(--rubric);width:84px;text-align:center}
.zvc .znext b{font-size:18px;display:block}.zvc .znext span{font-size:14px;color:var(--ink-soft);font-weight:600}
.zvc .zbtn{display:block;text-align:center;background:var(--verdigris);color:#fff;border-radius:30px;padding:15px;font-weight:800;font-size:17px;margin:12px 0 18px}
.zvc .ztwo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zvc .ztile{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:14px 16px}
.zvc .ztile b{font-size:22px;font-weight:800;display:block}.zvc .ztile span{font-size:14px;color:var(--ink-soft);font-weight:600}
.zvc .ztile .zbar{height:6px;border-radius:6px;background:var(--paper-deep);margin-top:10px}.zvc .ztile .zbar i{display:block;height:100%;border-radius:6px}
.zvc .znx{text-align:center;font-size:14.5px;color:var(--ink-soft);font-weight:600;margin:6px 0 12px}.zvc .znx b{display:inline;font-size:inherit;color:var(--ink)}
.zvc .zmid span{line-height:1.3;display:block;margin-top:4px}
</style>
<div class="zvc">
<div class="zringwrap"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--paper-deep)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="216.5"/></svg>
<div class="zmid"><b>18%</b><span>of your salah<br>understood</span></div></div>
<p class="znx">🕌 42 of 238 words · next: <b>Seeking refuge</b> ›</p>
<div class="zchips"><div class="zchip">🔥 0 <span>streak</span></div><div class="zchip">📚 100 <span>words</span></div><div class="zchip">🧭 2/12 <span>units</span></div></div>
<div class="znext"><div class="zar">السَّكَنُ</div><div><b>Meet 5 new words</b><span>Unit 3 · Housing · 4 min</span></div></div>
<a class="zbtn">Continue</a>
<div class="ztwo">
<div class="ztile"><b style="color:var(--rubric)">116</b><span>to review →</span><div class="zbar"><i style="width:100%;background:var(--rubric);opacity:.35"></i></div></div>
<div class="ztile"><b>0<span style="font-size:15px">/2</span></b><span>steps today 🎯</span><div class="zbar"><i style="width:0;background:var(--verdigris)"></i></div></div>
</div>
</div>
