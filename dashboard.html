<style>
.hero{padding:40px 0 6px;text-align:center}
.hero .greet{font-family:var(--ar);direction:rtl;font-size:clamp(26px,6vw,36px);font-weight:600;color:var(--ink);
  line-height:1.7;margin:0 0 10px;padding:4px 0}
.hero .greet .nm{color:var(--rubric);cursor:pointer;border-bottom:1px dotted rgba(180,50,42,.4);transition:opacity .12s}
.hero .greet .nm:active{opacity:.6}
.hero h1{font-size:clamp(21px,4.4vw,26px);font-weight:700;margin:0 auto}
.hero p{color:var(--ink-soft);font-size:14.5px;margin:8px auto 0;max-width:52ch}
.today{font-family:var(--ut);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-top:14px}
.today b{color:var(--rubric)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:28px 0 48px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:28px;min-height:210px;position:relative;display:flex;flex-direction:column;transition:transform .18s,border-color .18s;touch-action:manipulation}
.tile:active{transform:scale(.985)}
.tilehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px}
.tile .ar{font-family:var(--ar);direction:rtl;font-size:25px;font-weight:600;color:var(--ink);line-height:1.65;padding:2px 0}
.tile h2{font-size:20px;margin-top:14px}
.tile p{color:var(--ink-soft);font-size:13px;margin-top:8px;flex:1}
.tile .go{font-size:13px;color:var(--verdigris);font-weight:500;margin-top:12px}
.tile.drills .ar{color:var(--rubric)}
.corner{flex:0 0 auto}
.acctbar{max-width:1000px;margin:34px auto 0;padding:16px 30px 0;border-top:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:860px){ .acctbar{padding:14px 16px 0;margin-top:26px} .acctbar .btn{min-height:44px} }
@media (min-width:861px){ .acctbar{display:none} }   /* desktop already has Log out in the top nav */

.pstrip{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 0;padding:10px 14px;border-radius:10px;
  background:var(--card);border:1px solid var(--rule);font-size:14px}
.pstrip b{font-variant-numeric:tabular-nums}
.pstrip a{color:var(--verdigris);font-weight:700;text-decoration:none;white-space:nowrap;padding:6px 0}
.pstrip.soon{border-color:var(--gold)}
.pstrip.ended{display:block;border:1px solid var(--gold);padding:16px}
.pstrip.ended .t{font-size:17px;font-weight:700;margin-bottom:4px}
.pstrip.ended p{color:var(--ink-soft);margin:0 0 12px;line-height:1.5}
.pstrip.ended .cont{display:inline-block}
.today-card{background:var(--card);border:1px solid var(--verdigris);border-radius:14px;padding:20px;margin:18px 0 10px}
.today-card .k{font-family:var(--ut);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.today-card .u{font-family:var(--ar);direction:rtl;text-align:left;font-size:22px;line-height:1.8;color:var(--rubric)}
.today-card .t{font-size:20px;font-weight:700;margin-top:2px}
.today-card .m{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.cont{display:block;text-align:center;text-decoration:none;margin-top:16px;min-height:52px;line-height:52px;border-radius:12px;background:var(--verdigris);color:#fff;font-size:16.5px;font-weight:600}
.cont:active{transform:scale(.98)}
.stats{display:flex;gap:10px;margin:6px 0 22px}
.stats>div{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft)}
.stats b{display:block;font-size:19px;color:var(--ink)}
.stats b small{font-size:13px;font-weight:500;color:var(--ink-soft)}
.goal{height:6px;background:var(--paper-deep);border-radius:3px;margin-top:6px;overflow:hidden}.goal i{display:block;height:100%;background:var(--gold)}
.review{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:22px}
.review b{color:var(--rubric)}
.wbest{display:flex;gap:10px;align-items:center;text-decoration:none;margin:0 0 14px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);color:var(--ink);font-size:15px}
.wmore{display:inline-block;margin-top:8px;font-size:14px;color:var(--rubric);text-decoration:none}
.ph{font-size:16px;font-weight:700;margin:6px 0 10px}
.units{display:grid;gap:8px;margin-bottom:30px}
.unit{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.unit .st{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--paper-deep);color:var(--ink-soft)}
.unit.done .st{background:var(--verdigris);color:#fff}
.unit.now{border-color:var(--verdigris)} .unit.now .st{background:var(--gold);color:#fff}
.unit.later{opacity:.62;width:100%;text-align:left;font:inherit;cursor:pointer}
.unit.soon{border-style:dashed;background:transparent}
.unit.soon .st{background:transparent;font-size:18px}
.csub{font-size:13px;color:var(--ink-soft);margin:-4px 0 10px}
.lockmsg{font-size:13px;color:var(--ink-soft);background:var(--paper-deep);border-radius:8px;padding:8px 12px;margin-top:-2px}
.unit .nm{flex:1;min-width:0}.unit .nm b{display:block;font-size:15px}.unit .nm span{font-size:12px;color:var(--ink-soft)}
.unit .ua{font-family:var(--ar);font-size:16px;color:var(--rubric);white-space:nowrap}
.hero{padding:26px 0 0}
.focus{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.focus .k{font-family:var(--ut);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.focus .t{font-size:16px;font-weight:700;margin-top:4px}.focus p{font-size:13.5px;color:var(--ink-soft);margin:6px 0 8px}
.fx{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:1px dashed var(--rule);padding:6px 0;font-size:13px;color:var(--ink-soft)}
.fx .fa{font-family:var(--ar);direction:rtl;font-size:18px;color:var(--ink)}
.week{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.week .k{font-family:var(--ut);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.wrow{display:flex;gap:8px;margin:8px 0 4px}.wrow div{flex:1;font-size:12px;color:var(--ink-soft)}
.wrow b{display:block;font-size:20px;color:var(--ink)}.wrow small{font-size:12px;color:var(--ink-soft);font-weight:400}
.week p{font-size:13.5px;color:var(--ink-soft);margin:6px 0 0}.week p b{color:var(--ink)}
.sgoal{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:-12px 0 14px}
.sgoal .sgt{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft)}.sgoal .sgt b{color:var(--ink)}
.sgoal .goal{margin:8px 0 6px}.sgoal p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5}
.frow{display:flex;gap:8px;margin-top:8px}
.gopr{flex:1;text-align:center;text-decoration:none;background:var(--verdigris);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px}
.got{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:7px 14px;color:var(--ink);cursor:pointer}
.skipbtn{display:block;width:100%;margin-top:10px;min-height:48px;border-radius:12px;border:1.5px solid var(--verdigris);
  background:transparent;color:var(--verdigris);font:inherit;font-size:15.5px;font-weight:600;cursor:pointer}
.skipbtn:active{transform:scale(.98)}
.pickhead{font-size:16px;font-weight:700;margin:26px 0 4px}
.picksub{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.qcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);
  border-radius:8px;padding:16px 17px;transition:border-color .15s,transform .12s;touch-action:manipulation}
.qcard:active{transform:scale(.98)}
.qcard .qa{font-family:var(--ar);font-size:20px;direction:rtl;line-height:1.7;color:var(--rubric)}
.qcard .qt{font-size:15.5px;font-weight:600;margin-top:2px}
.qcard .qd{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.qcard .qm{font-family:var(--ut);font-size:10.5px;color:var(--ink-soft);margin-top:9px;padding-top:8px;border-top:1px solid var(--rule)}
.qcard .qm b{color:var(--rubric)}
/* Was background:var(--ink);color:var(--paper) — an intentional light/dark
   inversion in light mode, but --ink and --paper swap meaning under dark mode
   too, so the "inverted" card re-inverted itself back to a bright cream block
   sitting oddly on the dark page instead of popping the way it should.
   var(--card)/var(--ink) stays in the same surface family as the rest of the
   page in both themes; the verdigris border plus the accent-colored button
   below are what make this one read as the primary action. */
.bigcta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--card);color:var(--ink);border:1px solid var(--verdigris);border-radius:8px;padding:18px 20px;margin:22px 0 4px;text-decoration:none;
  transition:transform var(--press,120ms) var(--ease-out,ease-out);touch-action:manipulation}
.bigcta:active{transform:scale(.98)}
.bigcta .bc-t{font-size:17px;font-weight:600}
.bigcta .bc-d{font-size:13px;opacity:.72;margin-top:3px}
.bigcta .bc-go{background:var(--verdigris);color:#fff;border-radius:5px;padding:11px 20px;font-size:14.5px;white-space:nowrap}
@media (max-width:860px){ .qgrid{grid-template-columns:minmax(0,1fr)} .bigcta{flex-direction:column;align-items:stretch}
  .bigcta .bc-go{text-align:center} }
.stat{font-family:var(--ut);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.stat b{color:var(--rubric);font-weight:600}
.stat.none{color:var(--ink-soft)}
@media (max-width:640px){.tiles{grid-template-columns:minmax(0,1fr)}}

/* Pointer devices only — :hover sticks after a tap on touchscreens. */
@media (hover:hover) and (pointer:fine){

.tile:hover{transform:translateY(-2px);border-color:var(--verdigris)}
.qcard:hover{border-color:var(--verdigris);transform:translateY(-1px)}
}
</style>

    <div class="greet" id="greetAr">السَّلامُ عَلَيْكُم</div>
  </section>
  <div id="planStrip"></div>
  <div id="remPrompt"></div>

<script src="vocab-data.js?v=20260928b"></script>

<script>
/* Both apps keep their own schedule; the dashboard just reports on each. */
const DAY=86400000, dayNow=Math.floor(Date.now()/DAY), iso=new Date().toISOString().slice(0,10);
function read(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(_){return null}}

const NAME_KEY='bay_name';
function getName(){ try{return (localStorage.getItem(NAME_KEY)||'').trim()}catch(_){return ''} }
function setName(n){ try{localStorage.setItem(NAME_KEY,n.trim())}catch(_){} paintGreeting(); }
function askName(){
  const n=prompt('What should the app call you?', getName());
  if(n!==null) setName(n);
}
function paintGreeting(){
  const name=getName();
  const el=document.getElementById('greetAr');
  el.innerHTML='السَّلامُ عَلَيْكُم' +
    (name? ' يا <span class="nm" title="Tap to change">'+name+'</span>' : '');
  const nm=el.querySelector('.nm');
  if(nm) nm.onclick=askName;                 // the name itself is the control
}
paintGreeting();

(async function whoAmI(){
  const el=document.getElementById('whoami'); if(!el) return;
  let name=''; try{name=localStorage.getItem('bay_name')||''}catch(e){}
  if(typeof sb!=='undefined' && sb){
    try{const {data}=await sb.auth.getUser(); if(data&&data.user) name=name||data.user.email||''}catch(e){}
  }
  el.textContent = name? ('Signed in as '+name) : 'Account';
})();

function paintHome(){
  const el=document.getElementById('home'); if(!el||!window.RafiqPath) return;
  const U=RafiqPath.units();
  const n=RafiqPath.next(), cur=n.index, s=RafiqPath.streak(), today=RafiqPath.doneToday(), G=RafiqPath.GOAL;
  const steps=RafiqPath.steps(n.unit), doneN=steps.filter(x=>RafiqPath.stepDone(n.unit.n,x.key)).length;
  const due=RafiqPath.reviewDue();
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const card = n.finishedAll
    ? `<div class="today-card"><div class="k">All units done</div><div class="t">Mabrook — you've finished the path 🎉</div>
       <div class="m">Keep what you've learned fresh with a daily review.</div><a class="cont" href="session.html">Daily review</a></div>`
    : `<div class="today-card"><div class="k">${n.unit.alpha?'Start here':'Unit '+cur+' of '+(U.length-1)} · step ${doneN+1} of ${steps.length}</div>
       <div class="u">${esc(n.unit.ar)}</div><div class="t">${esc(n.step.title)}</div>
       <div class="m">${esc(n.unit.en)} · about ${n.step.mins} minutes</div>
       <a class="cont" href="learn.html?u=${n.unit.n}&s=${n.step.key}">Continue</a>
       ${n.unit.alpha?'<button type="button" class="skipbtn" id="skipRead">I can read Arabic — skip this</button>':''}</div>`;
  const sg=RafiqPath.streakGoal(s);
  const stats=`<div class="stats"><div><b>🔥 ${s}</b>day streak</div>
     <div><b>${today} <small>/ ${G} steps</small></b>${today>G?`today's goal ✓ · ${today-G} extra`:today===G?"today's goal ✓":"today's goal"}<div class="goal"><i style="width:${Math.min(100,100*today/G)}%"></i></div></div></div>`+
    (sg.next ? `<div class="sgoal"><div class="sgt"><span>Next goal: <b>${sg.next.days} days</b></span><span>${sg.left} to go</span></div>
       <div class="goal"><i style="width:${Math.round(100*(s-sg.from)/(sg.next.days-sg.from))}%"></i></div>
       <p>${esc(sg.next.why)}</p></div>` :
     `<div class="sgoal"><div class="sgt"><span><b>${s} days</b> — every goal reached</span></div><p>Keep going: a few minutes a day is what keeps Arabic in long-term memory.</p></div>`);
  /* Your week: shown once there's anything to show. */
  const wk=RafiqPath.week();
  const cnt=window.RafiqMistakes?RafiqMistakes.counts():{};
  const slip=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const week = wk.days ? `<div class="week"><div class="k">Your week</div>
     <div class="wrow"><div><b>${wk.days}<small>/7</small></b>days active</div><div><b>${wk.steps}</b>steps &amp; sessions</div><div><b>${RafiqPath.metWords().size}</b>words learned</div></div><a class="wmore" href="progress.html">See all your progress →</a>
     <p>${wk.days>=5?'A brilliant week — this is how Arabic sticks.':wk.days>=3?'Good rhythm. A few minutes most days beats one long session.':'Every day you open Rafiq counts — try for a few minutes tomorrow.'}
     ${slip&&slip[1]?` Most common slip: <b>${esc(RafiqMistakes.HELP[slip[0]].title.toLowerCase())}</b>.`:''}</p></div>` : '';
  const f = window.RafiqMistakes && RafiqMistakes.focus();
  const focus = f ? `<div class="focus"><div class="k">Worth a look · came up ${f.count} times this week</div>
     <div class="t">${esc(f.title)}</div><p>${esc(f.body)}</p>
     ${f.ex.map(x=>`<div class="fx"><span class="fa">${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join('')}
     <div class="frow"><a class="gopr" href="session.html?focus=weak">Practise it</a>
     <button class="got" type="button" data-k="${f.key}">Got it</button></div></div>` : '';
  const review = due ? `<a class="review" href="session.html"><span><b>${due}</b> to review from your lessons</span><span>Review →</span></a>`
    : RafiqPath.hasLearned() ? `<a class="review" href="session.html"><span>Nothing due — a quick review keeps it fresh</span><span>Review →</span></a>` : '';
  /* Today's new words, highlighted when it beats your usual day or your best. */
  const wr=RafiqPath.wordsReport();
  const wtoday = wr.today && (wr.record||wr.aboveUsual) ? `<a class="wbest" href="progress.html">${wr.record
      ? `🏆 <span><b>${wr.today} new words today</b> — your best day yet</span>`
      : `🌟 <span><b>${wr.today} new words today</b> — more than your usual ${wr.usual}</span>`}</a>` : '';
  const units=U.map((p,i)=>{
    const done=RafiqPath.unitDone(p), now=i===cur&&!done, later=i>cur;
    const st=RafiqPath.steps(p), k=st.filter(x=>RafiqPath.stepDone(p.n,x.key)).length;
    const sub = done ? (RafiqPath.placed(p.n)?'Skipped — you already know this':RafiqPath.lateLeft(p)?'Done · new words added':'Done') : now ? `${k} of ${st.length} steps` : 'Locked';
    const inner=`<span class="st">${done?'✓':now?'▶':'🔒'}</span><span class="nm"><b>${p.alpha?'':i+'. '}${esc(p.en)}</b><span>${sub}</span></span>
      <span class="ua">${esc(p.ar)}</span>`;
    return later
      ? `<button type="button" class="unit later" data-lock="${esc(U[cur].alpha?'the reading starter':'unit '+cur)}">${inner}</button>`
      : `<a class="unit ${done?'done':'now'}" href="learn.html?u=${p.n}">${inner}</a>`;
  }).join('');
  const coming=`<div class="ph" style="margin-top:4px">More units coming</div>
    <p class="csub">New units are added regularly — Complete members get them first.</p>
    <div class="units">${RafiqPath.COMING.map(c=>`<div class="unit soon"><span class="st">✨</span>
      <span class="nm"><b>${esc(c.en)}</b><span>${esc(c.d)}</span></span><span class="ua">${esc(c.ar)}</span></div>`).join('')}</div>`;
  // "Your salah": its own track, right under the daily path (salah.js; off until the teacher signs off)
  const salah = window.RafiqSalah && RafiqSalah.enabled() ? (RafiqSalah.styles(), RafiqSalah.cardHTML()) : '';
  el.innerHTML=card+salah+wtoday+stats+'<div id="pwaInstall"></div>'+week+focus+review+`<div class="ph">Your path</div><div class="units">${units}</div>`+coming;
  // "Get a daily reminder / put Rafiq on your home screen" (pwa.js), once a first lesson step is done
  if(window.RafiqPWA) RafiqPWA.card(document.getElementById('pwaInstall'), { ready: U.some(p => RafiqPath.steps(p).some(x => RafiqPath.stepDone(p.n, x.key))) });
  el.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{
    const m=el.querySelector('.lockmsg')||Object.assign(document.createElement('div'),{className:'lockmsg'});
    m.textContent='🔒 Finish '+b.dataset.lock+' first — each unit builds on the one before.';
    b.after(m);
  });
  const g=el.querySelector('.got'); if(g) g.onclick=()=>{ RafiqMistakes.gotIt(g.dataset.k); paintHome(); };
  const sk=document.getElementById('skipRead');
  if(sk) sk.onclick=e=>{ e.preventDefault(); RafiqPath.skipReading(); paintHome(); };
}
</script>

<script>
/* The free week: a quiet countdown, and once it's over a card to choose a plan.
   Home itself always stays open. */
(function(){
  const P = RafiqPlan, el = document.getElementById('planStrip');
  function paint(){
    const s = P.state();
    if(P.BETA || !el){ if(el) el.innerHTML = ''; return; }
    if(s.kind === 'trial') el.innerHTML = `<div class="pstrip${s.daysLeft<=2?' soon':''}"><span>Free week · <b>${s.daysLeft} day${s.daysLeft===1?'':'s'}</b> left</span><a href="plans.html">See plans</a></div>`;
    else if(s.kind === 'ended') el.innerHTML = `<div class="pstrip ended"><div class="t">Your free week has ended</div>
      <p>Choose a plan to carry on from where you are. Your progress, streak and words are all saved.</p><a class="cont" href="plans.html">Choose a plan</a></div>`;
    else el.innerHTML = '';
  }
  paint(); P.load().then(paint);
})();
</script>

<script>
requireLogin();
/* Never leave Home blank: show that it's loading, and if anything fails say
   so plainly (with the error, so it can be reported) instead of an empty page. */
(function(){
  const el=document.getElementById('home');
  if(el) el.innerHTML='<p style="color:var(--ink-soft);text-align:center;padding:30px 0">Loading your path…</p>';
  const fail=e=>{ console.error(e); if(el) el.innerHTML=`<div class="today-card"><div class="t">Something went wrong loading your path</div>
    <div class="m">Pull down to refresh, or try again in a minute. If it keeps happening, send us this: <code>${String(e&&e.message||e).replace(/</g,'&lt;')}</code></div>
    <a class="cont" href="dashboard.html">Try again</a></div>`; };
  Progress.init().then(()=>{ try{ paintHome(); }catch(e){ fail(e); } }).catch(fail);
})();
// send brand-new users to onboarding once (skips silently if already done or offline)
(async ()=>{
  try{
    /* local marker: this account has onboarded in this browser, so never redirect
       (avoids loops). It holds the account id: a confirm link can open in a browser
       where a different account onboarded before. */
    const uid = typeof currentUserId==='function' ? await currentUserId() : null;
    const mark = localStorage.getItem('rafiq_onboarded');
    if(mark && (mark===uid || (!uid && mark==='1'))) return;
    if(typeof cloudLoadProfile==='function'){
      const prof = await cloudLoadProfile();
      if(prof && prof.onboarded){
        try{ localStorage.setItem('rafiq_onboarded', uid||'1'); }catch(_){}
        return;
      }
      if(uid) window.location.href = 'onboarding.html';   // no profile yet, or one saved without finishing
    }
  }catch(_){}
})();
</script>
