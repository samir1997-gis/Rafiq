<script>
/* Both apps keep their own schedule; the dashboard just reports on each. */
const DAY=86400000, dayNow=Math.floor(Date.now()/DAY), iso=new Date().toISOString().slice(0,10);
function read(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(_){return null}}

const NAME_KEY='bay_name';
function getName(){ try{return (localStorage.getItem(NAME_KEY)||'').trim()}catch(_){return ''} }
function setName(n){ try{localStorage.setItem(NAME_KEY,n.trim())}catch(_){} paintGreeting(); }
function askName(){
  const n=prompt('What should the app call you?', getName());
  if(n!==null) setName(n);
}
function paintGreeting(){
  const name=getName();
  const el=document.getElementById('greetAr');
  el.innerHTML='السَّلامُ عَلَيْكُم' +
    (name? ' يا <span class="nm" title="Tap to change">'+name+'</span>' : '');
  const nm=el.querySelector('.nm');
  if(nm) nm.onclick=askName;                 // the name itself is the control
}
paintGreeting();

(async function whoAmI(){
  const el=document.getElementById('whoami'); if(!el) return;
  let name=''; try{name=localStorage.getItem('bay_name')||''}catch(e){}
  if(typeof sb!=='undefined' && sb){
    try{const {data}=await sb.auth.getUser(); if(data&&data.user) name=name||data.user.email||''}catch(e){}
  }
  el.textContent = name? ('Signed in as '+name) : 'Account';
})();

/* A unit's steps (#336): done ones to redo, the next one, and the rest still locked.
   A lesson of new words names them, so you can find the ones to re-learn. */
const OPEN_UNITS=new Set();             // which units are open, kept across repaints
function paintHome(){
  const el=document.getElementById('home'); if(!el||!window.RafiqPath) return;
  const U=RafiqPath.units();
  const n=RafiqPath.next(), cur=n.index, s=RafiqPath.streak(), today=RafiqPath.doneToday(), G=RafiqPath.GOAL;
  const due=RafiqPath.reviewDue();
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shortEn=en=>en.split(/[;(]/)[0].trim();
  // the same rule as RafiqPath.stepOpen, worked out once per unit: before the current unit every step
  // is open; in it, the steps done and the first one not done
  function stepList(p, i, nextKey){
    const st=RafiqPath.steps(p), dn=st.map(x=>RafiqPath.stepDone(p.n,x.key)), first=dn.indexOf(false);
    return `<ol class="usteps">${st.map((s,k)=>{
      const done=dn[k], open=RafiqPath.allOpen || i<cur || done || k===first;
      const words=s.kind==='words' ? RafiqPath.wordsOf(p,s.batch).map(w=>shortEn(w.en)).join(' · ') : '';
      const cls=done?'done':s.key===nextKey?'next':open?'open':'locked';
      // numbered within the unit (#337): 1.01, 1.02 … (the reading starter and the basics have no unit number)
      const no=p.pre?'':`<span class="sno">${+p.n}.${String(k+1).padStart(2,'0')}</span>`;
      const body=`<span class="si">${done?'✓':s.key===nextKey?'▶':open?'○':'🔒'}</span>${no}
        <span class="sn">${esc(s.title)}${words?`<small>${esc(words)}</small>`:''}</span>${done?'<span class="redo">Redo</span>':''}`;
      return `<li>${open?`<a class="ustep ${cls}" href="learn.html?u=${p.n}&s=${s.key}">${body}</a>`:`<span class="ustep ${cls}">${body}</span>`}</li>`;
    }).join('')}</ol>`;
  }
  /* The reading starter (#276): the next step opens with a check-in on letters from an earlier day, and
     once its steps are done the check-in is all that's left, until every letter is green. */
  const ci=n.unit.alpha ? RafiqPath.checkInLetters().length : 0;
  const card = n.finishedAll
    ? `<div class="today-card"><div class="tc-box"><div><div class="t">Mabrook — you've finished the path 🎉</div>
       <div class="m">Keep what you've learned fresh with a daily review.</div></div></div><a class="cont" href="session.html">Daily review</a></div>`
    : n.step.kind==='checkin'
    ? `<div class="today-card"><div class="tc-box"><div class="u">${esc(n.unit.ar)}</div>
       ${ci ? `<div><div class="t">Letter check-in</div><div class="m">Reading Arabic · ${ci} ${ci===1?'letter':'letters'} to turn green · 2 min</div></div></div>
         <a class="cont" href="learn.html?u=${n.unit.n}&s=checkin">Continue</a>`
       : `<div><div class="t">Your last letters need a night’s sleep</div>
         <div class="m">A letter turns green when you get it right on two different days. Come back tomorrow for a quick check-in, and the basics open.</div></div></div>`}</div>`
    : `<div class="today-card"><div class="tc-box"><div class="u">${esc(n.unit.ar)}</div><div><div class="t">${esc(n.step.title)}</div>
       <div class="m">${n.unit.alpha?'Start here':n.unit.basics?'Before unit 1':'Unit '+(+n.unit.n)} · ${esc(n.unit.en)} · ${n.step.mins} min${ci&&n.unit.alpha?` · starts with a quick check-in on ${Math.min(ci,5)} ${Math.min(ci,5)===1?'letter':'letters'} from before`:''}</div></div></div>
       <a class="cont" href="learn.html?u=${n.unit.n}&s=${n.step.key}">Continue</a>
       ${n.unit.alpha?'<button type="button" class="skipbtn" id="skipRead">I can read Arabic — skip this</button>':''}</div>`;
  /* The alphabet board (#276): while the reading starter is the unit you're on */
  const board = n.unit.alpha && !n.finishedAll ? (()=>{ const L=RafiqPath.LETTERS, st=L.map(ch=>[ch, RafiqPath.letterState(ch)]);
    return `<div class="board"><div class="k">Your alphabet · ${st.filter(([,x])=>/known|gold/.test(x)).length} of ${L.length} known</div>
      <div class="bgrid">${st.map(([ch,x])=>`<span class="bl ${x}" aria-label="${x==='new'?'not met yet':x}">${ch}</span>`).join('')}</div>
      <p class="bkey"><span><i></i>met</span><span><i class="known"></i>right on 2 different days</span><span><i class="gold"></i>read in words</span></p></div>`; })() : '';
  /* Under the salah ring (#339): streak, words and units as chips; review and today's steps as two tiles */
  const met=today>=G, nU=U.filter(u=>!u.pre).length;
  const chips=`<div class="chips"><span class="chip">🔥 <b>${s}</b> streak</span><span class="chip">📚 <b>${RafiqPath.metWords().size}</b> words</span>
     <span class="chip">🧭 <b>${U.filter(u=>!u.pre&&RafiqPath.unitDone(u)).length}/${nU}</b> units</span></div>`;
  const tiles=`<div class="htiles"><a class="htile" href="session.html"><b class="${due?'due':''}">${due||'✓'}</b><span>${due?'to review →':'review anyway →'}</span></a>
     <div class="htile"><b>${met?'✓':today}${met?'':`<small>/${G}</small>`}</b><span>${met?"today's goal met":'steps today'} 🎯</span>
     <i class="bar"><i style="width:${Math.round(100*Math.min(1,today/G))}%"></i></i></div></div>`;
  /* Your week: shown once there's anything to show. */
  const wk=RafiqPath.week();
  const cnt=window.RafiqMistakes?RafiqMistakes.counts():{};
  const slip=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const week = wk.days ? `<div class="week"><div class="k">Your week</div>
     <div class="wrow"><div><b>${wk.days}<small>/7</small></b>days active</div><div><b>${wk.steps}</b>steps &amp; sessions</div><div><b>${RafiqPath.metWords().size}</b>words learned</div></div><a class="wmore" href="progress.html">See all your progress →</a>
     <p>${wk.days>=5?'A brilliant week — this is how Arabic sticks.':wk.days>=3?'Good rhythm. A few minutes most days beats one long session.':'Every day you open Rafiq counts — try for a few minutes tomorrow.'}
     ${slip&&slip[1]?` Most common slip: <b>${esc(RafiqMistakes.HELP[slip[0]].title.toLowerCase())}</b>.`:''}</p></div>` : '';
  const f = window.RafiqMistakes && RafiqMistakes.focus();
  const focus = f ? `<div class="focus"><div class="k">Worth a look · came up ${f.count} times this week</div>
     <div class="t">${esc(f.title)}</div><p>${esc(f.body)}</p>
     ${f.ex.map(x=>`<div class="fx"><span class="fa">${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join('')}
     <div class="frow"><a class="gopr" href="session.html?focus=weak">Practise it</a>
     <button class="got" type="button" data-k="${f.key}">Got it</button></div></div>` : '';
  /* Today's new words, highlighted when it beats your usual day or your best. */
  const wr=RafiqPath.wordsReport();
  const wtoday = wr.today && (wr.record||wr.aboveUsual) ? `<a class="wbest" href="progress.html">${wr.record
      ? `🏆 <span><b>${wr.today} new words today</b> — your best day yet</span>`
      : `🌟 <span><b>${wr.today} new words today</b> — more than your usual ${wr.usual}</span>`}</a>` : '';
  const units=U.map((p,i)=>{
    // the team (#338): units ahead of you are open too, marked ○
    const done=RafiqPath.unitDone(p), now=i===cur&&!done, later=i>cur&&!RafiqPath.allOpen;
    const st=RafiqPath.steps(p), k=st.filter(x=>RafiqPath.stepDone(p.n,x.key)).length;
    const sub = done ? (RafiqPath.placed(p.n)?'Skipped — you already know this':RafiqPath.lateLeft(p)?'Done · new words added':'Done') : now ? `${k} of ${st.length} steps` : later ? 'Locked' : `Open to the team · ${k} of ${st.length} steps`;
    const inner=`<span class="st">${done?'✓':now?'▶':later?'🔒':'○'}</span><span class="nm"><b>${p.pre?'':(+p.n)+'. '}${esc(p.en)}</b><span>${sub}</span></span>
      <span class="ua">${esc(p.ar)}</span>`;
    return later
      ? `<button type="button" class="unit later" data-lock="${esc(U[cur].alpha?'the reading starter':U[cur].basics?'the basics':'unit '+(+U[cur].n))}">${inner}</button>`
      : `<details class="ud" data-u="${p.n}"${OPEN_UNITS.has(p.n)?' open':''}><summary class="unit ${done?'done':now?'now':'open'}">${inner}<span class="chev" aria-hidden="true">▾</span></summary>${stepList(p, i, now&&n.step?n.step.key:null)}</details>`;
  }).join('');
  const coming=!RafiqPath.COMING.length ? '' : `<div class="ph" style="margin-top:4px">More units coming</div>
    <p class="csub">New units are added regularly — Complete members get them first.</p>
    <div class="units">${RafiqPath.COMING.map(c=>`<div class="unit soon"><span class="st">✨</span>
      <span class="nm"><b>${esc(c.en)}</b><span>${esc(c.d)}</span></span><span class="ua">${esc(c.ar)}</span></div>`).join('')}</div>`;
  // "Your salah": the ring at the top of Home (salah.js; off until the teacher signs off)
  const salah = window.RafiqSalah && RafiqSalah.enabled() && RafiqSalah.ringHTML ? (RafiqSalah.styles(), RafiqSalah.ringHTML()) : ''   // ringHTML missing: an old cached salah.js;
  // Ask Rafiq on Home (owner, #154): ask straight from here; it opens the tutor with the question asked
  const ask=(typeof TUTOR_ON!=='undefined' && TUTOR_ON) ? `<form class="askcard" action="tutor.html" method="get">
      <div class="ak-h"><i class="amark" aria-hidden="true"></i><b>Ask Rafiq</b><span>your AI tutor</span></div>
      <p>Stuck on something? Ask anything about Arabic or your lessons.</p>
      <div class="ak-in"><input name="q" type="text" placeholder="Ask a question…" aria-label="Ask Rafiq a question" autocomplete="off" required><button type="submit" aria-label="Ask">↑</button></div>
      <div class="ak-try">${['What does اسْمِي mean?','Why do some words start with ال?'].map(t=>`<a href="tutor.html?q=${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div></form>` : '';
  /* The ring (owner, #349): how far through the unit you're on, its steps done of all of them; the salah line
     (words understood, the next part) stays under it while salah is on. Drawn in salah.js's ring style. */
  if(window.RafiqSalah && RafiqSalah.styles) RafiqSalah.styles();
  const ust=RafiqPath.steps(n.unit), uk=ust.filter(x=>RafiqPath.stepDone(n.unit.n,x.key)).length;
  const upct=n.finishedAll ? 100 : ust.length ? Math.round(100*uk/ust.length) : 0, C=270.2;
  const uname=n.finishedAll ? 'your path' : n.unit.alpha ? 'Reading Arabic' : n.unit.basics ? 'the basics' : n.unit.en;
  const srow=salah ? ((salah.match(/<p class="sr-row">[\s\S]*?<\/p>/)||[''])[0]).replace(/ words<\/span>/, ' salah words</span>') : '';   // the ring no longer says salah
  const ring=`<div class="sring"><a class="sr-ring" href="${n.finishedAll?'progress.html':`learn.html?u=${n.unit.n}&s=${n.step?n.step.key:''}`}" aria-label="${upct}% of ${esc(uname)} done">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="43"/>${upct?`<circle class="arc" cx="50" cy="50" r="43" stroke-dasharray="${(C*upct/100).toFixed(1)} ${C}"/>`:''}</svg>
      <span class="sr-mid"><b>${upct}%</b><span>of ${esc(uname)}<br>done</span></span></a>${srow}</div>`;
  // Ask Rafiq: in the right-hand column under the tiles on a computer, above Your path on a phone (owner, #349)
  el.innerHTML=`<div class="htop"><div class="hl">${ring}${chips}</div><div class="hr">${card}${board}${tiles}${ask.replace('class="askcard"','class="askcard ak-wide"')}</div></div>`
    +ask.replace('class="askcard"','class="askcard ak-narrow"')+wtoday+'<div id="pwaInstall"></div>'+week+focus+`<div class="ph">Your path${RafiqPath.allOpen?'<span class="team"> · team account: every unit open</span>':''}</div><div class="units">${units}</div>`+coming;
  // "Get a daily reminder / put Rafiq on your home screen" (pwa.js), once a first lesson step is done
  if(window.RafiqPWA) RafiqPWA.card(document.getElementById('pwaInstall'), { ready: U.some(p => RafiqPath.steps(p).some(x => RafiqPath.stepDone(p.n, x.key))) });
  el.querySelectorAll('details.ud').forEach(d=>d.ontoggle=()=>{ d.open?OPEN_UNITS.add(d.dataset.u):OPEN_UNITS.delete(d.dataset.u); });
  el.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{
    const m=el.querySelector('.lockmsg')||Object.assign(document.createElement('div'),{className:'lockmsg'});
    m.textContent='🔒 Finish '+b.dataset.lock+' first — each unit builds on the one before.';
    b.after(m);
  });
  const g=el.querySelector('.got'); if(g) g.onclick=()=>{ RafiqMistakes.gotIt(g.dataset.k); paintHome(); };
  const sk=document.getElementById('skipRead');
  if(sk) sk.onclick=e=>{ e.preventDefault(); RafiqPath.skipReading(); paintHome(); };
}
</script>

<script>
/* The free week: a quiet countdown, and once it's over a card to choose a plan.
   Home itself always stays open. */
(function(){
  const P = RafiqPlan, el = document.getElementById('planStrip');
  function paint(){
    const s = P.state();
    if(P.BETA || !el){ if(el) el.innerHTML = ''; return; }
    if(s.kind === 'trial' && s.team) el.innerHTML = '';
    else if(s.kind === 'trial') el.innerHTML = `<div class="pstrip${s.daysLeft<=2?' soon':''}"><span>Free week · <b>${s.daysLeft} day${s.daysLeft===1?'':'s'}</b> left</span><a href="plans.html">See plans</a></div>`;
    else if(s.kind === 'ended') el.innerHTML = `<div class="pstrip ended"><div class="t">Your free week has ended</div>
      <p>Choose a plan to carry on from where you are. Your progress, streak and words are all saved.</p><a class="cont" href="plans.html">Choose a plan</a></div>`;
    else el.innerHTML = '';
  }
  paint(); P.load().then(paint); addEventListener('rafiq:plan', paint);
})();
</script>

<script>
requireLogin();
/* Never leave Home blank: show that it's loading, and if anything fails say
   so plainly (with the error, so it can be reported) instead of an empty page. */
(function(){
  const el=document.getElementById('home');
  if(el) el.innerHTML='<p style="color:var(--ink-soft);text-align:center;padding:30px 0">Loading your path…</p>';
  const fail=e=>{ console.error(e); if(el) el.innerHTML=`<div class="today-card"><div class="t">Something went wrong loading your path</div>
    <div class="m">Pull down to refresh, or try again in a minute. If it keeps happening, send us this: <code>${String(e&&e.message||e).replace(/</g,'&lt;')}</code></div>
    <a class="cont" href="dashboard.html">Try again</a></div>`; };
  Progress.init().then(()=>{ try{ paintHome(); }catch(e){ fail(e); } }).catch(fail);
  addEventListener('rafiq:progress', ()=>{ try{ paintHome(); }catch(_){} });   // newer progress from the server (#171)
})();
// send brand-new users to onboarding once (skips silently if already done or offline)
(async ()=>{
  try{
    /* local marker: this account has onboarded in this browser, so never redirect
       (avoids loops). It holds the account id: a confirm link can open in a browser
       where a different account onboarded before. */
    const uid = typeof currentUserId==='function' ? await currentUserId() : null;
    const mark = localStorage.getItem('rafiq_onboarded');
    if(mark && (mark===uid || (!uid && mark==='1'))) return;
    if(typeof cloudLoadProfile==='function'){
      const prof = await cloudLoadProfile();
      if(prof && prof.onboarded){
        try{ localStorage.setItem('rafiq_onboarded', uid||'1'); }catch(_){}
        return;
      }
      if(uid) window.location.href = 'onboarding.html';   // no profile yet, or one saved without finishing
    }
  }catch(_){}
})();
</script>
